input:
  title: In India, regulators are deciding the fate of sensitive data behind closed
    doors
  parent: But the processes are happening exactly because people were complaining
    in the first place. Public pressure is necessary for systems to act. I don't think
    it makes much sense to say they should just stop worrying now because the system
    can sort itself out.
  target: It's just like if a bunch of people who don't understand medicine tried
    to diagnose a patient in front of a doctor, they would just complicate the situation.
    It's more productive to have faith in the skills and knowledge of those we employ
    to manage these systems. They were trained for this and are the very best at what
    they do. They were trained for that! Remember, armchair experts often overlook
    the years of study these professionals have.
