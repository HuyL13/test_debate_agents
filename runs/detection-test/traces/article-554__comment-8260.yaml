  target: Reading the facts of the article I always love when people use the law to
    protest or overturn something that they think is wrong in government. I do find
    it hasty to jump on the band wagon because the article doesn’t have enough information
    on why the newly appointed Prime Minister is unfit. There is nothing said about
    his education, experience or public approval ratings just the feeling that he
    is unpopular among some of the people. If you look around the world nobody in
    office holds a 100 percent approval rate.
