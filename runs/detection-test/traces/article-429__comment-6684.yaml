  title: Tunisia has a disinformation problem, but (further) criminalizing speech
    won't solve it
  parent: ''
  target: The Tunisian government officials that withdrew the bill made a good decision
    by pulling it from consideration. It is obvious that a group like the ACLU would
    definitely denounce this bill, so you know it's a terrible law. I was already
    skeptical of the bill, but when I realized they would agree with me it became
