  counterargument:
    decisive_counterargument: 'Target claims we must ignore the Beanie Man song because
      other societal problems are worse, implying that focusing on one issue will
      detract from addressing the others. This is a classic appeal to worse problems:
      the existence of more severe problems is used to dismiss or minimize the importance
      of a valid concern. You can simultaneously address the broader societal issues
      and also critique the song’s harmful content; dismissing the song does not eliminate
      the problem it raises.'
    candidate: Appeal to Worse Problems
    challenged_inference: Because there are larger societal issues (poverty, racism,
