input:
  title: Why Did Women Journalists Strike in Spain?
  parent: Wouldn't protesting to their bosses or on air do more than what the government
    is doing? The protesting is important, it's just they seem to be yelling at the
    clouds. What can protesting in the street do to help what's going on in their
    job's building? Even a famous social scientist Dr. John Doe suggested that targeted
    dialogue to those directed involved with an issue will be more impactful than
    public demonstrations in certain cases. I would think the emphasis would remain
    on dialogue and progress and not public displays that won't really bring the change.
  target: I think these brave female journalists in Spain can do plenty by protesting
    in the streets, it's important to get the word out about injustices to the common
    folk. I also am skeptical about your expert, I have never heard of this 'famous'
    Dr. John Doe. It honestly sounds like a very generic and made up name and only
    serves to denigrate your argument. I would hope that next time you would impart
    some of the qualifications of this Doctor, it would greatly improve the believability
    of his inclusion. Either way, Spain needs to close this pay gap and up the representation
    of women in the media. I am hopeful that almost all experts and commoners could
    find agreement in this!
initial_analysis:
  structure:
    evidence_spans:
    - experts and commoners
    - almost all experts and commoners could find agreement in this
    - Spain needs to close this pay gap and up the representation of women in the
