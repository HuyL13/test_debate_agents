  counterargument:
    decisive_counterargument: Simply pointing out that other governments have implemented
      censorship does not in itself justify the practice for this country; the fact
      that a government chooses a policy is not evidence that the policy is effective
      or morally right. Gov­ernments are not infallible authorities—many flawed policies
      are justified by citing other governments’ examples. Therefore, the argument
      that censorship might be acceptable because it has happened elsewhere relies
      on an unjustified authority rather than on solid evidence, and the inference
      that such a policy is appropriate is fallacious.
    candidate: Appeal to Authority
    challenged_inference: Thus censoring for this country might be okay because other
      countries have done it.
    label_justification: 'The objection shows that the Target’s inference uses the
      policy of other governments as an argument for the policy’s correctness, which
      is a classic appeal to authority fallacy: it treats the mere fact that some
      authorities have enacted censorship as evidence that it is justified, without
      providing independent justification. The counterargument specifically targets
      this use of authority, making Appeal to Authority the most appropriate label.
      The instance is directly supported by the passage in T3 that notes governments
      copying each other’s practices, identifying the reliance on authority rather
      than empirical rationale.'
    failure_exposed: true
