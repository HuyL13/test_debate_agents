input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: It is natural to jump to the conclusion that all censorship is wrong. We
    have to stop attributing our own culture to totally different countries. What
    is right in one culture may not necessarily be the same in another.
  target: I agree that in most cases, you can't compare cultures with other cultures
    for different countries. Not everything should be compared like that. However,
    sometimes governments look to how others are ran and get ideas. So censoring for
    this country might be okay for them, another country will see how well it worked
    for them and want to do the same. It's important to find the balance and not disregard
    something as "That's what we do so it's wrong" or "That's what they do so it's
    up to them to figure out." In the end, something is being influenced. It is a
    delicate balance.
