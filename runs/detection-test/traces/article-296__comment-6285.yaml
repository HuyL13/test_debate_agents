    challenged_inference: The fact that some members did not help draft the Aadhaar
      Act implies the committee is unbiased, and therefore every member is a die‑hard
      protector of citizens' privacy rights.
    label_justification: The objection explicitly shows that the argument makes a
      conclusion about the entire committee based on the actions or characteristics
      of only a subset of its members. This is the classic pattern of a hasty generalization—jumping
      from a limited sample to a universal claim about a population.
