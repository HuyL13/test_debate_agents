  counterargument:
    decisive_counterargument: The argument conflates having a few members who did
      not draft the Aadhaar Act with the claim that the entire committee is unbiased
      and that all its members are dedicated privacy defenders. Whether or not a few
      individuals were involved in drafting the Act or were selected to provide a
      ‘neutral’ perspective does not logically entail that every person on the committee
      shares the same commitment to privacy or that their selection alone guarantees
      unbiased deliberations. The presence of some neutral members is an insufficient
      basis for concluding that the committee as a whole has a uniform stance or that
      every member is a die‑hard protector of privacy rights.
