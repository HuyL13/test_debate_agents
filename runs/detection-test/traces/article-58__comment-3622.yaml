input:
  title: COVID-19 revives grim history of medical experimentation in Africa
  parent: ''
  target: 'It''s good to be skeptical of outsiders coming into Africa and possibly
    using Africans as guinea pigs, but as long as proper protocols are followed and
    ethical standards are upheld, I think it would be unwise to not accept the outside
    money and the assistance of pharmaceutical companies in this instance. There need
    to be tests done to find a vaccine for this new virus, and it might as well be
    done in Africa.


    Indeed, this situation could end up being a godsend for getting more funding for
    life-saving vaccines into more bodies on the continent. It seems like a great
    opportunity for a traditionally under-served people to get access to new medicine
    and new medical treatments.'
