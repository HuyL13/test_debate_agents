input:
  title: Citizens from Chinese city on lockdown roar ‘Beijing has abandoned Wuhan!’
  parent: The officials in Wuhan have quarantined the city prematurely. Perhaps this
    outbreak could have been contained without treating the people like prisoners.
    Certainly there were other things that could have been done in order to contain
    the virus that didn't make the people feel like they weren't appreciated. Maybe
    we could have tried some alternate medicine methods or something to treat it before
    quarantine.
  target: I also feel the harshness of the quarantine measures was beyond what was
    necessary to address the outbreak. I don't know that alternative medicines would
    have been an effective option to address the outbreak either, but the government
    could have taken some measures that both addressed the potential seriousness of
    the virus while also respecting the basic rights and dignity of its citizens.
    Expanding health care options temporarily, making masks more readily available,
    and encouraging people who were feeling sick to limit their activity to staying
    home or seek medical care would have been a potential alternative way to deal
    with the crisis in a less brutal manner. This was a truly difficult time and the
    government had to make difficult decisions without a whole lot of time to think
    through the ramifications, but positive and direct communication with people in
    the city as well as neighboring areas would have cut down on anxiety and panic
    feelings, helping to improve things. Wuhan's residents were resilient during a
    really challenging period and should be praised for how well they persevered through
    the adversity.
