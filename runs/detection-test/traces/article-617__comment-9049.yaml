input:
  title: 'Cameroon: Report the Anglophone conflict and perish'
  parent: This just seems to be another typical result of colonialism. Is it ever
    any different? I feel like all the news I see suggests not. The impacts of colonial
    rule are always just that of suffering and injustice.
  target: I agree completely. Colonialism really seems to be the trunk of the issues
    here, but what about the root? Shouldn't there be a focus on what is causing colonialism
    in the first place? In the global space, there are issues like hunger, incurable
    diseases, and rampant corruption that are much much worse but aren't considered.
    These issues seem like they are never ending but if we think about it, they get
    less attention compared to colonialism. Wouldn't you consider them more important?
    Imagine the effort spent on decolonization being redirected to those problems?
    They could be solved in no time and the domino effect of those issues being solve
    might shift to colonialism being solved as well. It might be worth looking into,
    don't you think?
