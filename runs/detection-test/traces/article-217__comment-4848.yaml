  counterargument:
    decisive_counterargument: 'The claim that ‘everyone wants women to be treated
      correctly and with respect’ is used to justify listening to all sides and investigating
      the accusations against the three men. This relies on an appeal‑to‑majority
      claim: it assumes that because a purported large group holds a view, that view
      itself is a valid reason to act. The target provides no evidence that this group
      really exists or that its preference determines the correct course of action.
      Therefore the inference that we must proceed based on this supposed majority
      sentiment lacks substantiation and is a fallacious argument, specifically an
      appeal to majority.'
