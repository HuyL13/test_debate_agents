      claim about a broad group—‘everyone’—to justify its reasoning about investigating
      the men. This is a classic appeal to majority fallacy: the argument treats the
      popularity of an opinion as evidence for its truth or as a sufficient basis
      for action, which is precisely the reasoning defect identified.'
    failure_exposed: true
