    decisive_test: 'The target explicitly appeals to the idea that a broad group—“everyone”—wants
      women treated correctly and with respect, and then uses that widespread sentiment
      to justify investigating and acting against the three men. This is a classic
      appeal to majority, where the popularity of a view is treated as reason to act.
      The structure of the argument is: majority view → justification for action,
      without any evidence that the majority actually exists or that its preference
      constitutes a rational basis for the specific action. The target does not present
      a sample or a portion of the population that is being generalized to the whole
      (the structural condition for hasty generalization). Hence the mandatory structural
      condition for headline “appeal to majority” is directly satisfied, whereas the
      condition for hasty generalization is not met, because no explicit sample →
      claim transition is present.'
