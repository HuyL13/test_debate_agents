  title: In Azerbaijan silence looms as yet another member of LGBTQ+ community is
    fatally targeted
  parent: ''
  target: The struggles of the LGBTQ+ community are so heartbreaking and it seems
    they never catch a break in some countries. It's understandable that the people
    in the countries feel uneasy about breaking what is traditionally done. It can
    sometimes be a tightrope walk to rethink a tradition with what's right and what's
    traditionally wrong. If you gave LGBTQ+ more freedoms, who can say what community
    is next with wanting the same rights? This could end up being a snowball effect
    of the worst people in the world wanting rights owed to them. It could be a pathway
    to more uneasy changes, we should be treading lightly on these changes.
