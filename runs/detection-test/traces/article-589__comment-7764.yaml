  title: In Azerbaijan silence looms as yet another member of LGBTQ+ community is
    fatally targeted
  parent: ''
  target: If bloggers and social media influencers are allowed to incite violence
    against one group of people for whatever reason it is only a matter of time before
    another group is targeted for another reason. Nobody is safe if law enforcement
    and decent citizens and the government look the other way at violence against
    any group. There needs to be strict regulations against hate speech of any kind.
