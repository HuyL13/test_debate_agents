    candidate: Hasty Generalization
  goal:
    conclusion_or_goal: Adults should be the ones deciding climate policy
    candidate: Appeal to Authority
    supporting_reason: Adults have experience and thus know what to do, while kids
      lack this knowledge
    support_relation: The reason that adults are experienced and kids are not is used
      to justify the claim that adults must run climate policy
    label_justification: The argument relies on asserting that adults possess the
      authority to decide due to their experience, treating this expertise as proof
      that they should lead, which is an Appeal to Authority fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Making decisions on climate policy because some KIDS think its best is insane.
      Adults run the country. They know what to do as they have the experience. Kids
      are kids
    - and don't know what they're even protesting. There's a reason we don't let kids
      be politicians.
  counterargument:
    decisive_counterargument: The claim treats adults’ experience as a guaranteed
      indicator of superior policy judgment and dismisses children simply because
      they lack formal authority. However, experience does not ensure correctness—many
      well‑intentioned experts have made poor policy choices, and valuable insights
      can arise from those who are new to a field. By reducing climate decision‑making
      to a blanket preference for adult expertise, the text ignores the potential
      competency and innovative ideas that children and youths can contribute. Thus,
      the inference that only adults can or should decide policy is unjustified and
      falls into an appeal to authority.
    candidate: Appeal to Authority
    challenged_inference: Because adults have experience, they are always better decision‑makers
      for climate policy than children; therefore children’s views should be ignored.
    label_justification: The argument explicitly invokes adults’ experience as a sufficient
      reason to override children’s perspectives on climate policy. It relies on the
      claim that authority (i.e., being an adult with experience) is automatically
      the best source of judgment, which is the defining characteristic of an appeal
      to authority. The reasoning does not provide evidence that such experience correlates
      with better outcomes, merely assuming it does.
