input:
  title: The first recorded two-headed banded kukri snake discovered in Nepal
  parent: If we are finding two headed snakes then there must be something in the
    water, I bet man is polluting the area. There is no other possible answer. When
    weird shit happens, its always us that causes it.
  target: I agree, it is very odd to find two-headed snakes in the same area. It reminds
    me of research that Dr. Jake Jacobson has done over the years. He had published
    a famed paper on this subject about how the water is so contaminated that there
    was traces of nuclear waste. I agreed with him until Janie Janet released her
    evidence against there being any nuclear waste in the water there. It's hard to
    believe that Jacobson knows what he is talking about when he claims such a thing
    that can easily be proven wrong. Comparing both conclusions, you really don't
    know what to believe. I guess we need more studies on the topic. I wonder if there
    are other tests out there that can be done?
