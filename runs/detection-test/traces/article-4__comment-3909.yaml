input:
  title: Citizens from Chinese city on lockdown roar ‘Beijing has abandoned Wuhan!’
  parent: I think it's pretty clear the government simply couldn't do more and those
    complaints are not really reasonable. It's easy for armchair experts with no understanding
    of the actual issue to make those kinds of comments, but it's not fair. Either
    they did what they did, which probably saved millions, or they did nothing and
    many more would have died. It's hard to see any other options.
  target: It's wild to me that you think the government couldn't do more. We are talking
    about the Chinese government. Of course they could do more since they had information
    they were more than likely trying t suppress from the world about this virus and
    what it would do to a city. They could have used that information to begin to
    mobilize the equipment they would need in order to better support the residents
    of Wuhan once they knew they would quarantine and shit down the city. We all should
    stand with Wuhan and its residents at this moment. They have been let down by
    their government, and that saddens me.
