input:
  title: Myanmar introduces ‘draconian’ cyber security bill amid growing anti-coup
    protests
  parent: They have a coup going on right now. Maybe they should be organizing to
    take control over their government first and focus on the internet after! What's
    more important, the internet or the military trampling over everyone?
  target: There are a host of human rights violations being committed systematically,
    but throttling the internet is a catastrophic blow to transparency, information
    access, and other very basic needs. This isn't just about sharing cat videos.
    This is about keeping a population under control, like North Korea. Addressing
    the internet ban doesn't diminish other human rights issues, which are very important;
    in fact, a free internet could expose those issues to a wide audience. Government-imposed
    internet blackouts need to be called out wherever they crop up.
