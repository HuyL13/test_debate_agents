      loss of transparency and basic needs
    label_justification: The objection shows that the inference is unsupported; the
      argument leaps from an unspecified claim of human rights violations to a universal
      causal claim about internet throttling, fitting the definition of a hasty generalization.
      No other fallacy type is more directly captured by this reasoning flaw.
