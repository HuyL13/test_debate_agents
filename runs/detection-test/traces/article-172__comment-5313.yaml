    decisive_counterargument: The claim that workers’ concerns about jobs are “often
      used to push back against protecting the environment” is an overgeneralisation.
      It asserts a universal pattern of political strategy without presenting evidence
      that such concerns are always weaponised to avoid environmental policy, or that
      this is the main or only motive behind opposition. Without data showing that
      the vast majority of job‑related arguments are actually attacks on environmental
      goals, the statement falls into the hasty‑generalization fallacy.
