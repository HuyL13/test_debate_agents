input:
  title: Australian court's historic rejection of coal mine highlights the impact
    of climate change
  parent: Most people will agree that while being more responsible for our actions
    that affect the environment is important, so is the fact that people should be
    able to provide for their families. Jobs are important as well.
  target: Both things can be done at once. Too often, concerns about jobs and how
    workers in these sorts of industries will be negatively affected are used to push
    back against protecting the environment. There should be more focus on talking
    about how to create whatever combination of job training, welfare, and other such
    transition programs to help these people while we make the necessary changes,
    like stopping new coal plants.
