input:
  title: '30 years after the Tiananmen Massacre: An interview with survivor Zhou Fengsuo'
  parent: It's natural to feel a need for justice when wronged. The survivors will
    continue to seek what's right. The CCP on the other hand will continue to suppress
    any opposition to their agenda.
  target: It may be natural to want justice when you are wronged, but does that make
    it right? Does it even matter if it feels natural or not? I would imagine a lot
    of horrible things seem natural to a mentally unwell person. Does that make them
    okay? I feel that the survivors of the Tiananmen Massacre deserve to have justice,   not
    because it is natural but because the pain they have suffered. Do you see the
    difference there? We agree mostly on this, but I think we should leave behind
    the naturalness of things.
