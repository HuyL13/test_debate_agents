  title: As Ebola outbreak ends, coronavirus begins in DR Congo
  parent: Travel to Africa should be avoided if possible. Africa is such a vast place
    yet Ebola is concentrated there. We should not bring any instances of this disease
    back to our country.
  target: I agree with that in general. But when it comes to Covid, it's already everywhere
    so that shouldn't be the reason to avoid traveling to just an African country.
