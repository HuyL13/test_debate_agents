  counterargument:
    decisive_counterargument: The claim that 'everything is rape' rests on the unjustified
      premise that every form of contact—whether physical touch or eye contact—represents
      rape. In reality, contact can be consensual, friendly, or entirely nonsexual,
      and eye contact alone never constitutes a sexual act. By equating all contact
      with rape the argument wrongly treats a specific definition (rape as a non-consensual
      sexual act) as if it applied to all interactions. Such a sweeping conclusion
      drawn from the few examples of contact mentioned is precisely the kind of improper
      generalization that a Hasty Generalization fallacy represents.
    candidate: Hasty Generalization
    challenged_inference: The inference that if any contact occurs, it is rape (and
      therefore protests or allegations should follow).
    label_justification: This objection points out that the target’s conclusion extends
      from a limited set of instances (physical contact and eye contact) to an unconditional
      statement that all contact is rape. That is a classic overgeneralization, exposing
      the Hasty Generalization fault rather than merely criticizing the argument.
    failure_exposed: true
