input:
  title: Internet blocked as protests intensify in northeast India against the Citizenship
    Amendment Act
  parent: ''
  target: Because the accord has worked for thirty years, there is no need to believe
    that it was right or correct in its aims. The new act is just as bad but people
    seem to have a real issue with it now. People always lean on what is familar so
    they tend to want to dismiss the new act. The old accord sought to expel refugees
    based on religion and did so while the new act allows these people to stay and
    change the culture. I think that people are upset because they had a framework
    for years on how to deal with refugees and now that may be gone with this new
    act. Perhaps we need to take a step back and look at the past accord and see how
    bad this was for refugees and realize that we have evolved beyond this and should
    accept people regardless. the new act does not seek to change the country or its
    traditions but to merely allow for asylum seekers to have a home. Shouldn't this
    be our new aim for the country?
