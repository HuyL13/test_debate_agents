  counterargument:
    decisive_counterargument: The argument mistakenly assumes that a policy’s long‑term
      success automatically makes it morally right or that its shortcomings do not
      matter; it conflates effectiveness with ethical justification.  Just because
      the old accord functioned for thirty years does not negate its wrongful expulsion
      of refugees or prove that the new act is equally bad.  Moral evaluation requires
      more than tradition or longevity – the new act may be more just even if it is
      unfamiliar. The reasoning therefore commits an appeal to tradition by using
      longevity as evidence of correctness.
    candidate: Appeal to Tradition
    challenged_inference: Because the accord worked for thirty years, there is no
      need to believe that it was right or correct in its aims, so the new act is
      just as bad.
    label_justification: The objection directly targets the fallacy that standardizing
      success as proof of moral soundness, which is the core of an appeal to tradition.  It
      refutes the premise that longevity alone can establish a policy’s ethical validity,
      which is the specific reasoning failure the target argument presents.
