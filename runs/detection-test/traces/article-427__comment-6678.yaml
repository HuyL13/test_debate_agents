    supporting_reason: It claims that fairness is a subjective issue and differences
      in perception should lead to broader discussion and consensus.
  counterargument:
    candidate: null
    challenged_inference: The claim that a rule is unfair cannot be dismissed simply
      on the basis of subjectivity; fairness can be evaluated against objective criteria
      such as fairness principles, rights protection, or evidence of harm.
    decisive_counterargument: The target’s reasoning ignores that an unfair rule can
      have objectively harmful consequences that affect people’s wellbeing regardless
      of individual perceptions of fairness. The argument merely asks the other person
      to re‑evaluate their prejudice but offers no logical basis for dismissing the
      claim that the rule is unfair. It therefore leaves the claim unverified rather
      than logically undermined.
    evidence_spans:
    - Fairness is a very subjective issue and all of us will see it differently based
