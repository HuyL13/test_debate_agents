input:
  title: Sri Lankan Court temporarily bars disputed Prime Minister Rajapaksa from
    office
  parent: I'm confused. If there were two rejected no-confidence motions for him,
    why does the court think its okay to not allow him to be PM? Seems political to
    me. If you let the courts get political, you eventually get countries like Russia
    and Nazi Germany. Before it gets that bad, it could lead to the opposition being
    barred from holding office ever again, or political prisoners being taken.
  target: Presumably a no confidence motion isn't the only method someone might be
    disqualified from office. Like it says, they're not permanently stopping him from
    taking the role. They are just blocking it for the time being until the petition
    can be heard in court. That doesn't sound especially like Nazi Germany or anything.
    Let's wait and see how this plays out. Hopefully a fair resolution will be reached.
