  counterargument:
    decisive_counterargument: The TARGET claims that the parent’s statement “must
      focus on some bigger problem before we can worry about a problem” is fallacious,
      but this is an unsubstantiated assertion. The TARGET does not provide evidence
      that prioritising one issue over another necessarily renders the other irrelevant;
      it merely suggests that the problems can and should be addressed simultaneously.
      Hence the TARGET’s claim lacks support and does not constitute a rigorous logical
      attack. In other words, TARGET fails to show that the parent’s argument is a
      logical fallacy and instead makes an unjustified claim itself.
