input:
  title: 'Cameroon: Report the Anglophone conflict and perish'
  parent: Any sane human being should be horrified by these journalists losing their
    lives for telling the truth, but we must face a larger problem, that of deaths
    from poverty in Cameroon. Thousands of people die from not having enough food
    and clean water in Cameroon every single year. That seems like a much more urgent
    problem that the admittedly horrific murder of a few journalists, and we must
    slay the giant before battling the elves.
  target: It's fallacious to say that we must focus on some bigger problem before
    we can worry about a problem. While it's terrible for people to die from poverty
    and starvation in Cameroon, it's equally terrible for people's freedoms to be
    repressed and journalists and others arrested and killed for it. We can focus
    on both at the same time. Journalists like Lambert Kehven, Samuel Wazizi, and
    Kingsley Fomunyuy are courageous individuals who brought truth to light, and we
    should support them in the fight for their cause. The suppression and terror they
    and others have faced is not a secondary issue but a horrifying reality that demands
    our immediate attention and response. It's high time we raise our voices and act
    now before it's too late!
