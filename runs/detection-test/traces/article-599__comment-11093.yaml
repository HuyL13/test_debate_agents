  counterargument:
    decisive_counterargument: 'The target assumes that a single arrest of a powerful
      figure automatically confirms that ‘justice reaches everyone,’ treating one
      event as proof that all rich or powerful people are held accountable. This leaps
      from a single case to a universal claim without any evidence that other cases
      will follow suit or that the arrest itself guarantees fair outcomes. Thus the
      argument is a hasty generalization: it over‑extends the significance of one
      instance to an entire class of people and to the entire justice system.'
