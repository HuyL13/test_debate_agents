input:
  title: Slovak businessman charged with ordering murder of journalist Ján Kuciak
    and his fiancée
  parent: It is good to see that an unsolved murder seems to be closer to being solved.
    I am concerned with all the jubilation over someone being charged in this case.
    Everyone seems to be acting as this person is guilty when it is just a charge.
    It is very frightening when we are immediately assumed to be guilty on just an
    accusation. What comes next after this? Will we just put people in jail for life
    upon being accused? After that seems to be accepted, will we just execute them
    before any trial? I understand people wanting justice but we must be careful when
    throwing out systems that protect the innocent. I hope we will all think about
    this and have discussion with others to make sure we don't lead ourselves down
    this dark path.
  target: I think it's more that they're celebrating the fact that someone so powerful
    is actually being held accountable. Whether they're ultimately found to be guilty
    or not is one thing, but the mere fact that they've been arrested is progress.
    It reassures the public that the rich and powerful aren't above the law, and justice
    reaches everyone.
