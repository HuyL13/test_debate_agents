input:
  title: In India, regulators are deciding the fate of sensitive data behind closed
    doors
  parent: The people just need to wait for the process to play out. The court made
    a good decision that they agree with, so those in charge obviously know what they're
    doing and what is right. Trust in the process and trust in the system and another
    good decision will follow. They are the ones making the decisions for a reason!
  target: But the processes are happening exactly because people were complaining
    in the first place. Public pressure is necessary for systems to act. I don't think
    it makes much sense to say they should just stop worrying now because the system
    can sort itself out.
