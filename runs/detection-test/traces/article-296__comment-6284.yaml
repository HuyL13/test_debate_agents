  counterargument:
    decisive_counterargument: The claim that public pressure is necessary for systems
      to act rests on a single instance where a procedure was triggered by complaints.
      That does not establish a general causal rule—other factors such as internal
      audits, legal obligations, or strategic business decisions can also initiate
      change. Assuming that complaints are always required commits a hasty generalization.
    candidate: Hasty Generalization
    challenged_inference: Public pressure is necessary for systems to act, so people
      should continue to worry and complain.
    label_justification: 'The inference draws a universal conclusion—from a single
      observed case that public complaints led to regulatory action—overgeneralizing
      that this causal relation holds in all future cases. This matches the definition
      of a Hasty Generalization: an explicit extrapolation from a limited sample to
      a broader population without sufficient evidence.'
