input:
  title: In India, regulators are deciding the fate of sensitive data behind closed
    doors
  parent: It sounds like much of the criticisms about all this are pretty minor and
    not something to be that concerned about. The country has to pass laws related
    to all this kind of stuff. Like most laws, it's probably not going to be perfect,
    but what else can they do? Whatever they do, someone will complain about it, so
    they either do nothing or just let the courts go through with the process.
  target: Waving off concerns as too simplistic may harm the efforts for overall freedom
    in the long term. The battle no matter how small should be done and never disparaged.
    Don't discount the small steps of progress, they can add up.
