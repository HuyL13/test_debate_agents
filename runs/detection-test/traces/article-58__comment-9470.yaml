input:
  title: COVID-19 revives grim history of medical experimentation in Africa
  parent: They need to get over what happened in the past and realize they are needed
    for testing if they want vaccines for their people. If they don't comply with
    testing vaccines, their people will end up dying. How don't they get this? They
    can't just complain about what happened decades ago if they want progress, can
    they? Lives are on the line!
  target: Why exactly are they the ones that need to be experimented on if they want
    vaccines for their people? Africans should get tested on so that Africans, Europeans,
    and Americans get vaccines? Why not conduct these fairly risky trials on Americans
    and then all those groups could get vaccines? The disparity in treatment is the
    whole point of the article.
