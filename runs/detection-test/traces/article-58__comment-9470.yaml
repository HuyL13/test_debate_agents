  counterargument:
    decisive_counterargument: The claim that Africans must be the sole population
      in whom vaccines are tested rests on the false premise that a single demographic
      group can provide sufficient safety and efficacy data for all other groups.
      Vaccine trials are intentionally designed to include diverse populations in
      order to capture differences in immune response, genetics, and disease prevalence.
      Conducting trials exclusively in one group would limit generalizability and
      could potentially endanger the very populations that rely on the resulting vaccines.
      Therefore, the inference that the disparity in treatment is justified is invalid.
