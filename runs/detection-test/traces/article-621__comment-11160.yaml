input:
  title: The first recorded two-headed banded kukri snake discovered in Nepal
  parent: While the main subject is interesting, I'm more concerned with the threat
    to the snakes in general. More must be done to protect them, for the sake of the
    ecosystem. If we don't ramp up protection efforts, they'll surely slip into extinction.
    And then that will just lead to greater collapse in the ecosystem as a whole.
  target: We must do more to protect snakes in the wild, too many are killed by humans
    that unnecessarily fear them. We also must do more to educate people on how to
    behave around them and ensure neither party ends up injured. While I agree with
    you on that aspect, I don't agree with you that this issue is sure to lead the
    greater ecosystem to collapse. Fear mongering is not necessary and will likely
    turn people away from the issue completely. All people need to understand is how
    integral they are to controlling major pests, do you know anyone who likes rodent
    invasions? I have yet to meet the person who does and this is a key element to
    winning support for protecting all snake species. Education, not fear, is always
    the best tactic to gain support for any critical issue. I hope that we all can
    do our part to ensure snakes are here and thriving in the years to come.
