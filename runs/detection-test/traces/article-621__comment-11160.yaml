  counterargument:
    decisive_counterargument: The target claims that nobody likes rodent invasions
      based solely on the speaker’s personal experience—“I have yet to meet any person
      who does.” This conclusion is drawn from an extremely limited sample (the speaker’s
      acquaintances) and is then applied to everyone. Such an overgeneralization of
      a small, non‑representative sample to the entire population is a classic Hasty
      Generalization, undermining the strength of the target’s broader claim that
      fear‑mongering is unnecessary and that education alone will suffice. The evidence
      for this issue lies in T4, which contains the direct statement illustrating
      the overreach.
    candidate: Hasty Generalization
