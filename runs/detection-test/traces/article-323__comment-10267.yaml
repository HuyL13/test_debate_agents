input:
  title: Should there be Shona-language versions of Google and social media sites?
    This Zimbawean technologist says yes
  parent: It's great that these people are making efforts to preserve their language.
    If such things aren't done, the languages just die out, as many have already.
    And where does that end? It extends to everything from music to literature to
    recipes to basic traditions. Before you know it, the culture is just a thing for
    the history books.
  target: Things that are beyond a lost language can still prosper. The language may
    die from lack of need, but other parts of the culture will live on if they are
    wanted. Keeping records of the culture can be done while still letting the culture
    change and fade. Technology can help with this as well and can make it hard to
    lose the past thankfully.
