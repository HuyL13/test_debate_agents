  counterargument:
    decisive_counterargument: The claim that, because no evidence currently exists
      against the opposition, Greeks, Russians, etc., we should not blame any of them
      is an argument from ignorance. It assumes that absence of proof equals proof
      of innocence, yet new evidence or overlooked data could still implicate any
      of those groups. Merely withholding blame in the face of insufficient information
      does not logically preclude the possibility that one of those parties is indeed
      responsible.
    candidate: Appeal to Authority
    challenged_inference: Since there is no evidence for any of the named groups being
      culprits, it is smarter not to quote them as responsible.
    label_justification: The objection stresses that the inference rests on the absence
      of evidence to conclude the groups are innocent. This directly attacks the shaky
      reasoning that non‑evidence serves as proof of absence, thereby exposing an
      appeal to ignorance rather than a legitimate appeal to authority or other fallacy.
