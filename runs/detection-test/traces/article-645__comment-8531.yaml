      on Facebook’s longstanding practice as a reason for its remaining unaltered,
      which is precisely the structure of an Appeal to Tradition fallacy: asserting
      that because something has been done for a long time, it should continue to
      be done. The counterargument refutes this by noting that tradition does not
      determine future actions or justify continued practice without supporting evidence.'
