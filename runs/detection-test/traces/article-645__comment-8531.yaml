  counterargument:
    decisive_counterargument: Facebook’s history of content moderation does not prove
      that its future policies will stay unchanged or that such policies are justified.
      Social media companies routinely revise their moderation guidelines, adopt new
      algorithms, and respond to public criticism; the fact that a practice has existed
      for years neither guarantees its permanence nor automatically renders it correct.
      Using tradition to argue that Facebook will always act the same way misses the
      possibility—and indeed the evidence—that corporate culture and policy evolve
      when new information or pressure dictates it.
    candidate: Appeal to Tradition
    challenged_inference: Because Facebook has historically censored content, it should
