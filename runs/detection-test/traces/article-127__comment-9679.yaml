input:
  title: How internet shutdowns in Myanmar have been endangering lives and affecting
    humanitarian work since the coup
  parent: Why is the focus on the internet shutdowns, and not that actual human rights
    abuses from the insecurity caused by the coup. There has been enough evidence
    based on the statistics to show that Myanmar needs more international intervention.
    It is important to get news out from the people in Myanmar, but we need to focus
    on the problem itself which is the insecurity caused by the coup.
  target: I agree that the actual abuses going on in Myanmar are frightening and need
    to be addressed, however that doesn't mean we shouldn't talk about them shutting
    off the internet to their citizens. In fact having internet access will only help
    raise awareness and let us understand what actual abuses are going on. If we allow
    the silence of the victims of this coup then we will never know the truth of what
    is actually happening, that is simply not acceptable. I feel that we can and must
    face both of these problems at the same time, anything else is just dangerous.  I
    certainly hope that the United Nations will step up here, way too little going
    on in terms of actual results.
