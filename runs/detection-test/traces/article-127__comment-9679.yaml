  counterargument:
    decisive_counterargument: 'The claim that we must confront both the abuses and
      the internet shutdowns simultaneously—otherwise we will never learn the truth
      and that’s dangerous—is not justified.  It presents only two alternatives: either
      we address both issues at once or we will be left in a catastrophic state.  In
      reality, we can still gather information about abuses through alternative channels
      such as satellite communications, dissent networks, or foreign observers, even
      if the internet is shut down.  Therefore the argument is based on an unfounded
      false dichotomy rather than sound reasoning.'
