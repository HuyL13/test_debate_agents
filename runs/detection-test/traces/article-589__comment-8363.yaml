  counterargument:
    decisive_counterargument: The mere fact that a group holds a certain opinion does
      not make it true, right, or ethically correct. Democratic legitimacy is not
      equivalent to the majority’s current convictions; it also requires safeguarding
      the rights and dignities of those who are in the minority. Laws and policies
      that deny basic human rights—such as the right to be free from discrimination—cannot
      be justified simply because most people oppose them. An appeal to the sheer
      size of the majority therefore misrepresents what democracy is about and ignores
      the principle that individual liberties must be protected even against popular
      sentiment.
    candidate: Appeal to Majority
    challenged_inference: The argument that the majority’s view on LGBTQ rights must
      be respected because it reflects democratic sentiment and by implication because
      the majority is ‘overwhelming’.
    label_justification: The target uses the majority’s number as evidence of the
      correctness or moral authority of their stance. This directly matches the pattern
      of an Appeal to Majority fallacy, where popularity or numerical dominance is
      inappropriately cited as a reason to accept a claim. The counterargument specifically
      shows that majority opinion alone is insufficient to vindicate the claims made,
      thus exposing that failure.
