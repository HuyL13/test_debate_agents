    - Most people would agree that losing a few thousand coal mining jobs in an effort
      to leave a livable planet for our children and grandchildren is a worthy sacrifice.
      There
  counterargument:
    decisive_counterargument: 'The argument relies on an analogy between past consumer‑technology
      transitions (radio → television → internet) and the imminent shift away from
      coal and oil. Treating the two scenarios as comparable ignores fundamental differences:
      energy infrastructure demands large capital, is subject to geopolitical pressures,
      and has significant economic and social consequences. The assumed smooth adaptation
      seen with radios and TVs gives no reliable basis for predicting how workplace
      displacement, supply‑chain disruptions, or environmental policies will unfold
      in the energy sector. Therefore, the reasoning falls apart by using a false
      analogy.'
    candidate: False Dilemma
    challenged_inference: The inference that because society successfully adopted
      past consumer‑technology changes, it will likewise accept and smoothly transition
      away from coal and oil.
    label_justification: The objection directly targets the argumentative structure
      that substitutes a historical technological case (radio, TV, internet) for a
      fundamentally different domain (energy) to justify the policy conclusion. This
      is the classic form of a false analogy, not merely an unsupported claim or a
      bandwagon move.
    failure_exposed: true
    evidence_ids:
    - T4
    evidence_spans:
    - and newspapers to the internet. These are things that people all have adapted
      to and accepted for the most part. Coal mining and oil drilling are going that
      same route.
