  resolution:
    winner: Appeal to Majority
    decisive_test: Appeal to Majority uses widespread support as the sole justification
      for the phase‑out of coal, explicitly stating that most people in Australia
      (and elsewhere) are on board and that, consequently, losing some jobs is a worthy
      sacrifice.  This fits the fallacy’s definition of relying purely on the number
      or perceived popularity of supporters to argue that a position is correct.  By
      contrast, Appeal to Authority requires an expert’s endorsement to justify a
      claim; while the text does mention that “most scientists agree…” (T3), the argument’s
      main thrust is the public’s majority viewpoint rather than the scientist’s expertise.  Therefore,
      the Appeal to Majority satisfies its structural condition exclusively, whereas
      the Appeal to Authority’s endorsement is secondary and therefore non‑definitive
      here.
    loser_failure: Appeal to Authority does not alone account for the justification
      of the coal phase‑out; the claim is not solely supported by expert endorsement.  The
      text’s key argument relies on majority sentiment—from T1 and T5—rather than
      on authority, so the discipline of Appeal to Authority does not exhaust the
      reasoning.
    evidence_ids:
