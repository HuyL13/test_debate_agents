  counterargument:
    decisive_counterargument: Your assertion that the majority is generally wrong
      and therefore should be down‑weighted is an example of a hasty generalization.
      The passage cites only a few vague episodes in which majority opinion produced
      undesirable outcomes, yet extends this single observation to claim that majority
      choice is unreliable in general. By overlooking the large body of evidence showing
      that majority voting is a statistically sound decision‑making method, the argument
      jumps from limited instances to a broad, unsupported conclusion.
    candidate: Appeal to Majority
    challenged_inference: not put so much weight on what the majority of people want
    label_justification: 'The objection directly targets the claim that majority opinion
      is inherently unreliable, which hinges on a universal negative conclusion drawn
      from a few examples. This is the classic pattern of a hasty generalization:
      a particular set of cases is generalized to a wide class without sufficient
      evidence. The counterargument therefore exposes a fallacious reasoning step
      rather than merely pointing out a weakness in the argument’s content.'
