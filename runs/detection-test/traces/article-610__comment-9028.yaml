input:
  title: Burundi’s plastic bottle recycling still has some way to go
  parent: I don't understand, why doesn't the government put some recovery policies
    in place? Surely most people would be in support of that, right? The government
    should take a vote, or at least run some polling. If the majority wants change,
    which I think they definitely would, then they should implement that change rapidly.
  target: I get what you are saying and most of it does make a lot of sense. I just
    would not put so much weight on what the majority of people want. At times the
    majority have had some rather terrible ideas, they were able to use their combined
    weight to force them into existence. I don't feel as if this is one of those cases,
    but we should always be cautious in our approach to such matters. It never hurts
    to use some critical thinking, right?
