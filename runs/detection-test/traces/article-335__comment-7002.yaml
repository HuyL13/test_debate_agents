    decisive_counterargument: Claiming that China’s current strength guarantees that,
      in 30 years, its authorities will not change or allow memory of 1989 simply
      extrapolates from a single snapshot of the present political situation. Over
      three decades, political, social, and economic dynamics can shift dramatically—new
      generations of leaders may emerge, domestic pressure for openness could rise,
      or international norms might influence domestic policy. Thus the conclusion
      is drawn from an inadequate sample and therefore rests on an over‑broad generalization.
