  counterargument:
    decisive_counterargument: The fact that a large number of people have written
      tweets or shouted slogans does not automatically make their collective wish
      the only legitimate basis for governing. In a democracy, legitimacy is derived
      not merely from a majority opinion but from a system of representative institutions,
      constitutional safeguards, and protections for minority rights. Assuming that
      the majority’s will is inherently correct ignores the possibility that it may
      be misinformed, coerced, or outright wrong about the best course of action.
      Thus, the claim that “the will of the majority is the only right thing” is unfounded.
