input:
  title: Slovak businessman charged with ordering murder of journalist Ján Kuciak
    and his fiancée
  parent: This is a great step in the right direction. Imagine how bad it could get
    if nothing ever came of these killings and these corrupt figures just found out
    they could get away with this kind of behavior. What eventually comes is practically
    a mafia state. Corruption and violence at every level.
  target: I agree that this is the right direction! More criminals that order murders
    should be brought to justice. I just wonder how many innocent people are being
    convicted of crimes due to corrupt figures being able to pay off the right people.
    We should be aiming for more thorough investigations and should not lose the sight
    that everyone is innocent until proven guilty. It's the core belief of the whole
    judicial system.
