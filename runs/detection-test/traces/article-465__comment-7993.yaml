input:
  title: 'Across the Middle East, many women face a double threat: Abuser inside,
    virus outside'
  parent: I wouldn’t be surprised if the suicide rates of women in those countries
    was at an all time high too. It’s either live in fear or risk even more violence
    if you try to get help. We need to be addressing the issue of violence against
    women that was already there long before COVID.#Itstimeforachange
  target: 100% agreed! Suicide rates and the violence against women needs to be looked
    at. Have you considered the domestic violence against men in this situation? The
    focus is always on the women who are battered by their partners but the number
    one reason of suicide for men is domestic violence with 1 out of 7 men (that's
    13.8%) have been assaulted by their partners at some point in their life per NCADV.
    This is something we need to look at closely and carefully because it is an alarming
    statistic. Sure, traditionally speaking, domestic violence has long been associated
    with female victims. That's not incorrect, there are way too many of those but
    it's not completely correct and cover the whole scope of domestic violence victims.
    We need to hear from all victims, men and women. Doing it will not discredit the
    female voices, but will enrich the concept of justice when we see all sexes be
    held accountable.  This battle should be a shared one so no one is left behind
    and all voices are heard loud and clear!
