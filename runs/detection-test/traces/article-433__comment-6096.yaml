  title: Remembering Amadou Diallo, a Guinean victim of police brutality in the USA
  parent: ''
  target: So true! Police brutality has really taken a huge jump in recent years.
    I just wonder would is going to happen in the future if the police keep on the
    track they are on now? Will it get worse? I can't imagine it being better. Aggressive
    policing continues to go unchecked and if it keeps happening, we might see a huge
    increase in conflicts, not only with minorities but with other groups too. It
    is so scary to think that if we don't do something now, we can be witnessing the
    deterioration of societal peace. Police should be respect, but they make it hard
    to do that when they continue to use brutality toward people, especially minorities.
    Right?
