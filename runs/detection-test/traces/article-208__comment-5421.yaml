input:
  title: Artist Jasmine Thomas-Girvan taps into the ‘eternal connections’ of Black
    Caribbean ancestry
  parent: I like the fact that the artist is able to take both the good and bad from
    her homelands history and turn it into beautiful and meaningful artwork. I think
    this is a way to engage the audience in a way that will be profound. I think that
    we can all agree that art can help us confront and heal from our past.
  target: 'Why focus on the traumatic past of colonial times with your art? You could
    make an actual difference if you used your art to bring attention to important
    issues of today! I''m sure your home country is still not in great shape after
    all! Like Banksy, for instance: He uses art to wake people up to modern issues
    like war and economic problems!'
