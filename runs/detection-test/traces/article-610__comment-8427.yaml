input:
  title: Burundi’s plastic bottle recycling still has some way to go
  parent: I don't understand, why doesn't the government put some recovery policies
    in place? Surely most people would be in support of that, right? The government
    should take a vote, or at least run some polling. If the majority wants change,
    which I think they definitely would, then they should implement that change rapidly.
  target: I agree that the government has to improve their recover policies, however
    I disagree with putting so much weight on the majority aspect of this issue. While
    the majority of the people often tend to agree on subjects it doesn't mean that
    they are correct in their judgement. I believe it is important for us to think
    independently and that we should elevate independent voices whenever we can. People
    who think differently can help us learn and grow as a culture. Also we can get
    caught up in group thought which can end up being very destructive in certain
    instances. Can you see where I am coming from on this?
