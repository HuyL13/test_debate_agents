  counterargument:
    decisive_counterargument: The claim that trust will inevitably erode simply because
      it is ‘human nature’ treats an assumed fact (that humans naturally lose trust
      under stress) as if it fully explained the observed outcome. However, no evidence
      is provided that this is the sole or even a major cause—other factors (political
      policies, propaganda, economic incentives) could also shape trust. The argument
      is therefore an *Appeal to Human Nature* (sometimes called an *Appeal to Nature*),
      where the presumed natural tendency is presented as a definitive explanation
      without supporting evidence.
