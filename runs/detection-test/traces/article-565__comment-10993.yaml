  discriminator: Hasty Generalization requires explicit cases/sample -> broader population/class.
    Slippery Slope requires action/condition -> progressively worse consequences.
  resolution:
    winner: Slippery Slope
    decisive_test: 'Slippery Slope requires a causal chain from an initial event to
      increasingly adverse consequences. The target presents a progression: citizen
      silence → government interprets it as acceptance → regime behaves unchecked
      → inevitable regression to full military dictatorship. The text explicitly lays
      out this chain, satisfying the structural condition of a slippery‑slope argument.
      In contrast, although the argument contains a sweeping claim (“any regime leans
      toward obtaining more power”), this claim is part of the same causal chain rather
      than an independent, isolated generalization from a single sample. Thus the
      dominant fallacy is Slippery Slope.'
    loser_failure: Hasty Generalization would need a clear sample–>population leap
      that is independent of a progression; the target’s main claim is presented as
      a chain of consequences rather than an isolated generalization. The argument
      does not isolate a single case and generalize it outside the context, so Hasty
      Generalization is not the primary fallacy here.
    evidence_ids:
