input:
  title: '2021: A fruitful year for Indigenous communities in Taiwan'
  parent: I feel like just because they're indigenous doesn't mean that the majority
    of the nation should base economic and environmental laws around what they want.
    The majority of the nation is not indigenous, so their wants and needs should
    be given more weight. That solar plant and nuclear plant that they stopped could
    probably have really helped the entire economy there.
  target: I don't believe anyone is suggesting that minorities should be the dictators
    of their countries or something. Just that their concerns and needs should be
    taken into account when making decisions, such as their concerns about the nuclear
    power plant. Without doing that, you just have a tyranny of the majority. And
    ultimately, the indigenous people alone didn't make that decision. As noted in
    the article, a referendum voted on by all Taiwanese citizens is what stopped the
    power plant.
