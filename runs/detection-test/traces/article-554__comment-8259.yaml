input:
  title: Sri Lankan Court temporarily bars disputed Prime Minister Rajapaksa from
    office
  parent: There seems to be no doubt as to the wish of the people, who have tweeted
    and protested and made their will known. And the numbers don't lie. Isn't this
    a democracy? Doesn't a democracy thrive on the will of the people? It's time for
    Rajapaksa to bow to the will of the majority, which is the only right thing to
    do.
  target: What numbers are you referring to? Activists and people who tweet don't
    constitute democracy. The will of the people can only be represented by elections,
    not social media campaigns. It should say a lot that the people you're describing
    are the ones just telling him to quit and stop calling for elections.
