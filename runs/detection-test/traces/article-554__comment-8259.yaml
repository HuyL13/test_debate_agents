  counterargument:
    decisive_counterargument: The target mistakenly assumes that only elections can
      legitimately represent the people's will, treating social‑media campaigns as
      an entirely separate and invalid means. In reality, online activism often shapes
      public opinion and influences the eventual outcome of elections, and other forms
      of civic engagement (e.g., protests, petitions, town‑hall meetings) also contribute
      to democratic expression. By presenting only two options—elections or social
      media—the target commits a false dilemma, dismissing any other legitimate expressions
      of popular will.
    candidate: False Dilemma
    challenged_inference: Will of the people can only be represented by elections,
      not social media campaigns.
    label_justification: By limiting the valid means of representing public will to
      elections alone, the target ignores other legitimate channels such as activism,
      petitions, or protests, thereby presenting a false dichotomy.
