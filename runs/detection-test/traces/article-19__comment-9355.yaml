  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: ''
  target: Any government that tries to make it harder for journalists to do their
    job is not to be trusted. There is no good reason for it. The people of new guinea
    need to stop this in its tracks. If they let the government make it harder for
    jounalists, they will eventually try to make it like China and then the people
    won't be informed about anything.
