input:
  title: Remembering Amadou Diallo, a Guinean victim of police brutality in the USA
  parent: The fact that these cops were acquitted means that more cops are going to
    think they can get away with murder and end up killing innocents just because
    they think they can! If you don't punish people, obviously others will feel emboldened!
    Soon the cops will be the criminals! Who will stop them at that point?
  target: This might look like a slippery slope argument, but I agree with it and
    I think it's more like a warning. The threat of legal punishment for police officers
    who overstep their bounds will certainly make them thinking deeper about their
    actions, whereas the likelihood of escaping punishment will just embolden them.
    If there had been a pattern of justice for victims of police brutality, could
    further incidents have been prevented?
