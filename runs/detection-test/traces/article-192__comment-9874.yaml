input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: This is a standard Turk issue. They will restrict anything opposing the
    status quo. it's how the government can keep people in line. No other reason to
    block anything without a court order.
  target: Do people really think they need to be empowering football organizations
    of all things in the name of oppression? Maybe other uses of these laws are bad,
    but I somehow doubt the football organizations are going to do anything but block
    illegal broadcasts, like they claim. And should they not? The concept of needing
    a court order to block a live stream on a time-sensitive sports match doesn't
    seem sensible.
