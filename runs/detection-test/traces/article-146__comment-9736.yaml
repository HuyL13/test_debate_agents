input:
  title: This digital novel narrates the violence against ethnic Chinese during the
    1998 riots in Indonesia
  parent: This was an isolated event in response to a 30 year old rule of one autocrat.  It
    was not reflective of a cultural value of racial prejudice against Chinese in
    Indonesia.  This should not happen in a functioning democracy and the problems
    should not lead to this. For example it has not happened again since then and
    the problem has not come up before.  So no need to bring it up and push the issue.
  target: 'I disagree. As they say, those who do not learn from history are doomed
    to repeat it. This is a powerful story that is both a testament to a horrible
    episode in history, and a warning to readers about what can happen to vulnerable
    groups when the power structure of a society is in flux. It''s not just dwelling
    on a past event in one country--it''s a lesson for all societies to help them
    not repeat such mistakes. I''m happy it''s available digitally so it can reach
    a global audience. You should check it out: www.thechinesewhispers.com/en/'
