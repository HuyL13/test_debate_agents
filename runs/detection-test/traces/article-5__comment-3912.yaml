  title: Carlos Ghosn's great escape embarrasses Japanese government
  parent: Everyone who knows about Japans criminal justice system knows its insane
    and should be illegal. Even the tough on crime people in the US would say their
    process for holding suspects with no bail, indefinitely is absurd. He had every
    right to escape. I've read about this before and all the commenters agree that
    their system is BROKEN.
  target: Even if the system is broken does  that make it okay to just commit a crime
    and leave the country? He still needs to pay for his crimes. This sets a dangerous
    precedent. Instead there needs to be justice system reform.
