  discriminator: Hasty Generalization requires explicit cases/sample -> broader population/class.
    Slippery Slope requires action/condition -> progressively worse consequences.
  resolution:
    winner: Hasty Generalization
    decisive_test: 'The argument explicitly borrows from a single case—‘these cops
      were acquitted’—to make a claim that applies to the entire class of police officers
      (“more cops are going to think they can get away with murder and end up killing
      innocents”). That is the hallmark of a hasty generalization: an explicit sample
      is used to generalize to a broader population. While the statement also contains
      a casual progression (“if you don’t punish, they’ll feel emboldened, soon they’ll
      be criminals”), the progression is not a full-fledged slippery-slope argument;
      it is essentially the consequence of the generalized claim. Therefore the primary
      structural feature is a hasty generalization, and the slippery-slope characterization
      is not warranted in this instance.'
    loser_failure: The slippery-slope claim would require a clear sequence of increasingly
      adverse consequences stemming from a specific action or condition. The text
      jumps directly from a single acquittal to a generalized threat of police violence,
      presenting the latter as a direct inference rather than a chain of causal steps.
      Thus, it does not satisfy the explicit progression needed for a slippery-slope
      fallacy. The evidence for the claim that all cops will act violently is a clear
      generalization from an example, which fits the schema for a hasty generalization
      first and foremost.
    evidence_ids:
