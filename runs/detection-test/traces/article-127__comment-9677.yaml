  counterargument:
    decisive_counterargument: The argument that cutting off internet access is ‘evil
      and unnatural’ relies solely on the premise that naturalness equals moral correctness.
      Natural does not imply good or just. In crisis situations, curtailing communications
      can be a deliberate choice made to protect people, safeguard security, or prevent
      the spread of misinformation. Thus, the claim that denying communication is
      inherently evil lacks a valid normative link and merely appeals to the idea
      that what is natural is inherently good.
