input:
  title: Latin American Facebook users weigh in on US election results with memes
  parent: 'This was a fun article but here is a nitpick: the popularity of online
    memes and Facebook posts is not a reliable guide to public opinion. What would
    be helpful is a citation from an expert in Latin American culture and political
    opinion, someone who studies the trends and knows the numbers - someone like Dr.
    Pablo Gomez, for instance. But there''s nothing like that in this piece, so while
    I enjoyed it, I take it with a boulder of salt.'
  target: They don't have to be a reliable guide.  No one is using them as a scientifically
    perfect source.    They're a snapshot of what people are expressing.       The
    loudest people don't always represent the majority,  but they're the ones who
    control the conversation.    The great thing about international facebook memes
    is that we can see how various cultures differ from our own,  and how they're
    similar.
