  counterargument:
    decisive_counterargument: You are sweeping all authoritarian regimes into a single
      category – that they all form their rule solely through citizen suppression
      and that a free internet is therefore a direct threat to every authoritarian
      government. This blanket claim ignores the diversity of authoritarian practices
      and uses a single example (Turkmenistan) to justify a universal statement. Consequently,
      it commits a hasty generalization by making a broad claim about all authoritarian
      governments without sufficient evidence.
