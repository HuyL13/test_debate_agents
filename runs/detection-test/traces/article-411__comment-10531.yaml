input:
  title: New study finds internet censorship in Turkmenistan reaches over 122,000
    domains
  parent: Their government has got to be hiding something nefarious if they think
    its worth going through all this trouble. Maybe they are actively committing genocide
    on their people or something. Why else censor everything? Bottom line is that
    censoring the internet is to hide what they are doing to their people and prevent
    them from speaking out.
  target: I think you're jumping to conclusions. Turkmenistan isn't blocking the internet
    because it is committing genocide, as far as anyone knows. It's just that they
    are an authoritarian government, and like all authoritarian governments, they
    can only remain in power through suppression of its citizens, by controlling them
    economically and through propaganda. A free internet is a threat to their existence,
    which is why they block so much of it.
