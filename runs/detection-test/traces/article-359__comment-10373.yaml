  counterargument:
    decisive_counterargument: Just because the majority of people accept something
      does not prove that it is the best or most effective solution. Many factors—including
      misinformation, pressure, and lack of critical scrutiny—can influence public
      opinion, and a large number of people can still be wrong or unaware of the harms
      of a policy. Therefore, the argument that majority acceptance guarantees quality
      is logically unsound.
    candidate: Appeal to Majority
    challenged_inference: If the majority of the people accept the lockdown, then
      it is the best solution.
    label_justification: The objection shows that the inference relies on the popularity
      of a view as evidence for its validity, which is precisely the definition of
      an Appeal to Majority fallacy. The argument does not provide independent justification
      for the lockdown’s effectiveness, only that many people accept it, thus exposing
      the appeal to the majority.
