input:
  title: 'Video: Two months of lockdown in Kashmir'
  parent: This lockdown seems serious, doesn't it? When something like this happens
    it really makes you wonder if there's a better alternative. Are there just only
    two options - gritting teeth and bearing through or causing a full-blown revolt
    with potentially serious consequences? But, surely these aren't the only options
    during such a crisis. There must be other ways to navigate such difficult times.
    It's easy to feel trapped between gritting teeth and causing a revolt, but perhaps
    the real challenge is charting a different, more sustainable path through adversity.
    After all, aren't human beings capable of innovation and adaptability?
  target: If the majority of the people accept the lockdown, maybe it is the best
    solution. The power of the people can often give a good result. The government
    often does the will of the people and maybe this solution is the best option.
