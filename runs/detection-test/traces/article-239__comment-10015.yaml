input:
  title: The Caribbean speaks out on the climate crisis
  parent: Making decisions on climate policy because some KIDS think its best is insane.
    Adults run the country. They know what to do as they have the experience. Kids
    are kids and don't know what they're even protesting. There's a reason we don't
    let kids be politicians.
  target: 'Adults got us into this mess. Not kids. Maybe just because someone is an
    "adult" does not make them magically have the best ideas. Just because someone
    young or old has an idea does not make the idea more or less functional. These
    kids are out there trying to make a difference by simply planting some trees like
    Tristan Morgan is. I am pretty sure that is a task that any age group would be
    capable of to try to help combat climate change. I am sure that more trees is
    not going to hurt anything. I think if more people stopped and listened to the
    ideas presented by movements such as #ClimateStrikeTT and #AmazonChallenge, and
    judge the idea on its own merits instead of worrying about "who" it came from
    we would all be a lot better off.'
