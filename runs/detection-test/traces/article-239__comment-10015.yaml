  counterargument:
    decisive_counterargument: There is no evidence that all adults, or even a majority,
      are responsible for the climate crisis; many adults—including scientists, policymakers,
      and activists—recognize the problem and actively work to mitigate it. The blanket
      claim that adults caused the problem is unsupported because it generalizes over
      a group without data, ignoring the contributions and responsibilities shared
      across generations.
    candidate: Hasty Generalization
    challenged_inference: Adults got us into this mess. Not kids.
    label_justification: The inference attributes the entire blame for a complex social
      and environmental problem to a single demographic group, adults, without concrete
      evidence or data. This sweeping negative conclusion about a whole group, drawn
      from insufficient or non‑representative evidence, fits the definition of a hasty
      generalization.
