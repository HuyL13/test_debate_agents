input:
  title: Internet blocked as protests intensify in northeast India against the Citizenship
    Amendment Act
  parent: Things seemed to be working well the way it is without opening pathways
    for refugees from other countries. This act does not seem like it would be beneficial
    in any way to Assam or any other part of India. The Assam Accord has been working
    for over 30 years.
  target: I agree.  If it's not broke, don't fix it. And the people protesting show
    that they are not open to the idea.  If its because of lack of understanding,
    they need to work on educating their people before pushing any Acts through.   If
    the Assam was failing somewhere, they should explain to the people to curve the
    confusion.
