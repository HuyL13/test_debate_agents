  goal:
    conclusion_or_goal: Outlets in Hong Kong should continue publishing pro‑democracy
      articles, because doing so is the moral choice while shutting down or switching
      to pro‑China is immoral or worse.
    candidate: False Dilemma
    supporting_reason: The passage offers only two (or effectively three) options—continue
      pro‑democracy content (the moral thing), shut down (the cowardly way out), or
      switch to pro‐China (even worse). By framing the situation in this way it pushes
      outlets toward the pro‑democracy stance.
    support_relation: The binary framing of choices labels each alternative as morally
      charged (moral vs cowardly, even worse), thereby justifying the claim that continuing
      pro‑democracy coverage is the correct path.
    label_justification: The argument presents a limited set of options and claims
      they exhaust the possibilities, which is a classic false dilemma. This framing
      is used to persuade outlets to maintain a pro‑democracy position.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Outlets in HK either have to stand and fight by continuing to post their pro-democracy
