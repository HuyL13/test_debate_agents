  counterargument:
    decisive_counterargument: The statement asserts that because most people consider
      the massacre a travesty, any government that commits such an act ought to be
      removed. It uses the sheer number of people who hold that view solely to back
      the claim that removal is the correct response. However, knowing something is
      a travesty (a descriptive fact) does not by itself establish that a government
      should be ousted (a normative claim). The argument relies on the popularity
      of the opinion rather than on any objective criteria—such as evidence, legal
      process, or evidence of legitimate governance—to justify removal. This is a
      classic Appeal to Majority, where the premises hinge on how many people feel
      a certain way, and mistakenly treat that as sufficient justification.
    candidate: Appeal to Majority
    challenged_inference: Any government to do that should be removed
    label_justification: The objection directly exposes the reliance on the mass opinion—‘most
      people know the massacre was a travesty’—as the sole basis for the normative
      claim of government removal. Because the argument depends on the popularity
      of a belief rather than evidence or legitimate procedural justification, it
      fits the definition of an Appeal to Majority fallacy.
