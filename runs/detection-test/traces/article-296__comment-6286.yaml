  counterargument:
    decisive_counterargument: The claim that simply not knowing whether a government
      will back a citizen in a data‑breach scenario causes them real harm lacks any
      evidence linking this uncertainty to actual effects. It jumps from a vague lack
      of information to a concrete claim of suffering without demonstrating a causal
      connection.
