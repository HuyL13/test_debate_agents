input:
  title: How internet shutdowns in Myanmar have been endangering lives and affecting
    humanitarian work since the coup
  parent: Why is the focus on the internet shutdowns, and not that actual human rights
    abuses from the insecurity caused by the coup. There has been enough evidence
    based on the statistics to show that Myanmar needs more international intervention.
    It is important to get news out from the people in Myanmar, but we need to focus
    on the problem itself which is the insecurity caused by the coup.
  target: This is simply one article. In fact, the article explains that the internet
    blackout makes it harder for people there to show evidence of these atrocities
    taking place. I agree that there needs to be more outside help from international
    agencies however they can make that happen. However, if there is no way for people
    to communicate what is happening, it is going to be mighty difficult for anyone
    to help them. Certain infrastructure must be in place in a modern society to effectively
    deal with things like this. So much hinges on internet and networks like this
    to operate. It is important to understand that these people need to have the access
    to the internet in order to begin to address the humanitarian crisis there. I
    hope international agencies see an article like this and it spurs them to action
    to help these people that are being oppressed. I hope something happens that helps
    these people out, I feel for them.
