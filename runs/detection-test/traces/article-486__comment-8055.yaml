input:
  title: Password hack claim puts cyber security on the public agenda in North Macedonia
  parent: What's with all the baseless speculation? It was the opposition, Greeks,
    Russians, etc., etc. Seemingly with no evidence for any of them being the culprits.
    Seems smarter to not just throw out every name out there and cause unnecessary
    derision towards whatever group.
  target: Completely agree! When things like this happen, it is so easy to rush to
    the opposition like the Greeks or Russians and that rises and unhealthy stereotype.
    Everyone always suspects those groups to always be behind malice activity and
    it's often not the case. Each incident should be evaluated on its own merits.
    However, it seems that people have a tendency to prematurely blame certain groups
    without sufficient evidence. It's an unfair and unhealthy practice that we should
    all strive to change. We should educate ourselves and others about the importance
    of avoiding snap judgements like this.
