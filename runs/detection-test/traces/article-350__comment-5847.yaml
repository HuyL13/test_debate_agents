  counterargument:
    decisive_counterargument: The claim that refugees’ anonymity is a lesser concern
      because there is a more serious, ‘invisible‑refugee’ problem mixes two separate
      and independent obligations. Even if there remain many unregistered refugees,
      this does not automatically justify a secondary threat to their privacy. Ignoring
      privacy risks exposing refugees to future discrimination, family separation,
      or state surveillance – all legitimate harms that must be addressed. Hence,
      the premise that a worse problem can override a real, tangible harm to individuals
      is unfounded.
    candidate: Appeal to Worse Problems
    challenged_inference: The author infers that because there is a more pressing
      problem (invisible refugees), the privacy concerns of refugees can be neglected
      or are of lesser importance.
    label_justification: The objection directly attacks the argument’s claim that
      a more serious issue can and should be used to downplay another legitimate issue,
      which is the hallmark of an Appeal to Worse Problems. It does not merely criticize
      the argument but demonstrates that the reasoning falls into the specified fallacy
      by pointing out that the argument incorrectly treats the two problems as mutually
      exclusive when they are, in fact, independent concerns.
