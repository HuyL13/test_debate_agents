input:
  title: A 15-year-old rape victim is the latest collateral damage of Duterte's drug
    war
  parent: In authoritarian countries like this, police just always get away with their
    crimes. Even though it might have gotten worse under Duterte, the underlying problem
    has existed for as long as any of us have. It's going to be very hard for things
    to change given how normal some of these abuses have been. Hopefully they can
    put a lid on it and change things.
  target: "Not always.  You're making a hasty generalization.   It's rare for authoritarians\
    \ to hold their own forces to real standards,  but they sometimes do.  After all,\
    \   it's not good to be hated.     Smart authoritarians know to clad the iron\
    \ fist in a velvet glove, and bring the hammer down on real abuses.  You can't\
    \ really judge all of them by the actions of one.  \nDuarte hasn't read The Prince,\
    \  unfortunately.   He's just a thug in a suit,  a tough guy who doesn't understand\
    \ how to really rule.   He shouldn't brush these atrocities under the rug,   and\
    \ nor should we.  We should continue to raise awareness.   To demand accountability.\
    \    No one should be above the law."
