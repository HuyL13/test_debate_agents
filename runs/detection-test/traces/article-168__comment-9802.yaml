  counterargument:
    decisive_counterargument: 'The target claims that it is acceptable for Africans
      to vote for African candidates while white voters are labeled racist when they
      vote along racial lines. This sets up a false dichotomy: it implies that only
      one group can vote on racial identity without criticism, and that all others
      are automatically condemned. In reality, both groups face scrutiny, and many
      voters decide based on policy, not race. By framing the issue as a simple two‑choice
      ‘acceptable vs. racist’ split, the target overlooks the broader context and
      the fact that these judgments are not absolute.'
    candidate: False Dilemma
    challenged_inference: That it is acceptable for one racial group to vote along
      racial lines while such voting by another group is automatically labeled racist.
    label_justification: 'The objection points to an erroneous dichotomy presented
      by the target argument, demonstrating a False Dilemma fallacy. The analysis
      does not merely criticize the argument but identifies the specific logical failure:
      the proposal of only two mutually exclusive positions (acceptability vs. racism)
      that pretend to cover all possible attitudes toward racial voting.'
