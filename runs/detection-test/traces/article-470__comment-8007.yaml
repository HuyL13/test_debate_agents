input:
  title: Latin American Facebook users weigh in on US election results with memes
  parent: ''
  target: Does anyone else think we're going too far with making everything a joke
    and a meme and all that? Serious issues get made fun of constantly. Where will
    it end? I feel like if 9/11 happened today, the internet would be flooded with
    'funny' memes about it by the end of the day. Eventually, nobody will take anything
    seriously and we'll all suffer from poor governments because we'll be treating
    everything like a joke.
