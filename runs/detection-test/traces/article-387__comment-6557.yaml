  goal:
    conclusion_or_goal: People have a right to information that must be protected
      by freedom of the press.
    candidate: Appeal to Nature
    supporting_reason: Information is natural, essential, and like water necessary
      for life, therefore it should be guaranteed to everyone.
    support_relation: The naturalness and necessity claim is used to justify that
      people’s right to information requires protection through press freedom.
    label_justification: The argument appeals to the fact that something natural and
      necessary is inherently good/deserved, implying a moral obligation to protect
      it; this is an appeal to nature fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - It is only natural that people seek information. Something needs to be done
