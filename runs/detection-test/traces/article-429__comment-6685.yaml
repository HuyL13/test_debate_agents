    decisive_counterargument: You cannot conclude that a law is wrong simply because
      an unquantified majority of citizens would not be pleased with it. The value
      or legality of a policy depends on its merits, intent, and broader societal
      benefit, not merely on the composition of supportive versus opposing groups.
