  counterargument:
    decisive_counterargument: The claim that Hans Christians’ lack of religious affiliation
      automatically disqualifies him from commenting on religion‑related social issues,
      and that Ali Mustafa’s religious identity makes him inherently more credible,
      is an invalid reasoning. Religious belief is not a prerequisite for scholarly
      analysis of religiously ingrained problems, nor does it guarantee superior insight.
      Thus the inference that the second perspective is more trustworthy rests on
      a faulty appeal to identity rather than on evidence of expertise.
    candidate: Appeal to Authority
    challenged_inference: The inference that a person’s religious status determines
