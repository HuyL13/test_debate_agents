input:
  title: 'Across the Middle East, many women face a double threat: Abuser inside,
    virus outside'
  parent: ''
  target: The abuse it heartbreaking to hear about no matter who is happens too. I
    wish there was more being done about this in the Middle East. Renowned author
    and Middle East expert, Hans Christians, has a book about this topic where he
    says that it is a generational issue that will never be changed since it is ingrained
    with religion. He's not religious, so I am not sure what he would know about anything
    ingrained in the religion so how can we trust what he says? One would think that
    a cultural shift would end all the violence. In contrast, an Islamic religion
    expert and devote Islamic follower, Ali Mustafa, claims it is not solely a generational
    problem but an education and opportunity issue. His perspective, although different,
    seems to carry more weight. Isn't it apt to believe that a man who lives within
    the system could provide more insight on how the system works?
