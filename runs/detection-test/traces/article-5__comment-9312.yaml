input:
  title: Carlos Ghosn's great escape embarrasses Japanese government
  parent: He wasn't a saviour but I also like to see sometimes that people can work
    around the system to get their freedom. Reminds me of the stories my granddad
    told me about people outsmarting the man during prohibition. The good thing is
    the holes he used for deception will be plugged so the system should be better
    in the end.
  target: There's no justification for his escape; by doing so, it makes his guilt
    more apparent.  It is obvious that Japan's justice system needs significant reform
    but he wasn't Robin Hood. He committed serious crimes and needs to face the consequences.
    His position as a 'corporate titan' does not excuse his actions nor allow him
    to get away with what he has done.  Taking advantage of Japan's two-tiered justice
    system doesn't show any sort of superiority or 'right' - it's just another crime
    he needs to answer for.
