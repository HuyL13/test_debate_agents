    - of the day, a language used by only 10 million people, many of whom probably
      don't even use computers, isn't that big of a deal.
  counterargument:
    decisive_counterargument: Even if a language is spoken by a modest number of people,
      that number can still be significant and the lack of digital resources disproportionately
      hurts those communities. The size of the problem does not determine its worth;
      the cost of inaction and the principle of equitable access make a language‑specific
      AI effort valuable. Thus dismissing the effort because the language is smaller
      is misplaced.
    candidate: Appeal to Worse Problems
    challenged_inference: The target concludes that because the language is spoken
      by only 10 million people, the work on it is a waste of time.
    label_justification: The objection shows the target’s reasoning deflects a comparatively
      small problem by pointing to larger problems (e.g., curing diseases). This is
      a textbook example of an Appeal to Worse Problems tactic – arguing that a lesser
      concern is irrelevant because bigger ones exist. Our counterargument directly
      challenges that dismissal, proving the fallacy.
    failure_exposed: true
    evidence_ids:
    - T3
    evidence_spans:
    - of the day, a language used by only 10 million people, many of whom probably
      don't even use computers, isn't that big of a deal.
