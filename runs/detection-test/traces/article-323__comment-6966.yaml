    candidate: Appeal to Worse Problems
  goal:
    conclusion_or_goal: maintaining that building Shona-language versions of AI tools
      and social media is a waste of effort and should be abandoned
    candidate: Hasty Generalization
    supporting_reason: The claim that because the language has only 10 million speakers,
      many of whom probably don’t use computers, it is not “that big of a deal” and
      therefore not worth the investment
    support_relation: direct inference
    label_justification: The argument generalizes from a limited observation about
      the size of the speaker population and their presumed technology use to dismiss
      the worth of the language altogether, an instance of hasty generalization
    mechanism_supports_goal: true
    evidence_ids:
    - T2
    - T3
    evidence_spans:
    - don't need to rely on their native one. Spend your time using AI to help cure
