input:
  title: This digital novel narrates the violence against ethnic Chinese during the
    1998 riots in Indonesia
  parent: I don't think people should focus so much on the past. Both Indonesia and
    China have a lot of significant problems they're facing right now. There's ever-increasing
    repression in both countries, inequality, suffering of all kinds. Is now the time
    to try to heal the wounds of some 25 year old event that affected some small minority?
    That is the sort of thing you try to do after you've solved the bigger problems.
  target: Not acknowledging past wrongs is a dangerous game to play. By ignoring these
    types of events we leave the door open for them to occur again. We need to remember
    the past so we can learn from it and do better in the future. Ignoring one event
    leads to ignoring more events and eventually ending up with even worse consequences
    in the future.
