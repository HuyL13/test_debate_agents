  counterargument:
    decisive_counterargument: The argument assumes that because people naturally want
      access to information, it is morally or practically required that all people
      receive internet access.  Natural desire is a descriptive fact, not a normative
      standard; nothing about what is natural obligates us to provide universal broadband.  The
      step from a natural inclination to an imperatively‑required goal is unsupported
      and therefore invalid.  Conversely, the planning of equal internet access must
      consider costs, feasibility, and other priorities—not simply the naturalness
      of the desire.
    candidate: Appeal to Nature
    challenged_inference: Unique, proper, or built-in allowance for equality of internet
      access.
    label_justification: 'The objection shows that the claim relies on the appeal
      that something is ‘natural’ to justify the moral/policy imperative, a classic
      form of the Appeal to Nature fallacy: using naturalness as a reason to adopt
      an action without providing independent normative support.'
