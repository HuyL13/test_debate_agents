  counterargument:
    decisive_counterargument: The claim that we should focus our aid on children rather
      than on people who are voluntarily choosing to go hungry conflates two separate,
      unconnected problems and dismisses help to the latter group based solely on
      the fact that the latter are seen as worse. Helping anyone in need is not a
      trade‑off decided by emotional weight or the relative severity of their circumstances.
      Accordingly, the inference that energy should be better spent exclusively on
      children is unwarranted.
