  counterargument:
    decisive_counterargument: 'The text assumes that because people have a natural,
      innate wish to help others, governments will automatically respond by acting
      to protect women.  This is an *appeal to nature* fallacy: it lists a characteristic
      of something (the natural desire to help) and treats that being natural as evidence
      that it ought to or will be acted upon.  Naturalness provides no logical link
      to state behavior, and history shows many governments act contrary to natural
      inclinations.  Therefore the inference that leaders will tap into that desire
      and improve conditions for women is unsupportable just from the fact that helping
      is ‘natural’.'
    candidate: Appeal to Nature
    challenged_inference: The claim that leaders will act to help women because people
      have a natural desire to help others.
    label_justification: The objection shows that the inference relies solely on the
      claim that a behavior is ‘natural’ to justify that a particular policy outcome
      will follow, which is precisely the structure of an Appeal to Nature fallacy.  It
      does not merely criticize the argument but demonstrates that the reasoning falls
      into that particular error.
