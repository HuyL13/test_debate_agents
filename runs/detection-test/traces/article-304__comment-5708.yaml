  counterargument:
    decisive_counterargument: The premise that a law is unfair simply because the
      majority does not support it relies on the fallacious assumption that the will
      of the majority must always determine fairness. This ignores the possibility
      that a minority may need protections or that a minority may pose a risk to the
      majority’s well‑being, and it conflates popular support with moral or legal
      legitimacy. Rather than fairness being a function of majority opinion, democratic
      legitimacy more properly derives from the rule of law, constitutional guarantees,
      and the protection of minority rights—principles that can require legislation
      even in the face of a majority’s initial opposition. Therefore, the inference
      that minority‑driven legislation is unjust because the majority opposes it is
      unwarranted.
    candidate: Appeal to Majority
    challenged_inference: The argument that legislation is unfair simply because the
      majority does not support it is a fallacious inference.
    label_justification: The objection directly targets the reasoning that uses majority
      opinion to validate or invalidate a law, which is the hallmark of an Appeal
      to Majority fallacy. The counterargument demonstrates that fairness and legitimacy
      can be derived from principles other than majority support, thereby exposing
      the specific fallacy rather than merely criticizing the argument.
