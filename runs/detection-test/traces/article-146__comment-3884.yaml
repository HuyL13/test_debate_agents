  counterargument:
    decisive_counterargument: Just because Indonesia and China face pressing, large-scale
      challenges does not mean that addressing the wounds from a 25‑year‑old event
      is irrelevant or should be abandoned. The past can influence present conditions—unresolved
      injustices can seed ongoing discrimination, make societies vulnerable to future
      repression, and undermine the legitimacy of current reforms. Ignoring a specific
      historical grievance simply because other problems exist ignores the potential
      for these issues to be interlinked; in many cases, addressing past harms can
      actually strengthen efforts to tackle contemporary inequality and repression.
