  goal:
    conclusion_or_goal: The Japanese judicial system granted the defendant rights,
      such as bail or house arrest.
    candidate: Appeal to Authority
    supporting_reason: The speaker cites Japanese legal scholar Ichiro Suzuki, who
      claims the system is lax, especially for the wealthy, to infer that the defendant’s
