  counterargument:
    decisive_counterargument: 'The claim that authorities “know what is best for their
      people and society” merely invites an *appeal to authority*: the moral correctness
      of a law or policy is taken for granted because it comes from a government or
      religious leader, not because it has been justified on its own merits or subjected
      to independent scrutiny.  Who is the authority?  Law makers have sometimes promulgated
      statutes that systematically violated human rights (e.g., segregation laws,
      repressive regimes), and religious leaders are not universally recognized as
      masters of medical or ethical knowledge.  The rarity of the bad incident does
      not prove that the law is morally sound; it only points to the possibility of
      wrongful judgment.  Consequently, accepting the legality or the authority of
      the decision as a substitute for a genuine moral argument is a fallacious reliance
      on authority.  A better defense would require evidence that the law accomplishes
      a legitimate public interest or protects the rights of the vulnerable, not simply
      that it is enacted by an authority.'
    candidate: Appeal to Authority
    challenged_inference: The inference that the law’s authority and the self‑claimed
      expertise of government or religious leaders automatically make the policy morally
      correct
    label_justification: The objection targets the reasoning step that equates an
      authority’s claim with moral truth, exposing the classic appeal‑to‑authority
      fallacy.  It does not merely criticize the argument but demonstrates that authority
      alone cannot justify a moral or legal stance, showing the logical flaw in the
      target’s reasoning.
