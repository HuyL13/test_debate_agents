  counterargument:
    decisive_counterargument: The target claims that because people in developed countries
      often vote for candidates from their own ethnic group, it is therefore acceptable
      for Macedonian voters to do the same. This generalizes a specific cultural pattern
      (ethnic voting in the US) to all ethnic groups and all societies without evidence,
      assuming that group identity always drives voting behavior. In reality, many
      voters consider multiple factors (policy, competence, ideology) and some may
      vote against their own ethnic group when they believe it aligns more with their
      interests. The target’s reasoning therefore commits a hasty generalization by
      moving from the observed norm in one context to a blanket claim about all ethnic
      voting.
    candidate: Hasty Generalization
    challenged_inference: The inference that voting for an ethnic candidate in Macedonia
      is analogous to voting for an ethnic candidate in the US and therefore a natural
      or acceptable phenomenon.
    label_justification: 'The objection isolates the reasoning step where the target
      generalizes from the notion that ‘people who come from a certain group understand
      and care about the issues related to that group more’—a statement about US patterns—to
      a universal claim about all ethnic groups. This meets the definition of a hasty
      generalization: an explicit sample (US ethnic voting) is used to imply a broader
      population (all ethnic voting globally). The counterargument shows that such
      a leap lacks supporting evidence and could be misleading.'
