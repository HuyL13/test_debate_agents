    conclusion_or_goal: That Macedonians voting for a Macedonian is a natural, understandable
      behavior—comparable to other ethnic groups voting for members of their own group—and
      therefore it is not a problem of racial bias requiring correction.
    candidate: Appeal to Nature
    supporting_reason: People who belong to a certain group tend to understand and
      care about issues relating to that group more than outsiders, so Macedonians
      voting for a Macedonian who represents them is an ordinary and acceptable reflection
      of that natural tendency.
    support_relation: The premise that humans naturally look out for their own interests
      is used to justify the acceptability of group‑based voting, thereby supporting
      the conclusion that such voting lacks problematic nuance.
    label_justification: The argument appeals to the naturalness of people prioritizing
      their own group’s interests to argue that this behavior is justified. This is
      a classic use of the Appeal to Nature fallacy.
    mechanism_supports_goal: true
