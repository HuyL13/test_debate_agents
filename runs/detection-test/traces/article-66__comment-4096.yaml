input:
  title: Activists in Lebanon are taking on the country's stray bullet problem
  parent: No one wants to lose someone to something that should be a celebration.
    There are much better ways to celebrate.  Let's learn from these tragedies. We
    can have wonderful parties without guns and possible tragedy. All parties should
    be gun free.
  target: I have to disagree. As the popular saying goes, guns don't kill people -
    people kill people. Gun owners, by and large, are responsible citizens, a fact
    that no one can really argue. The majority of gun owners are law-abiding citizens
    who are just as concerned about safety, if not moreso, than non gun owners. Statistics
    about violent crime bear this out, since most gun owners have clean records. That's
    why the second amendment is so widely supported.
