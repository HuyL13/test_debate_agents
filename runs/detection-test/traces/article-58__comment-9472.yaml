    decisive_counterargument: The claim that it is fine to recruit under‑privileged
      people worldwide as human test subjects rests on a tiny, unrepresentative assumption
      that all such individuals will consent freely and that their lack of healthcare
      access automatically makes them ideal participants, which is a loose generalization
      from limited observations.
