  title: In Myanmar, Buddhists offer white roses to Muslims during Ramadan
  parent: While it is very wholesome of the White Rose movement to be pushing for
    solidarity between Muslims and Buddhists, I think we need to make sure we are
    getting to the root of the actual issue here. Peace is great but what good does
    it do while our planet is dying? Climate change is real, and so I think we should
    be checking into our leaders to see if they are looking out for what's best for
    all, and not just for themselves.
  target: The root of the actual issue cannot be climate change. That is another subject
    that should be discussed but it has nothing to due with the White Rose campaign
    or the need for it in Myanmar. The root cause is more than likely due to ignorance
    and religious intolerance by Buddhist extremist in the country.
