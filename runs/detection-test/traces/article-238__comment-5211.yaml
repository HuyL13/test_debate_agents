input:
  title: Iran faces backlash from its Azeri citizens over Armenia and the Karabakh
    question
  parent: Why are there so many Iranians focused on a war in a foreign country? I
    think they have enough problems at home to worry about. I guess they need a distraction
    from all the human rights abuses and protests that are going on.
  target: I agree, they shouldn't worry about what's going on in a different country
    when stuff is happening in their own country. It's time to get rid of distractions
    and worry about yourself. They need to end up getting rid of their distractions
    and focus on what's going on there, it's time to get rid of distraction and move
    on.
