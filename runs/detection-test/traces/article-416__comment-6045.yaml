  counterargument:
    decisive_counterargument: Empirical evidence shows that protest can and has brought
      substantial change – civil rights marches led to the Civil Rights Act, anti‑apartheid
      protests escalated international sanctions and eventually ended apartheid, and
      recent climate‑protest campaigns have pressured governments to adopt net‑zero
      commitments.  To dismiss protest as wholly ineffective is an unfounded sweeping
      claim without support.
