    label_justification: 'The objection points out that the original claim asserts
      a universal negative (“protest won’t solve anything”) without providing evidence
      or examples.  This is a classic hasty generalization: drawing a conclusion about
      all protests from no or insufficient evidence.  The counterargument demonstrates
      that such a conclusion is unsupported, thus revealing the logical fallacy.'
