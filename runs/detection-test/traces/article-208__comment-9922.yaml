input:
  title: Artist Jasmine Thomas-Girvan taps into the ‘eternal connections’ of Black
    Caribbean ancestry
  parent: Staring at slavery feels like people think black people should sit and stare
    at the past. And relive traumatic events? People used to understand what had happened,
    and live with it without constantly bringing it up. The people now are not as
    strong as previous generations. At least not emotionally.
  target: That is what is neat about art. People can look at it and take different
    things away from it. I am sure that there may be some people that are not aware
    of the history of the Caribbean islands and works like this one may be an avenue
    for people to understand the roads that led to the way the region operates now,
    and not some fairy tale. It is good to remind the people of the past so bad things
    that happened do not happen again for instance. Not every culture has a fairy
    tale history to fall back on and remember fondly. This artist is taking an opportunity
    to educate and remind people of not only what has happened, but what CAN happen
    even though hard times came before, without buffering it or softening it to comfort
    the masses. It is inspirational in my opinion to see this artist take such care
    to do such a thing that way. It gives people a glimpse into how the Caribbean
    that we know today got to where it is.
