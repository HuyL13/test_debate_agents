  goal:
    conclusion_or_goal: People should not blindly listen to leaders when the majority
      are not acting in the public’s best interest
    candidate: Appeal to Majority
    supporting_reason: Most people would feel the same way I do about leaders not
      acting in the public’s best interest
    support_relation: The argument cites the widespread view that the majority do
