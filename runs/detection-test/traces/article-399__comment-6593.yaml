  counterargument:
    decisive_counterargument: The target’s claim that “I am sure a majority of the
      leaders aren’t looking out for the people’s best interest” and that “most people
      would feel the same way I do” is presented without any empirical support, purely
      as personal conviction.  Invoking an supposed majority opinion in this way is
      a classic bandwagon–style fallacy (Appeal to Majority) – you’re using the fact
      that a presumed majority shares your viewpoint as the justification for rejecting
      the advice to listen to leaders.  Without data or evidence, the argument hinges
      on an unsubstantiated belief rather than a logical reason.
    candidate: Appeal to Majority
    challenged_inference: That all people should avoid listening to leaders because
      a presumed majority of leaders and a presumed majority of people are disinterested
      and let‑down.
    label_justification: The target’s reasoning relies on a broad, unsupported claim
      about the beliefs of the majority, which is the hallmark of an Appeal to Majority.  By
      asserting that “most people would feel the same way I do” as a basis for dismissal,
      it moves from a speculative premise to a blanket conclusion, illustrating the
      fallacy.
