    support_relation: appeal to nature
    label_justification: The argument uses naturalness – that people naturally want
      to choose their own leaders – as a justification for the normative claim that
      the government must act appropriately. This is a classic appeal to nature fallacy,
      where a state of affairs is labeled good or right solely because it is natural.
