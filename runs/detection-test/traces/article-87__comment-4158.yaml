input:
  title: In Hong Kong, local entrepreneurs champion the pro-democracy cause
  parent: We have all known for decades now that China is a bad country and its pretty
    much tradition at this point to not trust them, especially if you live close to
    them and their government. The people of Hong Kong who are supporting the blue
    businesses are doing a huge disservice to their people and their country. They
    should know what will happen if China wins and these protestors lose!
  target: It seems only natural that there has become a groundswell movement of people
    yearning for freedom in the current global climate. They see how the western world
    works and want in on that. It seems to me that this is just the necessary consequence
    of Chinas repressive government and stopping it is futile.
