  goal:
    conclusion_or_goal: That the rise of a groundswell movement of people yearning
      for freedom is a natural, inevitable consequence of China's repressive government,
      and therefore attempts to stop it are futile.
    candidate: Appeal to Nature
    supporting_reason: The argument states that it is ‘only natural’ that such a movement
      has emerged and that this is a ‘necessary consequence’ of China's repressive
      government.
    support_relation: The claim of natural inevitability is used to justify the conclusion
      that the movement is inevitable and that stopping it is futile.
    label_justification: The argument infers that because the phenomenon is natural,
      it must occur and is unavoidable, which is an Appeal to Nature.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - It seems only natural that there has become a groundswell movement of people
      yearning for freedom in the current global climate. They see how the western
      world works and want
    - in on that. It seems to me that this is just the necessary consequence of Chinas
