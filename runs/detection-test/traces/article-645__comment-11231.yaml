input:
  title: Filipino activists decry Facebook’s ‘automated censorship’
  parent: Facebook has always picked certain people or opinions they deem to be unacceptable,
    and flag posts which contain or promote them. This is Facebook's culture and modus
    operandi. It has been that way from the beginning. We can't be surprised and dismayed
    that they are taking such actions now, given this is their long-standing practice,
    rooted in their corporate culture. I would recommend moving to another platform.
    But I wouldn't expect Facebook to change any more than an old tree might change
    its bark. Traditions are very stubborn things.
  target: And Facebook's culture is wrong.  Its really that simple.  Just because
    it has always been done doesn't mean that it should be done.    Sometimes a tradition
    is just stupid.     As Shirley Jackson pointed out in The Lottery.    And this
    is really hurting people.   It warps history to fit a clean, sanitized narrative.   It
    removes nuance and subtlety.    Proper representation of history is important.
    Especially on our new communication platforms that are the main way people share
    information these days.
