      it has always been done doesn’t mean it should.”  No evidence is provided that
      Facebook’s historical practices are inherently harmful or that they distort
      history.  Therefore the conclusion that Facebook’s culture is wrong relies solely
      on treating the fact that the practice is traditional as a reason to reject
      it, which is the classic *appeal to tradition* fallacy.  Without empirical support
      that the tradition is detrimental, the claim is unjustified.
