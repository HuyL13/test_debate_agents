  counterargument:
    decisive_counterargument: 'The argument assumes that the sheer number of people
      who agree makes defending human rights inherently correct and bound to succeed.
      That is a classic *appeal to majority*: just because many people think something
      is right, that itself is an adequate justification, ignoring the strength of
      the idea, evidence, or alternative viewpoints. The claim also conflates the
      presumed majority with the idea’s truth, which is a flawed inference. Hence
      it exemplifies an appeal to majority fallacy.'
