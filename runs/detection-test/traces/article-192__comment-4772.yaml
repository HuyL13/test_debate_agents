  counterargument:
    decisive_counterargument: The claim relies on the idea that what is natural is
      inherently wrong—i.e., that it is ‘natural to jump to the conclusion that all
      censorship is wrong’. But the fact that a practice is natural (or not natural)
      does not logically entail that it is morally right or wrong; that is a classic
      naturalistic fallacy. Thus the conclusion that all censorship is wrong cannot
      be justified merely by invoking its non‑naturalness.
    candidate: Appeal to Nature
    challenged_inference: (From the sentence that it is natural to conclude that all
      censorship is wrong)
    label_justification: The objection targets an argument that derives a moral verdict
      (censorship is wrong) solely from a claim about naturalness, which is precisely
      the fallacy of Appeal to Nature (naturalistic fallacy).
