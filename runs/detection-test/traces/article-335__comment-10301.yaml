input:
  title: '30 years after the Tiananmen Massacre: An interview with survivor Zhou Fengsuo'
  parent: At this point, why bother? China is stronger than ever and the people in
    charge have complete control over the people. They won this battle. They think
    having everyone forget or not even find out about 1989 is best, so that's what
    is gonna happen. Is there anyone who really thinks that after 30 years, the authorities
    in China will lose or change their minds/
  target: Well, if everyone took your attitude, they definitely won't. What do you
    suggest, that the people of China simply give up and live under authoritarians
    for the rest of time? It's important that people like this keep up their efforts
    and that nobody throws in the towel.
