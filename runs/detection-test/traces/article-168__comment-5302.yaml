  title: Ethnic Albanian votes will decide presidential elections in North Macedonia
  parent: People are  naturally distrustful of new things like this political system.
    It makes sense that people may not want to vote. It is important to encourage
    people to vote in order to achieve what the people want.
  target: For sure, not participating in democratic processes like voting doesn't
    just lead to social chaos and regret, it can potentially pave the way for unqualified
    leaders to take power. We've seen this happen in various countries around the
    globe. Inexperienced leadership leads to poorly drafted policies that fail to
    reflect the public's needs, thus triggering economic downturns and inflation.
    This can further balloon into increased unemployment rate, widening gap between
    the rich and poor, and could even escalate into mass unrests and protests. This
    snowball effect could ultimately result in the complete collapse of societal order.
    Hence, it is crucial that we don't underestimate the power of a single vote.
