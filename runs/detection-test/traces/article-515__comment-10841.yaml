input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: ''
  target: This is a troubling story, I can't even imagine a Governor just refusing
    to go and ordering the arrest of his replacement. It is such a fantastic story
    it is almost hard to believe that this has actually occurred. Even with how crazy
    of an event it is, I am thinking that Afghanistan have much bigger fishes to fry
    than this stubborn Governor. The Taliban for one is obviously a major ongoing
    problem that should be taken on immediately. The economy, poverty and the treatment
    of women all need to come before this issue as well. I understand that this story
    will make a splash and attract a lot of interest, but Afghanistan needs to stay
    focused on these major issues. Politics are always messy and we can't find ourselves
    caught in the circus when so much needs to be done already. I sincerely hope that
    the Afghan leadership will lead here and do the right thing for the whole country.
