    challenged_inference: All privacy concerns are unimportant because other problems
      (poverty, violence) are more pressing.
    label_justification: The objection exposes the reasoning that leverages the presence
      of a more severe problem to marginalize a less severe one, fitting the definition
      of the Appeal to Worse Problems fallacy. It demonstrates that the conclusion
      is not logically compelled by the premises and merely shifts focus away from
      privacy.
