  counterargument:
    decisive_counterargument: Just because a response is described as 'natural' does
      not prove it is beneficial or effective. The claim that hyper‑vigilance and
      overreaction resulting from past epidemics automatically gives citizens an advantage
      against COVID relies solely on the fact that these reactions are natural. That
      appeal to naturalness is insufficient to establish the utility or success of
      those measures and ignores evidence that such over‑cautiousness can cause significant
      social, economic, and psychological harm. Therefore the argument is improperly
      grounded on the idea that what is natural must be desirable or useful.
