  goal:
    conclusion_or_goal: Disregard the lack of expert certification as a valid reason
      for skepticism, arguing that such studies are routinely conducted without expert
      approval.
    candidate: Appeal to Tradition
    supporting_reason: This is how all studies/surveys for the news are done.
    support_relation: The reason is invoked to justify dismissing skepticism, claiming
      that the common (traditional) practice of conducting studies in this manner
      legitimates the results.
    label_justification: The argument appeals to the mere fact that the methodology
      is widely used as a reason to accept the findings, which is the classic definition
      of an appeal to tradition.
    mechanism_supports_goal: true
