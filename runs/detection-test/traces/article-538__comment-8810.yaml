    - of the results. This is how all studies/surveys for the news are done.
  counterargument:
    decisive_counterargument: The claim that an expert is unnecessary because “all
      studies are done this way” commits an Appeal to Tradition. Just because most
      surveys lack local expert involvement does not guarantee that the results are
      reliable—experts can provide essential contextual knowledge that shapes survey
      design, question wording, and interpretation of findings. Therefore, skepticism
      is warranted until those expert insights are incorporated.
    candidate: Appeal to Tradition
    challenged_inference: Appeal to Tradition
    label_justification: The objection directly undermines the target’s reliance on
      tradition by pointing out that tradition does not ensure validity; thus the
      argument fails by Appeal to Tradition.
