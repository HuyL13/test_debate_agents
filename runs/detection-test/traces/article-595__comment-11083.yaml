input:
  title: Thousands of flamingos found dead in Central Anatolia
  parent: If this is because of whatever agricultural practices, it seems like the
    people simply don't value these animals. After all, the country is a democracy,
    so they voted for those policies. If that changes, it should only be if most people
    assess the situation and decide that flamingos and whatever other animals are
    more important. Not because some minority of activists force a change.
  target: The country may be a democracy,  but that doesn't mean that people don't
    care.    It just means that they're not thinking about the long term consequences
    of their decisions.   That's why government regulations exist,  because people
    as individuals have a lot of difficulty considering the aggregate consequences
    of major decisions.   There should be stricter regulations to protect these animals.
