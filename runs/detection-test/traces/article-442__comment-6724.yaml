input:
  title: In Togo, singer Elias Atayi uses music as a vehicle for human rights
  parent: Why should we listen to this musician?  What does he know about how a country
    should be run?  I understand having sympathy for those who are abused and neglected
    and am not belittling it, but let the real experts handle it. Let's leave these
    delicate topics to policy makers who invest their lives working on these issues.
  target: I completely agree that many celebs don't have fully accurate information.
    Think about their influence they have in being a positive force for change. Dr.
    Mary Monroe, a well known psychologist and speaker, had a lecture on this topic
    not too long ago and said that even if a celeb doesn't have all the information,
    their words will cause someone to want to have that information. Of course, it's
    important to bring unbiased information that is accurate, but even if starting
    the conversation could lead that "one person" who could bring change, wouldn't
    that be worth it? The ripple effect that starts from a single stone is always
    massive, don't you think?
