    decisive_counterargument: Even though humans are naturally inclined to use languages
      they are fluent in and communication is deeply rooted in our DNA, this fact
      alone does not require or justify adding the Shona language to online platforms.
      Natural inclination is a description of human behavior, not a prescriptive instruction
      for technological development; it does not logically entail that a specific
      language should be promoted or implemented online.
