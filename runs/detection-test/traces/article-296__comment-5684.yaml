    candidate: Appeal to Authority
  goal:
    conclusion_or_goal: People should trust the process and wait for the next decision.
    candidate: Appeal to Authority
    supporting_reason: Because the court made a good decision and those in charge
      evidently know what they're doing and what is right, the decision is trustworthy.
    support_relation: The reason functions as a justification for trusting the process,
      implying that authority approval suffices.
    label_justification: The argument leans on the perceived authority of the court
      and officials to assure the audience of correctness, offering no independent
