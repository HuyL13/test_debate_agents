input:
  title: Capturing the mood on both sides of the Ukraine-Russia conflict in Donbas
  parent: ''
  target: In the Donbas area of Ukraine as in many areas of the world where there
    is conflict, there is little trust in the government and more interest in personal
    survival than there is in politics. Foment is often the result when government
    does not respond to the needs of the people it governs. Basically people are much
    more interested in personal survival rather than politics. If things are bad,
    there is distrust in the government.
