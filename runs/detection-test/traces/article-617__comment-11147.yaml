  target: What's the point of having journalists in a particular country if they can't
    report anything? This situation speaks volumes about the state of press freedom,
    which is supposedly guaranteed by the constitution. As CPJ stated, journalists
    are not terrorists, yet they are treated as such in Cameroon. Imagine if other
    countries began to follow the same trend because they saw no repercussions on
    such acts? That's a chilling perspective for the future of global journalism.
