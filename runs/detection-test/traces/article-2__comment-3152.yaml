  counterargument:
    decisive_counterargument: While a few prominent figures may highlight concerns
      about extremism, citing their opinions does not establish that Muslims in Myanmar
      are inherently prone to extremist behavior or that the Buddhists’ actions are
      justified solely because these leaders spoke on the issue. Their statements
      are opinions, not empirical evidence projecting on the whole Muslim population
      or on the specific context of Myanmar. The argument therefore relies on the
      authority of a few individuals rather than on direct, context‑specific evidence.
    candidate: Appeal to Authority
    challenged_inference: The inference that Buddhists’ efforts to prevent Muslim
      extremism are justified because world leaders and intellectuals (e.g., Sam Harris,
      Bush, Trump) have warned about Muslim extremism.
    label_justification: The objection directly addresses the use of external authorities—Sam
      Harris, Bush, Trump—to support the Buddhists’ reasoning, exposing that the argument
      depends on their statements rather than on concrete facts about Muslims in Myanmar.
      This is the hallmark of an Appeal to Authority fallacy. No other fallacy‑label
      is warranted because the argument does not present a hasty generalization, false
      dilemma or slippery‑slope structure.
