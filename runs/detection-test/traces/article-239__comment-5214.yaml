  counterargument:
    decisive_counterargument: The claim that the world will become safer for future
      generations merely because a handful of younger people are taking initiative
      is an overreach. In order to make that claim, one would have to demonstrate
      that the scale, scope, and effectiveness of these initiatives are sufficient
      to overcome the myriad environmental, political, and economic challenges that
      still exist. The passage offers no such evidence, only a hopeful assumption
      that the actions of a few will guarantee a better future for all. Without a
      demonstrated causal connection between the sample’s activity and the universal
      outcome, the conclusion is unsupported.
    candidate: Hasty Generalization
    challenged_inference: Assuming that the limited actions of many younger kids will
      automatically ensure the entire world’s safety for future generations.
    label_justification: The objection directly points out that the speaker generalizes
      from the actions of a sample (young people who are currently making an effort)
      to a universal conclusion (the future will be safe for everyone). This is precisely
      the reasoning failure defined as a hasty generalization, as the conclusion extends
      beyond the evidence provided.
