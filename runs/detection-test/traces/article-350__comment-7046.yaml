      or irrelevant because the host cannot identify refugees leading to worst issues.
    label_justification: 'Minimizing refugee privacy by pointing to a presumably more
      severe host issue is a direct use of the ‘appeal to worse problems’ fallacy:
      it dismisses an important concern simply by claiming another issue is harsher,
      without evidence of comparative severity or relevance. This fully explains the
      defect in the argument’s reasoning rather than just critiquing its content. '
