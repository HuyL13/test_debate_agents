    - Traditions are important. We all have them for a reason!
    decisive_counterargument: The argument assumes that immigration inevitably erodes
      traditions and therefore uses that to justify restricting foreigners. In reality,
      many societies that have welcomed immigrants—e.g., the United States, Canada,
      and countless European nations—have seen their core traditions survive and even
      flourish, adapting to new cultural inputs. Cultural exchange strengthens, rather
      than destroys, the traditions that define a community. Thus the supposed link
      between foreign influx and erosion of tradition is unsupported, and the appeal
      to tradition is unsubstantiated.
