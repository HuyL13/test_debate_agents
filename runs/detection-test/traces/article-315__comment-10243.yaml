  title: '2021: A fruitful year for Indigenous communities in Taiwan'
  parent: It's great that they're finally getting the recognition and respect that
    they deserve. It's to the benefit of the non-indigenous as well, and they in Taiwan
    should take note of that. As award winning author Jay Griffiths said, if people
    can't acknowledge the wisdom of indigenous cultures, that's their loss.
  target: When it comes to indigenous cultures, I almost feel like it's a dangerous
    road to try and be well known. Since the westernization of most cultures has caused
    a lot of erosion of ethics and morals as well. So while it's good that they receive
    some recognition let's hope that they can remain authentic.
