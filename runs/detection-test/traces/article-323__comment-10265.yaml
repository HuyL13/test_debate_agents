input:
  title: Should there be Shona-language versions of Google and social media sites?
    This Zimbawean technologist says yes
  parent: This seems like a waste of time for a talented engineer working with AI.
    The people who speak this language probably speak a more common language as well,
    so they don't need to rely on their native one. Spend your time using AI to help
    cure real problems like diseases or something! Its a nice idea, but at the end
    of the day, a language used by only 10 million people, many of whom probably don't
    even use computers, isn't that big of a deal.
  target: Many people value their culture and their languages. For them, the lack
    of their language in online spaces is a real problem. Not everyone on the planet
    has to focus all their efforts on curing diseases or something. There's nothing
    wrong with people like Blessing Sibanda focusing on this problem.
