  counterargument:
    decisive_counterargument: The author uses one particular success story—people
      using social media to influence a bill—to claim that speaking up *in general*
      guarantees that people can get things done. Yet this single anecdote does not
      establish a universal rule; in many other cases, public outcry or online campaigns
      fail to achieve legislative or societal change. Therefore the inference that
      public mobilization always works is unwarranted.
    candidate: Hasty Generalization
    challenged_inference: The claim that speaking up guarantees action is based on
      a single example; it generalizes from one case to all cases.
    label_justification: The objection directly identifies that the argument leans
      on a single instance to support a universal claim, which is the hallmark of
      a Hasty Generalization. The critique shows the inference fails by overgeneralizing
      from an isolated anecdote. This demonstrates a specific logical fallacy rather
      than merely a weak argument, so the label is appropriate.
