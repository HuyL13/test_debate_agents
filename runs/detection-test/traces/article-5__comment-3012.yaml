  counterargument:
    decisive_counterargument: The claim that Japanese law’s practice of detaining
      suspects until they confess must be considered torture with no chance of a fair
      trial is an over‑generalization. The term “hostage justice” and the notion of
      being guilty until proven innocent are descriptive labels; they do not by themselves
      prove that the procedure is torturous or that a coerced confession can never
      stand in a court. Without evidence that the procedure systematically forces
      confession through coercion, the argument leaps from a description of policy
      to a blanket statement about its moral and legal validity.
    candidate: Hasty Generalization
    challenged_inference: Japanese suspects are always held under torture until they
      confess, and thus any coerced confession can never be fairly tried.
    label_justification: 'The objection shows that the inference draws a broad, universal
      conclusion about all Japanese arrests from a single, vague description (“hostage
      justice”). That is exactly the hallmark of a hasty generalization: it applies
      a specific or limited observation to all cases without sufficient evidence.
      Hence the fallacy label is Hasty Generalization.'
