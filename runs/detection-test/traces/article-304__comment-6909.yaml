input:
  title: First transgender pride march hopes to shatter stereotypes in Pakistan
  parent: I mean, this is good news I guess, but is it really that important? Especially
    in a place like Pakistan, with all the serious problems they have. Maybe they
    should be more focused on the abject poverty and commonplace violence that huge
    swaths of their population have instead of some tiny minority.
  target: While the news might only apply to a minority of people, the big important
    thing here is that it at least brings awareness to an issue that should have more
    attention. Liberty for all should be a focus that society needs to work toward
    all around the world and that makes this issue into a worldwide issue. It is only
    through collective effort that can bring about change; and it's not just about
    those being directly affected, but also about maintaining balance, equity, and
    fairness in our society. Standing for liberty should be everyone's goal.
