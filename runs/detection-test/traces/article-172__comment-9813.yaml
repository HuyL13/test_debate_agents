  counterargument:
    decisive_counterargument: 'You assert that coal mining is inherently bad because
      it ‘rips up the Earth’ and that this makes it ‘not good for nature.’ That conclusion
      is drawn solely from the idea that because a practice harms or is not natural,
      it must be wrong. This is an appeal to nature: you claim the activity is undesirable
      simply because it hurts the environment, without providing evidence that the
      long‑term environmental impact is necessarily negative or that the alternatives
      are demonstrably superior. Likewise, the statement that wind and solar ‘do not
      harm’ therefore makes them the norm assumes that nature’s goodness automatically
      makes an option preferable, which is the same logical error. The claim that
      long‑term consequences “cannot be positive” is presented without supporting
      evidence and relies on the same premise that nature must be protected at all
      costs.


