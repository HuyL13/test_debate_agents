  title: Artist Jasmine Thomas-Girvan taps into the ‘eternal connections’ of Black
    Caribbean ancestry
  parent: Art is either abstract or impactful. I think her art leans to the latter.
    She can harness traumatic colonial past experiences to express a pain and emotion.
  target: Are you saying that abstract art can't have an impact? I have to disagree
