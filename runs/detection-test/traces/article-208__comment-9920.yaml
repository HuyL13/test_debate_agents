  counterargument:
    decisive_counterargument: 'Saying that many people claim abstract art has impacted
      them does not logically confirm that abstract art always or generally has an
      impact. The appeal to the sheer number of people who feel affected is an Argument
      from Popularity (Appeal to Majority): it treats popularity as evidence of truth.
      Without objective criteria or systematic evidence showing that abstract art
      actually affects viewers, the claim remains unsupported.'
