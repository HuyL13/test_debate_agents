  counterargument:
    decisive_counterargument: 'The fact that a majority of countries have legalized
      gay marriage does not logically compel or even strongly suggest that these particular
      countries should adopt the same policy. Moral or legal choices are contingent
      on a variety of cultural, historical, and legal factors, not on how many other
      nations happen to follow a specific path. Using the sheer number of other countries
      as a reason for action is a non‑sequitur: it treats a descriptive fact (“most
      countries are progressive”) as a prescriptive obligation (“they must be progressive
      too”).'
