input:
  title: Burundi’s plastic bottle recycling still has some way to go
  parent: This failure clearly shows that waste reduction policies don't work and
    shouldn't be implemented anywhere else in the world. Maybe with some modifications
    it could work better, but overall there is likely no point to banning plastic
    or trying to reduce its use, given these results.
  target: I think this is clearly untrue given that in a lot of other places, for
    example in parts of America, these bans have been very effective. It's not fair
    to judge a policy solely based on how it plays out in one particular place. If
    anything, we should be trying to figure out why it didn't work here and learn
    from that, so that these important policies are more and more effective in the
    future.
