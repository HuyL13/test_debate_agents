  counterargument:
    decisive_counterargument: The claim that a ban’s success in some American states
      guarantees or proves its effectiveness elsewhere (e.g., Burundi) is a logical
      leap from limited evidence. The argument treats a single successful instance—or
      a handful of them—as representative of all contexts, ignoring local conditions
      that can reverse the outcome. Thus, the conclusion that the policy will work
      universally is a hasty generalization.
    candidate: Hasty Generalization
