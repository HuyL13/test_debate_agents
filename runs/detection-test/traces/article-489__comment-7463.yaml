    decisive_counterargument: The claim that simply allowing the police to use violence
      automatically reveals their character and so demands a complete system overhaul
      rests on an unwarranted leap from a single, hypothetical scenario to a sweeping
      claim about the entire police force and the system. One can assess police behavior
      through oversight, transparent reporting, and investigative reviews without
      granting them any new discretionary violence. Moreover, even if a few officers
      abused such permission, it does not logically follow that the entire system
      must be overhauled; reforms could target those officers or the specific procedures
      that enable abuse. Hence the conclusion is an over‑broad generalization unsupported
      by evidence.
