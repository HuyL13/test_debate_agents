input:
  title: Sri Lankan Court temporarily bars disputed Prime Minister Rajapaksa from
    office
  parent: ''
  target: This is a very interesting political situation going on in Sri Lanka, it
    isn't clear who will end up being the Prime Minister in the end. It seems it will
    come down to the courts to decide the matter and most people think that is a good
    thing. I am not so sure about that, I remember the days when two disagreeing people
    could sit down together and work out their differences. Those days seem to be
    long gone now and everything must end up in a court case to be resolved. I wonder
    if these two in Sri Lanka might consider such an approach? It seems like a long
    shot, but maybe they will see the light and give it a try. It may not completely
    resolve the issue, but maybe it will allow them and their followers to see what
    they have in common. Sometimes we have to look to our past to find our future,
    this is exactly what should happen today in Sri Lanka.
