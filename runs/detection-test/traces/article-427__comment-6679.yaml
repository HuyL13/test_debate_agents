    decisive_counterargument: The claim that street protests ‘won’t really bring the
      change’ is unsupported by evidence and relies solely on a single authority’s
      preference for dialogue. Empirical history shows that public demonstrations
      can (and have) produced concrete policy shifts—think of the Spanish women’s
      strike itself. Hence the inference that protests are ineffective lacks substantiation
      and is weakened by the dramatic turn from dialogue to demonstration without
      demonstrating the latter’s failure.
    candidate: Appeal to Authority
    challenged_inference: public displays that won't really bring the change
    label_justification: The objection highlights that the argument uses a single
      referenced authority (Dr. John Doe) to establish the superiority of dialogue
      over protests, rather than providing independent evidence or data. This dependence
      on authority to justify the claim exemplifies an Appeal to Authority fallacy,
      as the authority is invoked without substantive support for the broader claim.
      The counterargument demonstrates that the primary inference fails because the
      cited expert’s viewpoint is insufficient to discard the effectiveness of other
      forms of protest.
