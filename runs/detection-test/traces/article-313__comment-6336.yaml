  counterargument:
    decisive_counterargument: The claim that *students will protest because people
      naturally protest injustice* rests on the unverifiable universal premise “people
      will naturally protest injustice.”  This premise is an over‑generalization taken
      from the sample text without supporting evidence, and it leaps from a broad
      claim about human behavior to a specific event involving the students.  Such
      a sweeping assertion that all people will react in a particular way simply because
      “natural” is a clear example of a hasty generalization—assuming the rule applies
      to the specific situation without demonstrating that it does.
    candidate: Hasty Generalization
    challenged_inference: People will naturally protest injustice.  The students have
      every reason to.  The death of their fellow student is major.
    label_justification: The objection points out that the inference uses an unjustified
      generalization about all people (“people will naturally protest injustice”)
      to conclude that this specific group will engage in that behavior.  No other
      fallacy type fits the structure better, so the label ‘Hasty Generalization’
      correctly captures the failure exposed.  The inference is protected by the over‑generalized
      premise, which itself is unsubstantiated.
