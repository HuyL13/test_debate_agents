  discriminator: Hasty Generalization requires explicit cases/sample -> broader population/class.
    Slippery Slope requires action/condition -> progressively worse consequences.
  resolution:
    winner: Hasty Generalization
    decisive_test: Hasty Generalization requires explicit sample(s) -> broader population/class.
      The argument cites only Turkmenistan as an example of internet censorship and
      extrapolates that the United States and all Western countries will eventually
      follow suit, thereby generalizing from a single case to an entire population
      without evidence of similarity or causality. Slippery Slope mandates a logically
      progressive chain of increasingly adverse consequences; here there is only one
      speculative leap from Turkmenistan to the US and another to the West, lacking
      an intermediate sequence or escalating outcomes. Thus the argument fits the
      structure of a hasty generalization rather than a slippery slope.
    loser_failure: The slippery‑slope interpretation fails because it requires a demonstrable
      progression of harms or steps. The comment merely speculates that, if the US
      follows Turkmenistan's lead, this could extend to any Western country. This
      is a single prediction, not a chain of escalating events. Consequently, it does
      not satisfy the slippery‑slope structure.
