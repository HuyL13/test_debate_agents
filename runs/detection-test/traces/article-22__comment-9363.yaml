input:
  title: Rejection of new Australian coal mine is a rare win for community environmental
    campaigners
  parent: Caving in because a few has-been celebs oppose a coal mine is a dumb move.
    I guess we're going to roll over for every celebrity cause and sink the whole
    economy. Decisions like this one need to be made by experts who understand the
    real impact. Losing all those local jobs won't hurt Nicole Kidman and Leo Sayer,
    but it sure hurts a lot of Joe and Jane Does and small business owners who are
    struggling to recover from the impact of covid.
  target: I agree that basing the decision around the opinions of just celebrities
    is really not the best way to make choices. However, I am not sure that we should
    be relying on just experts either. What we need is a balanced view of such issues
    that include the opinions of all people. That would include regular people, experts,
    celebrities and so on. Regular people can be great for getting a view from ground
    level, experts can help educate all of us on the finer details. The celebrities
    can bring a lot of attention to the subject. Aren't all of these people very important
    to solve problems?
