input:
  title: 'Unfreedom Monitor Report: El Salvador'
  parent: While all the centralized power this government has seems pretty problematic,
    the 'digital authoritarianism' bit seems pretty weak. Is this really a big and
    important part of the problem these people are facing? It feels like the more
    traditional authoritarian methods are significantly more important to deal with
    than how some people are treated online.
  target: "I agree. Although social media can be a dangerous tool, it remains a tool\
    \ anyone can use and framing Bukele's use of that tool as something authoritarian\
    \ just because he's especially good at is isn't productive. Misinformation and\
    \ disinformation should be curtailed, including undue influence, but you can't\
    \ stop someone from finding clever ways to spread their message. \n\nThat said,\
    \ it's not as though governments should let problematic social media influence\
    \ run rampant. There needs to be sensible regulations even granting the freedom\
    \ of people to spread their message."
