  counterargument:
    decisive_counterargument: The argument concludes that because power‑seeking and
      resisting relinquishment are seen in wolves, lions, and other animals, it is
      therefore ‘natural’ for humans to behave similarly. This uses the premise that
      naturalness implies desirability or inevitability—an Appeal to Nature. Natural
      phenomena (e.g., pack dynamics, predation, dominance hierarchies) do not carry
      normative value; many natural behaviors are harmful or undesirable to humans.
      Thus the claim that it is ‘only natural’ for leaders to cling to power is a
      logical shortcut that conflates description with justification.
    candidate: Appeal to Nature
    challenged_inference: T1,T2,T3
