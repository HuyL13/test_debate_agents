input:
  title: New study finds internet censorship in Turkmenistan reaches over 122,000
    domains
  parent: Turkmenistan is censoring the internet and slowing the internet down for
    its citizens. Who is going to be the next country to do this? And how long before
    it reaches us here in the United states? If it happens in the united states, it
    could happen in any country in the west.
  target: 'While Turkmenistan censoring the internet is wrong and should be stopped
    immediately for many valid reasons, I don''t think it''s likely at all that it
    will start happening in the west. Western governments tend to have checks and
    balances that prevent them from crossing certain lines that detract from citizens
    freedoms. Turkmenistan is one of the least free countries in the world. We should
    always be vigilant and protect our freedoms as  much as possible, but we don''t
    need to cause an undue amount of concern either. That level of balance is important
    so we do not go too far or become too complacent. It is true as well that we must
    not be complacent in allowing Turkmenistan to censor its people, we must stand
    up to this bully and encourage them to open up their internet. It will be a good
    first step. #Freedom4Turkmenistan'
