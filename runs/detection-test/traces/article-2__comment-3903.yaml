input:
  title: In Myanmar, Buddhists offer white roses to Muslims during Ramadan
  parent: I don't think these protesters understand what's going on here. Either those
    so-called extremists get the Muslims out of their country, or it will just become
    a den of terrorists. Surely that's not what they want. It's not as if there are
    any real alternatives. This isn't a situation with a middle ground.
  target: Do you really thick that the 100's of millions of Muslims in the world are
    all violent terrorists?  The actions of a few do not represent the values of the
    vast majority.  Your perspective is incredibly ignorant.  You are clearly stereotyping
    an entire religion based on the actions of extremists.  Terrorism is rarely simply
    the result of one thing such as religion.  Even those who commit terrorist acts
    in the name of religion are misguided individuals, and in some cases, religion
    is used as a tool to groom or coerce these individuals to commit terrible acts.  In
    fact, the same binary, black-or-white thinking that is used to coerce people into
    castigating an entire religion is the exact same black-or-white logic that you
    are using.
