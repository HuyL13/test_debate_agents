input:
  title: Trinidad & Tobago NGO identifies treatment of women as key issue in upcoming
    elections
  parent: There are only two reasons for this. Women want control, not equality. The
    aggressive demands like a change in constitution is a bit odd. Sure, they should
    do something, but maybe a bit down to earth.
  target: You really think this is them wanting control, by barring sex offenders
    from running for office? Plenty of countries bar people convicted of some crimes
    from office. I don't think this is particularly unreasonable, and if their proposals
    go through, I don't think women will have more 'control' in any negative way.
