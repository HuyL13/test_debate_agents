input:
  title: This digital novel narrates the violence against ethnic Chinese during the
    1998 riots in Indonesia
  parent: I don't think people should focus so much on the past. Both Indonesia and
    China have a lot of significant problems they're facing right now. There's ever-increasing
    repression in both countries, inequality, suffering of all kinds. Is now the time
    to try to heal the wounds of some 25 year old event that affected some small minority?
    That is the sort of thing you try to do after you've solved the bigger problems.
  target: I am struggling to understand why you think that we can only address one
    issue at a time, this is not the way the world has to work. This brave woman has
    come forward to share her story and this should not be overlooked or silenced.
    It does not matter how long ago this event happened, people from that time surely
    still wear the scars from those days. I think by hearing from these people that
    we can bring closure to their suffering and hopefully give other people the strength
    to come forward with their own stories. That is how we can fight current repression
    around the world, this is how we will show that justice is possible when we recognize
    problems from any time. I thought she did a great job in this article and I am
    interested to learn more about her and her story. Anyone else feel this way?
