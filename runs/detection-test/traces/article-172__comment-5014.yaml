input:
  title: Australian court's historic rejection of coal mine highlights the impact
    of climate change
  parent: Is this really helpful? I mean coal mines have always been a source of income
    for the local economy. For years they have provided jobs and supported the economy.
    Aren't we just creating a new problem by stopping them?
  target: Since that is the case and everyone knew that the outcome would be something
    of this nature, its on everyone involved to have started a transition plan. There
    are other jobs out there and the government should have stepped in to offer miners
    who wanted to transition to other jobs free training in those fields and the opportunity
    to gain employment. Miner themselves also needed to start to plan for this future.
    It's not like it came out of nowhere. They are hardworking people and with the
    help of the government will land on their feet.
