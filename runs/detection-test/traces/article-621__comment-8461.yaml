input:
  title: The first recorded two-headed banded kukri snake discovered in Nepal
  parent: If we are finding two headed snakes then there must be something in the
    water, I bet man is polluting the area. There is no other possible answer. When
    weird shit happens, its always us that causes it.
  target: I agree, seeing a two headed snake must be quite the impression! Honestly,
    things like this happen in nature due to unforeseen reasons. Pollution or something
    being dumped in the water wouldn't warrant this kind of change in so few snakes.
    Remember, there are only a few cases like this in the area. If it was pollution
    changing things, it would be more wide spread and in different areas. A possible
    cause to this could just be inbreeding. We're talking a few snakes, not even a
    few hundred. However, Davis, you are correct about the effects of pollution  but
    that can take upwards of years to manifest. Let's not blow things out of proportion
    and assume that every new oddity of nature is a direct result of pollution. Nature
    is just full of surprises sometimes!
