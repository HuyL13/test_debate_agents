  counterargument:
    decisive_counterargument: The premise that moral standards must be explicitly
      defined in order to create harmony simply rests on the historical fact that
      societies have traditionally relied on shared values for cohesion.  That fact
      does not prove that the current situation can or should be addressed in the
      same way, nor that enforcing rigid definitions will prevent strife.  Many cultures
      show that harmony can be maintained even when moral codes are loosely structured
      or evolve over time, suggesting that the argument’s appeal to tradition is merely
      a form of justification rather than evidence.
    candidate: Appeal to Tradition
    challenged_inference: Moral standards must be clearly defined in society to increase
      harmony among transcendental groups of a country.
    label_justification: 'The argument invokes the long‑standing practice of using
      traditional values as a basis for social harmony, implying that this historical
      precedent merely validates the current position.  By treating tradition as a
      reason to cling to rigid moral definitions, the argument commits the Appeal
      to Tradition fallacy: it appeals to the fact that a practice has been done or
      accepted for a long time as proof that it is the best or right approach, without
      providing any substantive evidence that the practice actually achieves the claimed
      outcomes.  This fallacy is distinct from merely criticizing the claim; it specifically
      points out that the reasoning depends on tradition for legitimacy.'
