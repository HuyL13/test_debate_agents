  title: In Myanmar, Buddhists offer white roses to Muslims during Ramadan
  parent: ''
  target: Moral standards must be clearly defined in society to increase harmony among
    transcendental groups of a country. Ethical standards are formulated in intrinsic
    valuations contrasted against moral beliefs that are transcendent. Everyday people
    are that of a transcendent type and base their everyday modalities on such belief
    systems. Belief systems are formulated through out centuries simply know as the
    culture of a people. Deep rooted traditional values are signs and guidelines that
    maintain a natural order of harmony for the over all totality as universal knowledge
    and style. This is the vitalism that maintains a viability mode of existence for
    the populace of a territory. However if such transcendental values are held to
    tightly a stagnation will occur and the populace will begin to experience strife
    and violence. Open set of moral values must be accommodated for change to allow
    for what one might define as metabolism or a respiratory system that allows the
    culture to digest or breath new life in succession.  Impulse and extreme reflexivity
    with an excluded middle, meaning, catering to a virtual instead of an actuality
    of life is a doom loop in the making. The golden ratio must be found.
