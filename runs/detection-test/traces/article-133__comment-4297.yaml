  counterargument:
    decisive_counterargument: The claim that 'correlation is not causation, therefore
      an arrest is incompatible with any causal wrongdoing' overlooks that arrest
      is itself a causal action taken on the belief—or evidence—that wrongdoing occurred.
      The fact that correlation does not automatically provide proof of causation
      does not negate the possibility that the arrest was caused by legitimate suspicion.
      A more accurate inference is that while an arrest alone does not *prove* guilt,
      it is evidence of a substantial suspicion that warrants further investigation.
      As such, the arrest can legitimately be regarded as an initial step in the causal
      chain leading to a crime, not as evidence against causation.
    candidate: Hasty Generalization
    challenged_inference: Correlation is not causation. Therefore, being arrested
      and detained doesn't mean he did something wrong to begin with.
    label_justification: The target assumes that because arrest and detention are
      correlated with criminality, the lack of correlation implies no wrongdoing.
      This generalizes from a single instance (an arrest) to all arrests, claiming
      that all arrests cannot signify wrongdoing. Such a sweeping conclusion from
      one case constitutes a Hasty Generalization, violating the rule that one sample
      does not represent the entire population of arrests.
