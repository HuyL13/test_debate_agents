  title: 'Freedom abroad, fear at home: Azerbaijani human rights lawyer detained for
    30 days'
  parent: He clearly did something awful if he was arrested so quickly. There is no
    other reason for the government to move so swiftly. But don't always use one example
    as proof for the whole system.
  target: Correlation is not causation. Therefore, being arrested and detained doesn't
    mean he did something wrong to begin with. The authorities should have provided
    detailed reasons why he was being detained. They did not.
