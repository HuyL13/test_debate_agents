input:
  title: Slovak businessman charged with ordering murder of journalist Ján Kuciak
    and his fiancée
  parent: I think if you're running a country like this, you either criminalize investigative
    reporting like the kind done by Kuciak, or you allow it but make no guarantees
    about the personal safety of such journalists. You can either make it impossible
    for them to get themselves killed or you can strongly discourage them from engaging
    in work that might get themselves killed. What other options could there be?
  target: To answer your question, there are definitely more options to fixing the
    problem than the two you listed. The idea that we should criminalize investigative
    reporting or just leave the reporters on their own is baffling. How about we allow
    all reporting and we protect the media from physical attacks? The government should
    pass more laws protecting the right of the media and free speech, they also should
    enhance the laws ensuring the media is not under threat from criminals. Jan Kuciak
    and Martina Kusnirova had their lives ended tragically, we cannot bring them back,
    but we can pay tribute to them by protecting others that follow in their footsteps.
    Don't you feel that is a good idea?
