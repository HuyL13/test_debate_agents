input:
  title: Trinidad & Tobago NGO identifies treatment of women as key issue in upcoming
    elections
  parent: ''
  target: It seems like this area of the world has had years and years where this
    kind of behavior was tolerated and things ran smoothly. I see no reason why anyone
    would want to make drastic changes just to suit some special interest group. Even
    if people may question them due to their accusations that does not necessarily
    mean that they would make bad leaders and that is what past elections have allowed
    people to decide about the character of leader they want. Look at the success
    of Bill Clinton in the US. He is hailed a great American president that served
    two terms after having multiple charges of improper relationships with women.
    "If the wagon runs fine, why change the wheels?", like my grandfather used to
    say.
