  counterargument:
    decisive_counterargument: The assertion that everything in nature naturally lives
      in harmony and therefore religious communities should automatically do the same
      commits the appeal‑to‑nature fallacy. Comparing human religious conflict to
      animal behavior does not provide a valid reason why humans must resolve their
      differences peacefully, because human societies are socially and culturally
      constructed in ways that cannot be justified solely by what is observed in the
      natural world.
    candidate: Appeal to Nature
    challenged_inference: Because the natural world is harmonious, religious communities
      and human societies ought to be harmonious as well.
    label_justification: 'The objection directly attacks the premise that the natural
      tendency toward harmony justifies normative claims about human religious unity.
      This is the classic structure of an appeal to nature: using a description of
      the natural world as evidence for what should be done. By showing that such
      relevance is unwarranted, we expose the identified fallacy.'
