  counterargument:
    decisive_counterargument: Preserving a language online is only one modest facet
      of language maintenance.  The vitality of a language ultimately depends on its
      active use in daily life, education, and cultural practice—factors that an online
      catalog alone cannot guarantee.  Simply archiving words and phrases in digital
      form does not convince communities to speak the language or pass it on, and
      can even foster a false sense that preservation is complete.  Therefore, the
      claim that making languages available online is vital for their preservation
      is overstated and unsupported by evidence of actual linguistic vitality.
