  counterargument:
    decisive_counterargument: While it is true that the actions of a few do not automatically
      define an entire nation, dismissing the significance of those actions altogether
      obscures systemic risks. In contexts where nationalist rhetoric and violent
      incidents are linked to policy frameworks—such as the Citizenship Amendment
      Act protests—those limited incidents often signal underlying institutional biases
      and discriminatory practices. Ignoring them can postpone necessary reforms,
      embolden anti‑minority sentiments, and ultimately harm the very communities
      the protests aim to protect. Therefore, the claim that any reference to the
      actions of a few should be entirely rejected is an over‑broad rejection of useful
      evidence.
    candidate: Hasty Generalization
    challenged_inference: The premise that the actions of a few should never be generalized
      to the whole country.
    label_justification: The objection demonstrates that the target’s stance amounts
      to an over‑cautious blanket denial of generalizing from limited evidence—an
      invalid negative form of the hasty generalization fallacy. It assumes that because
      a small sample cannot conclusively prove a universal claim, any attempt to extrapolate
      is unwarranted, thereby rejecting situations where such extrapolations would
      be warranted.
