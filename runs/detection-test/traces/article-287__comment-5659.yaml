  counterargument:
    decisive_counterargument: The argument equates a country’s long‐term peaceful
      status with the moral and legitimate effectiveness of the methods it has used
      to achieve that peace.  Peace can coexist with systemic oppression, arbitrary
      repression, or human‑rights violations – history provides many examples.  Therefore,
      the fact that the country has long been peaceful does not in itself prove that
      its methods are just or that it should be left alone.  It simply shows that,
      whatever methods were employed, they were at least sufficient to prevent large‑scale
      violence, not that they respect rights or are morally defensible.  The claim
      conflates political stability with moral validity, and this inference is logically
      unjustified.
