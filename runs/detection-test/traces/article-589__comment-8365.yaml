  counterargument:
    decisive_counterargument: The claim that every social‑media influencer genuinely
      cares about social justice is drawn from only a handful of examples and therefore
      cannot be accepted as a universal truth.  In order for a generalization to be
      valid it must be based on a representative sample of the whole population, which
      is not the case here—the statement relies on an anecdotal observation of a few
      individuals who happen to be politically active.
    candidate: Hasty Generalization
    challenged_inference: The assertion that all influencers genuinely care about
      social justice and are not motivated by image or follows.
    label_justification: This objection shows that the argument makes an overbroad,
      universal claim about all influencers based on a limited set of observations.  That
      is the defining feature of a hasty generalization, rather than a mere critique
      of the argument’s veracity.
