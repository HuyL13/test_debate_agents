input:
  title: Australian court's historic rejection of coal mine highlights the impact
    of climate change
  parent: Is this really helpful? I mean coal mines have always been a source of income
    for the local economy. For years they have provided jobs and supported the economy.
    Aren't we just creating a new problem by stopping them?
  target: Dumping pollution into rivers and having the entire sky over every major
    city filled with toxic fumes also provided jobs and supported the economy for
    years. It being that way isn't a strong argument for it to continue being that
    way. You're right that problems will emerge as a result, but it's people's right
    to prioritize the climate in this specific area and try to alleviate the lost
    jobs and economic harm in other ways.
