  counterargument:
    decisive_counterargument: The target conflates the fact that pollution historically
      supplied jobs with the moral claim that we must abandon it solely because it
      harms the climate; it treats the existence of a negative consequence as a decisive
      reason to reject the economic benefit without evaluating whether a balanced,
      evidence-based transition can replace those jobs rather than an outright dismissal.
      The target therefore commits an *Appeal to Consequences*—assuming that because
      pollution has undesirable effects we must stop it, ignoring the complexity of
      weighing costs and benefits and the possibility of mitigating harms while still
      maintaining economic security.
    candidate: Appeal to Tradition
    challenged_inference: The argument that we should discontinue pollution solely
      because it harms the environment despite its past economic benefits
    label_justification: The objection shows that the target infers that the negative
      environmental outcomes are sufficient to override the economic benefits, which
      is precisely the fallacious appeal to consequences; therefore the specific fallacy
      is identifying an *Appeal to Consequences* rather than merely critiquing the
      argument.
