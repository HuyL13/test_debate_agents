input:
  title: Can Jordan offer some lessons to oil-dependent ‘giants’ on renewable energy?
  parent: This is pretty surprising. I would have thought those countries would be
    the last ones to invest in reneweables! When your whole economies are based off
    fossil fuels, you would think they would be opposed to solar or electric!
  target: Well, they know that fossil fuels are finite. It makes perfect sense for
    them to use the wealth they've gotten and are going to get in the coming decades
    from oil and invest them in things that will last beyond the death of fossil fuels.
    Just very smart, prudent moves on their part.
