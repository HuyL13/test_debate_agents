input:
  title: Artist Jasmine Thomas-Girvan taps into the ‘eternal connections’ of Black
    Caribbean ancestry
  parent: The use of natural elements in her work is inspiring. More artists should
    focus on using the things the world has gifted us instead of all these modern
    day, computer assisted works. Art is so much more meaningful when it's made of
    the raw materials the Earth has gifted us rather than some synthetic stuff.
  target: I agree, with the natural elements are great and stick out more. It gives
    it a better view of how it looks and what it was like. The nature is beautiful
    and has the history of what it was like, it's great to preserve what it was like
    so they'll know where they came from.
