  counterargument:
    decisive_counterargument: 'The target’s claim that ‘Rome doesn’t seem like the
      greatest example’ relies on the idea that because Rome was built by mass violence
      and no longer exists, it is a poor model for any governance. This reasoning
      treats the negative consequences of Rome as the sole measure of its value and
      ignores that Rome also contributed lasting legal, architectural, and cultural
      foundations that many modern societies still benefit from. By focusing only
      on its downsides, the target commits the *appeal to consequences* fallacy: it
      assumes that the undesirable outcomes alone negate any potential merits of the
      system being evaluated.'
    candidate: Appeal to Worse Problems
    challenged_inference: The inference that Rome’s historical violence and demise
      invalidate it as a advisable example of rule by might.
    label_justification: The objection demonstrates that the target’s reasoning depends
      on the premise that negative outcomes inherently disqualify a policy, which
      is a classic appeal to consequences fallacy. It does not simply criticize the
      argument but exposes the logical defect that counts only consequences, not overall
      worth, as decisive logic.
