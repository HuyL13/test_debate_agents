input:
  title: 'Cameroon: Report the Anglophone conflict and perish'
  parent: It seems normal for any person or group in power to protect that power.
    We see this behavior across the animal kingdom, so why are we surprised when it
    occurs within our own species? In some parts of the world there have been more
    successful attempts at taming this tendency. But perhaps rule by might has more
    going for it than people think. Look at Rome and the worldwide peace its rule
    by might established. And there is more than historical examples, as one can also
    include the United States in such a list.
  target: Just because something is normal or happened in the past doesn't mean it's
    something we should encourage or tolerate. We worked hard to move away from systems
    like these. And Rome doesn't seem like the greatest example. The millions of bodies
    it took to create it and the fact that it's no longer around says more than whatever
    peace it maintained.
