    candidate: Appeal to Worse Problems
  goal:
    conclusion_or_goal: The argument seeks to demonstrate that focusing on trans people
      in a poor country is an inappropriate priority because the trans population
      is negligible and other issues (poverty, corruption, prosperity) are more important.
    candidate: Appeal to Worse Problems
    supporting_reason: The statement that trans people make up almost 0% of the country
      and that it would be better to focus on ending poverty or corruption is used
      to argue that the current attention should shift to seemingly more pressing
      national concerns.
    support_relation: The quantitative claim about the trans population percentage
      is employed to justify the supposed misallocation of attention toward a minor
      group, thereby promoting the view that resources should concentrate on larger
      societal problems.
    label_justification: The argument abstracts a specific concern (attention to a
      0% minority) and contrasts it with a more general societal priority (poverty,
      corruption). This is a classic case of appealing to the perceived greater importance
      of a larger problem to dismiss the smaller one, matching the 'Appeal to Worse
      Problems' pattern.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Imagine living in such a poor country and yet focusing all your attention on
      trans people, who make up almost 0 percent of the country. Why not focus on
      ending
    - poverty or corruption or something else with actual importance? Isn't bringing
      prosperity and happiness to your country more important than hate?
  counterargument:
    decisive_counterargument: 'The fatal targeting of a transgender person is a symptom
      of deeper social injustices—such as institutional corruption, lack of rule of
      law, and entrenched discrimination—that themselves hinder economic prosperity.
      Addressing the plight of trans people is not a distraction from poverty relief;
      rather, protecting human rights and enforcing anti‑corruption measures create
      a more stable, inclusive society that benefits everyone. Thus, the author’s
      insistence that attention must be devoted either to trans issues or to poverty
      is misleading: the two domains are mutually enhancing, not mutually exclusive.'
    candidate: False Dilemma
    challenged_inference: Target implies that focusing on trans people precludes attention
      to poverty, corruption, or other national concerns.
    label_justification: The argument offers only two options—either prioritize trans
      people or address socioeconomic problems—suggesting a binary choice and discarding
      the possibility of addressing both simultaneously, which is a classic false
      dilemma pattern.
    failure_exposed: true
    evidence_ids:
