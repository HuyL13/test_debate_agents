  counterargument:
    decisive_counterargument: The fact that the public health system managed to curtail
      Ebola does not logically entail that it will be equally equipped to handle COVID‑19.
      Ebola and COVID‑19 differ in transmission dynamics, required resources, and
      immune responses; success in one outbreak informs limited aspects but cannot
      guarantee success in another. Thus, the inference that past success in eradicating
      Ebola automatically equips the same population to get through COVID is unjustified.
    candidate: Hasty Generalization
    challenged_inference: Because the people eradicated Ebola, they must be strong
      enough to get through COVID, so lessons from Ebola will get them through COVID.
    label_justification: The argument infers a general capability of a broad population—‘getting
      through COVID’—from a single example of successful disease control (‘eradicated
      Ebola’). This extrapolation from one sample (the Ebola outbreak) to a wider
      claim about future pandemic resilience fits the definition of a hasty generalization.
