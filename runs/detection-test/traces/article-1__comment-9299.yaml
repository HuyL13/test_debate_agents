  title: Record crowd commemorates Tiananmen Massacre at Hong Kong candlelight vigil
  parent: The problem with communists government is they always try to tell their
    own story.  The only way they have been able to stay in power is through fear.  Fear
    that any challenge to their power will result in more death.  The souls of 202
    people being lost is sad, but so is the loss of freedom.   This tradition should
    remain alive, as should the tradition of questioning the truth of what happened
