  title: Flood of false bomb threats raise security concerns in Kosovo
  parent: It seems like these sorts of conflicts are just eternal. Tribalism just
    seems too innate and natural in people for it to ever truly be defeated. Peaceful
    coexistence really seems like the rare exception to the rule, when you look at
    human history as a whole.
  target: Over generalizing a situation can lead to conclusions that are a bit off
