input:
  title: The Caribbean speaks out on the climate crisis
  parent: Once you get youth active in doing something they may never cease. They
    may do things they should take no part in. Society's road to anarchy is possibly
    paved.
  target: I think we have bigger problems to deal with that our youth being active
    in causes they believe in. It seems like you want them to be quiet and just go
    along with whatever you tell them to. Yet, you probably are also in the crowd
    that screams that the youth are lazy. Perhaps the youth will go on to do a far
    better job that you could when it comes to addressing issues like climate change,
    poverty and education.
