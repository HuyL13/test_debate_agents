  goal:
    conclusion_or_goal: The target argues that youth activism is less important than
      larger societal problems.
    candidate: Appeal to Worse Problems
    supporting_reason: The argument cites larger problems (climate change, poverty,
      education) to downplay the significance of youth activism.
    support_relation: Uses the existence of bigger problems as justification for deeming
      youth activism a lesser priority.
    label_justification: It presents a worse problem (climate change, poverty, education)
      to dismiss or minimize another issue (youth activism), which aligns with the
      pattern of an Appeal to Worse Problems fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T3
    evidence_spans:
    - I think we have bigger problems to deal with that our youth being active in
      causes they believe in. It seems like you want them to be quiet and just
    - do a far better job that you could when it comes to addressing issues like climate
      change, poverty and education.
  counterargument:
    decisive_counterargument: The TARGET claims that *all* youth will go on to do
      a far better job at addressing critical issues such as climate change, poverty
      and education, yet it provides no evidence that youth in general possess superior
      skills or knowledge in these domains. This generalization is unfounded because
      it is based on a single speculative assertion rather than on data or examples.
      Without supporting evidence that youth are intrinsically more capable, the claim
      assumes a universal property of an entire group, which is a classic hasty generalization.
    candidate: Hasty Generalization
    challenged_inference: The inference that every young person will ultimately excel
      in tackling major societal problems, such as climate change, poverty, and education,
      is drawn from an unsubstantiated single claim and thus constitutes an overgeneralization.
    label_justification: The TARGET extrapolates the supposed future competence of
      *all* youth from a singular, unverified statement, fitting the definition of
      a Hasty Generalization—drawing a broad conclusion about a population without
      sufficient supporting evidence.
    failure_exposed: true
    evidence_ids:
    - T3
    evidence_spans:
    - do a far better job that you could when it comes to addressing issues like climate
      change, poverty and education.
