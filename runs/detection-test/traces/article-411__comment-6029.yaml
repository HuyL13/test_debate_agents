    conclusion_or_goal: That the government is hiding something nefarious, likely
      genocide, and it censors the internet to conceal this wrongdoing and prevent
      people from speaking out.
    candidate: False Dilemma
    supporting_reason: They infer that censorship must exist only to hide the government’s
      illicit actions, implying that no other motive exists for censoring.
    support_relation: The reason is treated as an exclusive alternative to any other
      possible motive for censorship, establishing the conclusion that censorship
      serves to conceal wrongdoing.
    label_justification: The argument presents a dichotomy—censorship is either for
      hiding nefarious acts or else has no reason—thereby implying a false dilemma
      between ‘censor to hide wrongdoing’ and ‘no other motive’. This fallacy is directly
      employed to justify the conclusion about hidden genocide.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
