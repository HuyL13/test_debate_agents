    - Why else censor everything? Bottom line is that censoring the internet is to
      hide what they are doing to their people and prevent them from speaking out.
  counterargument:
    decisive_counterargument: The argument assumes that the only possible reason for
      internet censorship is to conceal a grave wrongdoing such as genocide. In reality,
      governments censor for numerous other legitimate or even harmless reasons—security
      concerns, protection of minors, political stability, or technological constraints.
      Because the claim does not provide evidence that the censorship is linked to
      a clandestine genocide, it is not logically necessary that the government is
      hiding something nefarious.
    candidate: False Dilemma
    challenged_inference: censoring the internet is to hide what they are doing to
      their people
    label_justification: The objection shows that the reasoning reduces the world
      to only two options—either the government’s censorship is concealment of genocide
      or nothing else—and dismisses all other plausible explanations. This is precisely
      the structure of a false dilemma, where the argument presents a limited set
      of alternatives and forces a conclusion that need not follow from the evidence
      provided.
