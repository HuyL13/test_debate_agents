  counterargument:
    decisive_counterargument: The claim that this measure ‘will keep people out of
      new jobs’ is made without any evidence that the policy actually results in a
      net loss of employment across the industry. It assumes that all job creation
      efforts are thwarted merely because the policy exists, yet no data or specific
      examples are provided. This leap from a single, unsubstantiated claim to a universal
      conclusion about job loss constitutes an unjustified generalization.
    candidate: Hasty Generalization
    challenged_inference: 'Premise: The policy will keep people out of new jobs |
      Conclusion: This will universally eliminate job creation opportunities'
    label_justification: The argument asserts a universal effect (“keeping people
      out of new jobs”) based on a single, unspecified premise about policy impact,
      without substantiating evidence. This is a clear example of a hasty generalization,
      where a broad claim is made without demonstrating that the limited evidence
      justifies that breadth. The counterargument points out the lack of support for
      the universal claim.
    failure_exposed: true
    evidence_ids:
    - T1
    evidence_spans:
    - This is getting out of control! This will keep people out of new jobs just to
      make a measly difference in the global temperature!
