      invoking the policy’s adverse outcome as evidence of its wrongness. This is
      an appeal to consequence: a fallacy that concludes a proposition is false or
      undesirable based on its potential outcomes rather than on its logical or factual
      content.'
    mechanism_supports_goal: true
    evidence_ids:
    - T1
