input:
  title: Hong Kong Polytechnic University on fire after violent clashes between protesters
    and police
  parent: What happens if protesters like these students are attacked and not allowed
    to ever protest or question anything?  They will eventually be silenced completely.  Then,
    the government will either endure their wrath or really end up injuring these
    people.  That will have horrible repercussions in their society like a dystopian
    nightmare.
  target: The police in Hong Kong seem to have been rather excessive in their response,
    though the protesters did seem to be acting violently themselves. Taking that
    all into mind, I can't agree that this is a step towards ending all protests and
    I definitely do not think this is the path to a dystopian nightmare. We should
    argue about whether the police went too far, but we shouldn't claim this is surely
    the end of the free world. We should also make clear that the protesters have
    to maintain peaceful protests, they endanger the right to protest by acting in
    a violent manner. That is the only way we will find a proper resolution, with
    peaceful discussions that bridge the gaps between the two parties. I hope that
    happens before anymore people are hurt!
