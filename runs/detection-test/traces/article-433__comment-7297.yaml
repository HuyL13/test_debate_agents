input:
  title: Remembering Amadou Diallo, a Guinean victim of police brutality in the USA
  parent: 'This has been going on for decades now. I feel like there are 2 options
    here: Take guns away from cops like the UK does or just deal with the fact that
    this is going to happen occasionally. Maybe you could also spend millions on completely
    new training methods for cops?'
  target: The notion of "guns or no guns" envelops the discourse, we often overlook
    the nuanced options that could front a real change. We should try to address the
    safety concerns at its root for change. Mandatory police courses could instill
    a better understanding of handling weapons and ensuring safety in situations.
    Our schools could be nurturing ground for budding minds on safety norms. Are we
    missing out on a golden opportunity to reform our system? It's time we accept
    that multiple, smaller changes strung together could bring a bigger, sustainable
    change.
