input:
  title: '30 years after the Tiananmen Massacre: An interview with survivor Zhou Fengsuo'
  parent: This person is not only advocating for a violent revolution, but for foreign
    nations to wage war to remove the government that they don't like? Frankly, as
    bad as the government of China is in many ways, they're still in ways a lot more
    palatable to me than people who say things like this. If you're faced with the
    nearly billion plus 'brainwashed' and 'ignorant' population and can't manage to
    convince anyone but a tiny minority to support your ideas, the response shouldn't
    be inciting violence.
  target: Yes, its not smart what he's doing. If enough people hear his rhetoric in
    China, it could lead to them actually trying something which would obviously lead
    to tons of death. Once China finds out they tried something due to his rhetoric,
    the CCP could kill everyone he knows.
