  counterargument:
    decisive_counterargument: The claim that the censorship of soccer matches is a
      symptom of Turkey’s growing authoritarian government style is an over‑generalisation
      based on a single example. It assumes a causal link between one regulatory action
      and the overall political character of the state without presenting additional
      evidence that this action reflects a broader pattern of authoritarianism. In
      reality, the restriction could stem from licensing, broadcast‑rights, or other
      non‑political considerations, and one instance is insufficient to substantiate
      a sweeping claim about the government’s style.
    candidate: Hasty Generalization
    challenged_inference: Censorship of soccer matches is a symptom of the growing
      authoritarian government style in Turkey
    label_justification: The objection demonstrates that the argument extrapolates
      from one isolated instance (soccer match broadcasting restriction) to a general
      claim about a complex phenomenon (authoritarian government style). This is precisely
      the definition of a hasty generalization. No other listed fallacy (e.g., slippery
      slope, false dilemma, appeals) applies to the structure of the inference.
    failure_exposed: true
