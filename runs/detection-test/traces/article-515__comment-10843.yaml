  counterargument:
    decisive_counterargument: The author assumes that because similar political infighting
      has not been seen in other countries, the situation in Afghanistan is 'unnatural'
      and therefore undesirable.  Lack of comparable examples does not imply that
      the situation is abnormal or wrong; it merely indicates different reporting
      or contextual factors.  Therefore, using naturalness as a criterion for judging
      the situation commits a fallacy.
    candidate: Appeal to Nature
    challenged_inference: Because Afghanistan’s political infighting is rare elsewhere,
      it is not natural and thus should be deemed unacceptable.
    label_justification: The objection shows that the argument treats lack of natural
      occurrence as evidence of wrongness, which is precisely the definition of an
      appeal to nature.
