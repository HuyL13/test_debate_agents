input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: 'This kind of infighting is only natural among political predators. Notions
    like compromise, negotiation, humility, public service: they don''t even occur
    to such figures because it is not in their nature to engage in such behaviors,
    any more than it''s in the nature of an elephant to climb trees. Let''s hope things
    turn out the way Afghans want it to. They have been through a lot!'
  target: This doesn't seem very natural. I mean, how many other countries are there
    where you can say such a situation is happening? Definitely never heard of any
    kind of crazy situation like this in the US. But we can agree, hope Afghans get
    to move past all this craziness and get what they want.
