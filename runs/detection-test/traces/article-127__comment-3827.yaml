  counterargument:
    decisive_counterargument: The claim that losing the internet will not hurt society
      relies on the fact that a region survived centuries without internet, implying
      that because it worked in the past it will work now. However, that historical
      example is irrelevant because the internet is a fundamentally new technology
      that changes how society functions today. Therefore, the inference that loss
      of internet will not hurt society is flawed.
    candidate: Appeal to Tradition
    challenged_inference: The argument infers that a society will fare well after
      losing the internet simply because it has survived without the internet for
      centuries, treating historical survival as a sufficient justification for modern
      relevance.
    label_justification: The objection demonstrates that the argument is using tradition
      as proof of continued success, a textbook example of an Appeal to Tradition.
      The conclusion is not supported by current evidence but by past practice, fitting
      the defined fallacy.
