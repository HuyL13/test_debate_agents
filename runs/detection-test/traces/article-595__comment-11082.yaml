input:
  title: Thousands of flamingos found dead in Central Anatolia
  parent: ''
  target: It is horrific to see any animal die, when it's thousands of baby flamingoes,
    it's a pure tragedy. We should spend the time and resources to understand what
    happened, but there is a catch. While this is a tragedy there are major issues
    that are happening in Turkey, I don't think we can afford to put all our energy
    into what happened at Lake Tuz. We have the government of Turkey turning more
    authoritarian seeming by the day, shouldn't that come first here? Flamingoes and
    other wildlife matter, but the stability of the country must come first. How about
    we turn Turkey back into the democracy we all love and then implement changes
    to restore our beloved environment? If we can do that, we will can have both our
    freedom AND nature, who could argue against that?
