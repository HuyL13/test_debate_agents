    decisive_counterargument: The claim that he is 'probably not as extreme as that'
      rests solely on the fact that most experts think he is not so bad. Even if a
      majority of experts hold that view, expert opinion is not incontrovertible proof;
      experts can be wrong, biased, or lack full information. Thus the conclusion
      that he is not extreme follows from an inadequate basis, not from solid evidence.
