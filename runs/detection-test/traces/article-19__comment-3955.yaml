      to Papua New Guinea will worsen the situation by preventing journalists from
      learning about the country, thereby causing more problematic or biased coverage;
      consequently this will create greater problems and fatigue for the Prime Minister
      and his administration.
    candidate: Slippery Slope
    supporting_reason: The speaker argues that limiting press access creates a knowledge
      gap, which in turn leads to poorer, more biased reporting that inflates the
      problem – a linear progression from ‘restricting access’ to a broader negative
      outcome.
    support_relation: Mechanism supports goal—by showing a chain of events that would
      make the issue worse, the speaker justifies that tougher media rules are problematic.
    label_justification: 'The jump from restricting media access to an overall enlargement
      of the issue represents a classic slippery‑slope claim: one action (harder access)
