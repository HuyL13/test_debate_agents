  counterargument:
    decisive_counterargument: The target’s claim that because criticism will inevitably
      arise, the only viable paths are either inaction or letting courts decide, is
      a False Dilemma—it unjustifiably narrows the range of possible responses to
      just two extremes. In reality, a state can enact improved laws, establish oversight
      mechanisms, engage stakeholders, and revise policies in response to criticism,
      thereby addressing concerns proactively rather than defaulting to silence or
      judicial deferment.
