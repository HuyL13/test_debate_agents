  parent: ''
  target: I can see why the meeting between the Azerbaijan's President Ilham Aliyev
    and Armenia's Prime Minister Nikol Pashinyan had it's detractors. There is certainly
    some controversy between the two countries and some people will always hold a
    grudge. I think we need to go back to more traditional views on this issue. Remember
    how we would let the past be the past? How we would forgive and forget? That was
    successful in our past and it surely can be a success in our current day as well.
    It does not mean that the past grievances can't be addressed, it's more about
    looking at those problems with a more impartial view. I'm sure if we can do this
    that these countries will be able to form closer ties and will prosper because
    of it. Traditionally I would say that would be a win-win for everyone involved.
