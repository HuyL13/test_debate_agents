input:
  title: In Togo, singer Elias Atayi uses music as a vehicle for human rights
  parent: Music has always been a vehicle for change. For long before recorded history,
    all arts were a means for people to express what they think of the world they
    live in and the world they'd like to live in. It's unfortunate that so many governments
    are trying so hard to kill that tradition.
  target: I agree that music has been important for many cultural changes through
    history. I am thinking of how protest music like "We Shall Overcome" emboldened
    the Civil Rights movement in the USA. Authorities fear musicians like Elias Atayi
    because they provide inspiration and boost morale to important causes that threaten
    the status quo.
