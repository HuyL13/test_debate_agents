  counterargument:
    decisive_counterargument: The argument that abortion is morally wrong merely because
      it is not a natural occurrence commits a classic *appeal to nature* fallacy.  Naturalness
      does not establish moral correctness; many beneficial medical practices—organ
      transplants, vaccines, contraceptives—were invented by humans and are decidedly
      non‑natural, yet they are widely regarded as ethically right.  Morality cannot
      be reduced to whether something aligns with the patterns found in the natural
      world.  Therefore the inference that abortion is morally impermissible simply
      because it is non‑natural is logically flawed and unsupported by any moral principle.
    candidate: Appeal to Nature
    challenged_inference: Abortion is morally wrong because it is not a natural occurrence
    label_justification: The objection directly attacks the premise that ‘naturalness’
      is a sufficient moral yardstick, exposing the Target’s reliance on the Appeal
      to Nature fallacy.  The Target uses “Because it’s not natural” as the sole justification
      for abortion’s immorality, which is the hallmark of an appeal‑to‑nature argument.  The
      counterargument shows that morally acceptable practices can be artificial, thus
      the inference is unsound.
