input:
  title: Trinidad & Tobago NGO identifies treatment of women as key issue in upcoming
    elections
  parent: Everyone knows men who have a history of sexual violence can not be trusted,
    and that goes double for if they are politicians. Its absurd to let a man like
    that become one. It goes against the tradition of being able to trust your public
    officials. Politicians have always been supposed to meet higher moral standards
    than the rest of us. Being a woman abuser is disqualifying.
  target: This type of law does not allow the legal court process to decide the issue.
    These political candidates have not been found guilty of a crime. These candidates
    are innocent of any allegations, unless proven guilty. It is unfair to political
    candidates to bypass the courts, and punish them.
