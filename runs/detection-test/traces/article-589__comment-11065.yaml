input:
  title: In Azerbaijan silence looms as yet another member of LGBTQ+ community is
    fatally targeted
  parent: Imagine living in such a poor country and yet focusing all your attention
    on trans people, who make up almost 0 percent of the country. Why not focus on
    ending poverty or corruption or something else with actual importance? Isn't bringing
    prosperity and happiness to your country more important than hate?
  target: I think poverty and basic human rights can both be addressed. Poverty is
    often a sign of uneducated citizens, as is discrimination. By addressing the root
    causes of both issues everyone will benefit. By promoting acceptance of diversity
    and understanding of everyone we can help to eliminate many issues. Let's prioritize
    all people and everyone will benefit.
