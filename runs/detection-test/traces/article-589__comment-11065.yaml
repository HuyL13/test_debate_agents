  counterargument:
    decisive_counterargument: The claim that 'poverty is often a sign of uneducated
      citizens, as is discrimination' overgeneralizes a complex phenomenon. Poverty
      arises from a variety of structural, economic, and political causes, many of
      them unrelated to education level; numerous studies show that poorer populations
      can have high levels of education. Thus, treating poverty as a proxy for lack
      of education obscures the true roots and risks diverting resources away from
      more effective interventions.
    candidate: False Dilemma
    challenged_inference: The inference that addressing root causes of both poverty
      and discrimination will automatically benefit everyone
    label_justification: The objection directly critiques the overgeneralization that
      poverty equates with lack of education, exposing a hasty generalization in the
      target’s reasoning rather than a simple rhetorical criticism. The counterargument
      relies on evidence that poverty stems from many factors besides education, thereby
      undermining the target’s causal claim.
