  counterargument:
    decisive_counterargument: The target claims that “the police will never reach
      the point of having total freedom to execute whomever they wish,” yet it offers
      no evidence for this conclusion.  By asserting that this extreme outcome can
      never happen based solely on the fact that it has not occurred yet, the argument
      commits a hasty generalization—drawing a universal negative conclusion from
      insufficient data.  Historical examples of police departments gaining unchecked
      power (e.g., derogatory regulations in certain cities, widespread militarization
      of police forces) show that the lack of a current extreme does not guarantee
      its inevitability.  Therefore, the claim that police can never become essentially
      judge–jury–executioners is unjustified and relies on a sweeping generalization.
