    decisive_counterargument: 'The argument bases the disqualification of a politician
      simply on an unexamined belief that the tradition of higher moral standards
      for public officials requires disqualification of anyone with a history of sexual
      violence.  That is a classic appeal to tradition: it assumes that because the
      norm was once upheld, it must always hold, without showing that the tradition
      still applies or that it logically warrants disqualification.  The claim does
      not provide any evidence that the tradition actually obligates disqualification
      or that the history of sexual violence inevitably renders a person untrustworthy
