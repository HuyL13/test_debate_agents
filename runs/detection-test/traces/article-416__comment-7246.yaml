  goal:
    conclusion_or_goal: Protesters should not continue protesting but instead follow
      what has been traditionally done in the past.
    candidate: Appeal to Tradition
    supporting_reason: Tradition has power and can be very rewarding.
    support_relation: The argument justifies abandoning the protest by citing the
      value of tradition as the basis for its recommendation.
    label_justification: The target relies on the continued practice of past actions
      to justify its stance, which is the defining feature of an Appeal to Tradition
      fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Maybe going along with what has been done in the past in one of the largest
      countries in the world. Tradition has power to it and can be very rewarding.
    - Old is gold, as they say.
  counterargument:
    decisive_counterargument: Target reasoning claims that following what has been
      done historically (because it is a tradition in a large country) is justified
      and rewarding, implying that the past itself is a sufficient basis for the present
      action.  This ignores the possibility that the tradition may have originated
      under different circumstances, that it could be ineffective or harmful today,
      or that the long‑standing practice might be the very cause of the problems being
      addressed.  Therefore the inference that tradition alone warrants continuing
      protests (or any other specific action) is unwarranted.
    candidate: Appeal to Tradition
    challenged_inference: If we are to determine the best response, we should rely
      on current evidence and relevant values—not simply adopt a past practice for
      its historical continuity.
    label_justification: The objection directly addresses the case where the target
      sets the precedent “old is gold” as proof of sufficiency for the present decision.  By
      arguing that past practice does not automatically confer correctness or desirability,
      we expose the logical flaw that the target’s conclusion rests on an appeal to
      tradition rather than on reasons pertinent to the current situation.
    failure_exposed: true
    evidence_ids:
    - T1
    evidence_spans:
    - Maybe going along with what has been done in the past in one of the largest
      countries in the world. Tradition has power to it and can be very rewarding.
