    candidate: Appeal to Nature
    supporting_reason: As nature takes its course, so do institutions.
    support_relation: used_as_justification
    label_justification: The arguer appeals to the naturalness of institutions’ behavior
      to justify the claim that governments will naturally seek to control narratives.  This
      is a textbook appeal to nature, as the argument presumes that because such behavior
      is ‘natural’, it is acceptable or inevitable.  It is not merely descriptive;
