  counterargument:
    decisive_counterargument: The claim that it is ‘natural’ for a government to control
      the narrative merely asserts that a certain pattern exists. Normality or naturalness
      does not provide moral justification or necessarily reflect what actually happens.
      For instance, many democracies explicitly encourage transparency and open discussion,
      showing that even institutions can defy this supposed ‘natural’ pattern. Therefore,
      the argument’s reliance on the notion that an action is natural is an Appeal
      to Nature – it treats the current or typical state of affairs as evidence that
      the behavior is correct or inevitable.
    candidate: Appeal to Nature
    challenged_inference: It's only natural that the government wants to control the
      narrative about their machinations.
    label_justification: The objection directly targets the inference that normality
      equals justification or inevitability. By pointing out that natural patterns
      are not moral imperatives and citing counterexamples, it demonstrates the specific
      fallacious reasoning of an Appeal to Nature. No other fallacy is required.
    failure_exposed: true
