  counterargument:
    decisive_counterargument: The claim that COVID should be ignored because Ebola
      is worse misrepresents a comparative problem by treating the two diseases as
      mutually exclusive options and assuming that the one with greater case‑fatality
      rate automatically deserves all attention. In reality, COVID‑19 already results
      in orders of magnitude more infections and deaths globally, and neglecting it
      would lead to a far larger loss of life and societal disruption than even a
      severe Ebola outbreak. Thus, the reasoning is flawed because it reduces a complex
      public‑health decision to a simple binary choice and dismisses the broader impact
      of COVID.
    candidate: Appeal to Worse Problems
    challenged_inference: They should focus only on Ebola and not on COVID.
    label_justification: The objection highlights that the argument treats Ebola as
      the "worse" problem and thereby justifies deprioritising COVID without considering
      the broader scale and impact of the latter. This is precisely the logical misstep
      known as an "appeal to worse problems," where the fact that one issue is more
      severe is wrongly taken to mean that it should automatically receive all attention,
      while the other is neglected.
