input:
  title: First comprehensive study on child abuse in Madagascar points to alarming
    level of violence
  parent: There seems to be too much first world perspective in this argument. Life
    is rough on the third world and blindly applying child rights from our perspective
    will lead to worse problems for them. I understand the emotional appeal to things
    such as beating children and making them work for low pay but you can't just wave
    a wand from an economic standpoint and make this better like that
  target: Basically you are saying that we should just turn a blind eye to children
    being abused? No child in any part of the world should be subjected to physical,
    sexual or mental abuse. For you to deem that as something that is a first world
    problem, is very ignorant. Yes, some of these behaviors stem from culture and
    tradition, it is still wrong for us not to try and mitigate the situation. It's
    time that we broader our perspective and face these challenges head on. Its much
    better than to just stand by and make comments that can be deemed as ignorant.
