input:
  title: Bangladesh regulator blocks engineering university webpage containing reports
    of student abuse
  parent: These kids are in college and they think its a good use of their time to
    harass other kids due to politics? They have tests and whatnot to worry about.
    Politics is for when you're older. Idiots! There are many more problems to worry
    about at your age. Your future, climate change, etc.
  target: That does not seem like a very reasonable reaction here. These students
    are the ones who will have to live with the world politics creates longer than
    any of the older adults who engage in politics. If anything, they should be the
    ones most passionate and interested in the processes that will be shaping their
    future. We should ensure they have a safe environment to express themselves without
    any fear of retribution.
