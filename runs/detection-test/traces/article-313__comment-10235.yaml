  counterargument:
    decisive_counterargument: While it is conceivable that many students will be affected
      by politics later in life, the target statement assumes that all students are
      the most passionate and that every student deserves a protected environment
      to express political views. The claim that *‘they should be the ones most passionate
      and interested in the processes that will be shaping their future’* is a sweeping
      generalization from an unstated sample (perhaps a few outspoken students) to
      the entire student population. Without evidence that every student cares about
      politics or that such an environment is needed for all, the argument over‑extends
      and misrepresents the diversity of student interests and motivations.
    candidate: Hasty Generalization
    challenged_inference: These students are the ones most passionate about politics
      and deserve a safe environment to express themselves
    label_justification: The statement generalizes from the implicit premise that
      some students are passionate and active in politics to the claim that *every*
      student shares this passion and therefore warrants special protection. This
      broad extrapolation from limited or no evidence exemplifies Hasty Generalization.
