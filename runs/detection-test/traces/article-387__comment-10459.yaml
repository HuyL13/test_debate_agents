input:
  title: The quiet weeding out of Hong Kong’s media landscape
  parent: You believe Hong Kong is finished just because of a single law and a few
    examples of it maybe negatively affecting the country?  I think you are jumping
    to a conclusion without weighing all the facts and understanding that laws can
    be complex and their outcomes evolve over time. I understand the initial concern
    but we have to look at these issues with a discerning eye to see what the actual
    effects and their causes are.  At this point we are not sure if the concerns to
    this law will not be addressed and improve the law in the long run. I really hope
    that in the end all these concerns will actually lead to a more free Hong Kong
    and the people who live there.
  target: Precisely, their intentions have been shown. Waiting to see how it turns
    out, as you propose, could be disastorous. They have already shown their cards
    in what they want to do. They want to limit the media and make sure that the message
    is what they want, this has to be taken seriously now. The free world must begin
    to advocate for a free press in Hong Kong.
