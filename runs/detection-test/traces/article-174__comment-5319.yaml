input:
  title: 'Netizen Report: Tunisian Court Refuses to Ban Online LGBTQ Radio Shams Rad'
  parent: Although I approve of the actions of the Tunisian government when it comes
    to their recent rulings, it seems a bit hypocritical in my opinion. I can see
    it is confusing to some of its citizens as well. If you as a country ban same
    sex relationships, how are you allowing a radio station to cater to these same
    individuals? They need to be clear and consistent on where they stand on this
    issue.
  target: I see where you're coming from, but I don't think it's necessarily hypocritical.
    For example, in America, we're allowed to say and discuss plenty of things that
    wouldn't be legal to actually do. As the most extreme example, we can make movies
    depicting murder. More reasonably and more related to what might be happening
    here - even when say same sex marriage was illegal, it wasn't as if it was illegal
    to go on the radio or wherever and talk about how it should be legal. I suspect
    the same was true back in the days homosexuality itself was illegal in America.
    Speech and action are two different things.
