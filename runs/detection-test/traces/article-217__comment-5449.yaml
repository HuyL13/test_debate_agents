  counterargument:
    decisive_counterargument: The argument assumes that the possession of any sexual‑assault
      allegation automatically proves a person is untrustworthy, yet it offers no
      evidence that the allegations are substantiated or that the individual actually
      committed wrongdoing.  Many people face allegations that later turn out to be
      unfounded, and a single allegation is not a reliable indicator of overall character
      or competence.  Therefore the inference that “sexual‑assault allegations ⇒ untrustworthy”
      is unjustified.
    candidate: Appeal to Tradition
    challenged_inference: The claim that electing someone with sexual‑assault allegations
      breaks the tradition of electing trustworthy officials because the allegations
      alone prove untrustworthiness.
    label_justification: The argument relies on a historical tradition (‘one of the
      oldest traditions is to elect trustworthy people’) to justify a claim about
      current individuals’ trustworthiness.  The tradition is invoked as a moral authority
      rather than as empirical evidence, which is the hallmark of an Appeal to Tradition.  The
      objection focuses on the unjustified leap from an unverified allegation to a
      categorical judgment of trustworthiness, exposing the fallacy in the reasoning
      chain.
