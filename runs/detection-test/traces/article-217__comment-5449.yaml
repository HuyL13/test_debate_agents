  goal:
    conclusion_or_goal: The speaker argues that individuals with sexual assault allegations
      should not be elected because doing so would break the longstanding tradition
      of entrusting public office to trustworthy people.
    candidate: Appeal to Tradition
    supporting_reason: It is one of the oldest traditions in the world to elect people
      to office who the public can trust.
    support_relation: The tradition is cited as the rationale for rejecting candidates
      with such allegations.
    label_justification: The argument applies the appeal to tradition fallacy by asserting
      that because something has historically been done a certain way, it must continue
      to be done that way, thereby disqualifying the candidate.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - It is one of the oldest traditions in the world to elect people to office who
