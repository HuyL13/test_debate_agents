input:
  title: Why Did Women Journalists Strike in Spain?
  parent: I am much more likely to trust the people in charge of these organizations
    than the women striking. How do we know what they say is true? If there were real
    issues, the people in charge would handle it. Feminist protests like this usually
    blow things out of proportion, let's be honest!
  target: Oh come on now, there are plenty of complaints by these women journalists
    that could easily be verified. Plus these are the very same complaints that is
    heard in other areas of the world, there is zero chance that these women protesters
    are standing up under false pretenses. Many of their concerns have been well-documented,
    showing the imbalance and unfair conditions they face. Maybe now it's high time
    that relevant authorities start listening to these brave women and take a stand
    to change the situation, instead of turning a deaf ear to their valid concerns.
initial_analysis:
  structure:
    evidence_spans:
    - plenty of complaints by these women journalists that could easily be verified
    - these are the very same complaints that is heard in other areas of the world
    structure_type: popularity_to_claim
    slots:
    - role: population_group
      text: women journalists
    - role: popularity_claim
      text: plenty of complaints that could be verified and the same complaints are
        heard worldwide
