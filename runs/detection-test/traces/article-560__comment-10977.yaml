  counterargument:
    decisive_counterargument: 'The target argument relies on the claim that ‘most
      people would agree that abortion is necessary in some cases’ as evidence that
      abortion should be allowed. This is a classic Appeal to Majority: it assumes
      that because a majority holds a view, the view is objectively right or should
      be adopted. The target offers no empirical data or logical reasoning linking
      popular opinion to moral or factual correctness. Thus the inference that abortion
      must be permitted in such cases is unsupported by any argument other than the
      popularity of the opinion. This exposes an *Appeal to Popularity* fallacy.'
    candidate: Appeal to Majority
    challenged_inference: most people would agree that abortion is necessary in some
      cases like rape or the woman's life being in danger
    label_justification: By critiquing the target’s use of majority opinion as proof,
      we demonstrate that the argument’s inference variable depends on a faulty reasoning
      strategy. No other fallacy more precisely describes this misuse, so we correctly
      identify the Appeal to Majority. The counterargument directly addresses the
      target’s inference and shows why it is logically invalid.
