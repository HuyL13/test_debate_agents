input:
  title: Remembering Amadou Diallo, a Guinean victim of police brutality in the USA
  parent: Every single instance of policy brutality needs to be fully accounted for.
    If not, it can only get worse. Cops are already murdering people with virtual
    impunity, so long as they can passably pretend they were afraid. What's next?
    They won't even have to use that excuse? They will just become judge, jury, and
    executioner? How much more power will these killers eventually get if they're
    not stopped?
  target: 'It''s true that we need to address every instance of police brutality,
    there is no justification for excess violence by anyone. Having said that, I don''t
    think we will ever reach the point of the police being given total freedom to
    execute whomever they wish. There is no reason to go to that extent in your argument,
    what police officers have done to this point is already bad enough. We must also
    make clear that many police officers do not cross the line, we must give credit
    when they show restraint especially when it may be difficult. If we are always
    pointing out the negatives and ignoring all positives then it dampens the efforts
    to actually improve the interactions. We should strive for that, not just because
    it''s right, but also for the memory of Amadou Diallo. He didn''t deserve the
    treatment he received and it would further dishonor him if we let the system continue
    to be broken. #JusticeForAmadou'
zero_shot:
  label: Non-Fallacious
  reason: The comment does not commit any of the listed fallacies; it simply counters
    a slippery-slope claim and argues for balanced recognition of police behavior.
