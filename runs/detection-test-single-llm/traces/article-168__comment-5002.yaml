input:
  title: Ethnic Albanian votes will decide presidential elections in North Macedonia
  parent: If a presidential candidate is going to be voted on just by people of their
    ethnicity that means that Macedonia is a divided country susceptible to bias.
    Perhaps this is something they should work on so that they can choose candidates
    based on merit rather than their genes. Racial bias is something that should be
    addressed all over the world so that we can move forward as a human race.
  target: Perhaps it screams racial bias but we will have to dig deeper to truly find
    out. I don know if we can make that assumption off of one election. There is obviously
    distrust of government and we don't know what platforms these candidates are presenting.
    Maybe it just happens to be that they are putting forth legislation that will
    benefit people of their ethnicity. Or perhaps giving them a voice that has been
    silent for a long time. I'm sure all minority candidates campaign in a similar
    way when it comes to their constituents.
