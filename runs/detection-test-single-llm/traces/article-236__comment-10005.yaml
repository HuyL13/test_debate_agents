input:
  title: A snapshot of climate strikes across Southeast Asia
  parent: Most people in the world want positive action to combat climate change -
    79% to be exact as surveys have shown. There is a cry for robust action on this
    issue from the collective voice. Such an overwhelming consensus signifies the
    magnitude and urgency we are facing. It's just too big and widespread to ignore
    anymore. Because of this, we must act to ensure the future of the planet is a
    good one for humanity. With so many united in this belief, doesn't this prove
    that imminent action is a necessity for preserving the world for future generations?
  target: I am one of those people who want to see immediate action on the issue of
    climate change, it is a very serious problem that will effect the whole world.
    That being said, I want this done because it is a real problem, not because so
    many people are in agreement with me. Your argument seems to be mostly based on
    the fact that most people are worried about climate change, that is probably true
    but it shouldn't be such a focus. The focus should be on the core issue, the planet
    is in trouble and we must help prevent any more damage. We must make people understand
    that this is important and must be done quickly if we are to make a true difference.
    Like those young people who protested around the world, they are seeing the problem
    and trying to fix it. Can we work together and find a solution here to get more
    action and less words?
zero_shot:
  label: Non-Fallacious
  reason: The comment does not commit any of the listed fallacies; it simply rejects
    the appeal to majority and argues for action based on the problem itself.
