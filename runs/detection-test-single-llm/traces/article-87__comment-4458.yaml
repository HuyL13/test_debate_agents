input:
  title: In Hong Kong, local entrepreneurs champion the pro-democracy cause
  parent: The news on this topic is interesting to me. The internet 'news' makes it
    seem like Hong Kong wants nothing to do with China and that these protests truly
    represent the popular will. I have a few friends from Hong Kong, and they all
    love China. Strange. Seems like the news isn't interested in reporting what the
    people actually think.
  target: We all have seen situations like the one you speak of. Your friends do not
    represent the entire country or the majority of people in Hong Kong though. Perhaps
    they have it good so why would they not say they love the Chinese government.
    We cannot conclude things based on a small example of people. I am sure there
    are some who love the Chinese government, but they are not the only voice in that
    country. From everything that I have seen and read, the majority are not fans
    of the Chinese government.
zero_shot:
  label: Fallacious
  reason: The comment draws a broad conclusion about the majority of Hong Kong residents’
    views on the Chinese government based on limited, anecdotal evidence (“everything
    I have seen and read”), which is a classic hasty generalization.
result:
  prediction: Fallacious
  correct: false
