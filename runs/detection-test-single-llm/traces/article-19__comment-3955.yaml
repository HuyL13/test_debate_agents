input:
  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: To me this just seems to want to placate a blind belief that more press
    access equals good. I find it perfectly acceptable that Papua New Guinea doesn't
    want to blindly open the floodgates to journalists given their situation. Western
    countries know very little about Papua New Guinea and anything happening there.
    This results in journalists almost entirely framing the debate of what to think.
    Lots of journalists are simply going to exacerbate anything they find to drum
    up interest
  target: So you bring up Western countries and their lack of knowledge of the country.
    They you say that lack of knowledge leads to them writing stories in which they
    entirely frame the debate. Don't you think that this whole issue of making it
    harder for the foreign journalist to come in, is going to make this a bigger issue?
    How are they supposed to learn about the country and its issues in order to write
    more balanced stories so they don't frame their from their own point of view?
    I think that the PM should be worried about more important things that the media.
    Or perhaps he is, and slicing the media or making it tougher for them to get access
    will ease those worries. Hence the corruption issues. Maybe if he was more transparent,
    the media would not be clamoring for access?
zero_shot:
  label: Fallacious
  reason: The comment commits an Appeal to Worse Problems by asserting that the PM
    should prioritize other issues over media access, implying the media issue is
    less important.
