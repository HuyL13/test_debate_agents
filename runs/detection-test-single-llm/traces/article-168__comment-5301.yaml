  title: Ethnic Albanian votes will decide presidential elections in North Macedonia
  parent: If a presidential candidate is going to be voted on just by people of their
    ethnicity that means that Macedonia is a divided country susceptible to bias.
    Perhaps this is something they should work on so that they can choose candidates
    based on merit rather than their genes. Racial bias is something that should be
    addressed all over the world so that we can move forward as a human race.
  target: Saying they have racial bias loses a bit of nuance. Just like in the developed
    countries like America, people who come from a certain group understand and care
    about the issues relating to that group more than people outside of it. Macedonians
    voting for a Macedonian who they feel represents them well is no different from
    African Americans voting for African American candidates. Of course it would be
    ideal if the entire world were colorblind, but that's not the real world and people
    have to look out for their own interests in what ways they can.
