input:
  title: COVID-19 revives grim history of medical experimentation in Africa
  parent: Just because something has always been done, doesn't make it right. Why
    are the less fortunate or those in Africa the only ones we can use as test subjects?
    We should not use tradtion/history as an excuse to do wrong.
  target: If there are going to be human test subjects at all, why not those who don't
    typically have access to good health care? There should be a balance between West
    and Africa, but I don't see a problem with underprivileged people worldwide consenting
    to a trial. The problem of past exploitation is a serious one, and informed consent
    should be a top priority, so I agree that just because something was done in the
    past doesn't make it right, but I can see how a testing program could be designed
    to be as humanitarian as possible for those who otherwise lack access to quality
    health care.
