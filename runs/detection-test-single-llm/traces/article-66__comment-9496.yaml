  title: Activists in Lebanon are taking on the country's stray bullet problem
  parent: You can't tell people how to celebrate.  Just because some people are too
    stupid and irresponsible to fire guns doesn't mean this right should be taken
    away from everyone. It  will spiral out of control.  It might get so out of hand,
    one can't even burn leaves in their front yard lest they burn down everyone's
    property.
  target: Actually, where I'm at, it is illegal to burn leaves in your yard. There
    IS a fire risk, just like there's a risk of death due to celebratory shooting,
    and I'm fine with measures to reduce those risks. You're trying to make a slippery-slope
    argument, as if someone's going to take away all guns. But we can take safety
    measures and still keep our civil liberties. Los Angeles warns of criminal charges
    with jail time to deter the practice, so it's possible to respect responsible
    gun ownership and curb reckless behavior.
