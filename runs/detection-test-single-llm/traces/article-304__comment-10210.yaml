input:
  title: First transgender pride march hopes to shatter stereotypes in Pakistan
  parent: More than any of this, I'd be interested to see what public opinion in the
    country is on this issue. Is this a government unilaterally denying them the laws
    that the majority support, or do the people not actually support it? I don't believe
    it's fair to have minorities pushing through legislation and changes that go against
    the will of the people so this is what I want to read more about.
  target: It doesn't really matter much what the majority thinks, although it would
    be nice if the majority was accepting of trans individuals. The Transgendered
    Persons act has passed, and is a matter of law regardless of what the majority
    think. It just hasn't been implemented. Anyway, I wonder if the majority would
    be accepting of all the violence (sometimes lethal) that trans individuals have
    to face. That said, the media blackout of the event is unfortunate because that
    might have helped ease social prejudices, which is where real concrete change
    will occur. Exposure to different viewpoints is how tolerance is fostered. Meanwhile,
    implementing the law will save lives, whether the majority realizes it or not.
zero_shot:
  label: Non-Fallacious
  reason: The comment does not employ any of the listed fallacies; it simply states
    that the law is valid regardless of majority opinion and that media coverage could
    foster tolerance.
