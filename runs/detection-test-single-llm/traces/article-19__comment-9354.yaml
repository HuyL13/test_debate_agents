input:
  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: I've seen this reduction in press transparency in other countries, and it
    is concerning, but I don't want to assume anything. While it is true that some
    governments that restrict press access have corruption issues, I don't want to
    automatically assume that the PNG government is corrupt. Perhaps they have something
    to hide, but perhaps not. Hopefully, as time goes on, they will show that they
    are on the level.
  target: I appreciate your optimism, and I suppose the government hasn't done anything
    "wrong" yet, but it's also true that governments that are secure in their position
    do not limit press freedoms. The only reason to worry about the press is if one
    is concerned about what the press will write. But it's also historically true
    that these measures are not popular and are self-defeating for the governments,
    so I can see a brighter day ahead.
zero_shot:
  label: Fallacious
  reason: The comment makes a broad claim that all governments secure in their position
    do not limit press freedoms, which is a hasty generalization based on insufficient
    evidence.
