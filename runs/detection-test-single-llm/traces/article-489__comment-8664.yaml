  title: A 15-year-old rape victim is the latest collateral damage of Duterte's drug
    war
  parent: This is tough since you need a tough police force in order to run a country
    and keep law and order. Duterte can either continue to encourage coarseness and
    brio among his policemen, seeing these cases of rape as an unfortunate byproduct
    of tough policing by tough cops, or he can cleanse the police departments and
    rebuild the force de novo. I don't think a third way, that of reform, will be
    very effective.
  target: I agree that there must be action by Duterte over these appalling crimes,
    I just think a more nuanced approach would work better. There are definitely more
    than just two approaches to help fix the police force in the Philippines. Clear
    and comprehensive training for police officers would be the obvious first step,
    followed by a ongoing program that monitors any violations as they occur. Also
    it would be wise to being hiring officers from a varied sample of the population,
    this way we have more representation and can help prevent problems before they
    happen. I think implementing these are a good step forward to cleaning up the
    police and still having a strong force going forward.
