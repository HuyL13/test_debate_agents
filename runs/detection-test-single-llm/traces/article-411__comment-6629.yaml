  label: Fallacious
  reason: The comment dismisses addressing Syria and North Korea because they are
    considered too far gone, thereby deprioritizing them in favor of Turkmenistan.
    This is an instance of the Appeal to Worse Problems fallacy, where an issue is
    ignored or downplayed solely because a worse issue exists.
