  title: New study finds internet censorship in Turkmenistan reaches over 122,000
    domains
  parent: I think that we need to focus on the worst countries first, such as Syria
    and North Korea. I think that the only way to address the issue of freedom is
    to tackle the worst instances first. Turkmenistan may be low on the list of freedom
    in the world, but we need to systematically address countries at the bottom of
    the list first, to solve this issue.
  target: Those countries are too far gone. I think Turkmenistan is a more reasonable
    one to start with in terms of bringing attention to it at least. Most people already
    know about Syria and NK. Not many know about Turkmenistan. This study should hopefully
    bring more attention to what the people there go through.
