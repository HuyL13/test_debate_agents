input:
  title: In Azerbaijan silence looms as yet another member of LGBTQ+ community is
    fatally targeted
  parent: If bloggers and social media influencers are allowed to incite violence
    against one group of people for whatever reason it is only a matter of time before
    another group is targeted for another reason. Nobody is safe if law enforcement
    and decent citizens and the government look the other way at violence against
    any group. There needs to be strict regulations against hate speech of any kind.
  target: Absolutely right! It's amazing that so many social media influencers have
    the power to incite violence, but lets not assume they are all eager to focus
    on once group and cause issue with them. We're seen so many influencers are the
    opposite and work to fight against injustices, many more are joining protests
    and and against the actions of hate groups. Of course, it's safe to say that all
    these influencers genuinely care about social justice and are not just doing it
    for the image and follows, right? We shouldn't lump them all together, okay? On
    the other hand, I saw an influencer last week who barely showed any interests
    in these issues until it started trending. It makes you wonder if they are just
    following trends or are they socially aware?
zero_shot:
  label: Fallacious
  reason: The comment makes a broad claim that all social media influencers genuinely
    care about social justice and are not motivated by image or follows, based on
    limited examples, which is a hasty generalization.
