input:
  title: Ethnic Albanian votes will decide presidential elections in North Macedonia
  parent: Saying they have racial bias loses a bit of nuance. Just like in the developed
    countries like America, people who come from a certain group understand and care
    about the issues relating to that group more than people outside of it. Macedonians
    voting for a Macedonian who they feel represents them well is no different from
    African Americans voting for African American candidates. Of course it would be
    ideal if the entire world were colorblind, but that's not the real world and people
    have to look out for their own interests in what ways they can.
  target: That's part of the point I think. It seems that only one side seems to think
    it is okay to vote along racial lines, just like in the US. African Americans
    are said to be "supportive of their race" when they vote for candidates that are
    the same race that they are, but if whites vote for white people then they are
    seen as "racist". I think it is a bit more than just "voting for someone that
    is of the same race I am because they know what I go through" I think if more
    people were in fact color blind as you said, it would be better, but I think there
    is a lot of outside forces that make it seem like it is a both sides type issue.
    That is what seems to be happening here there is one side that is only supported
    by their own racial similars and a backlash of non-similars instead of looking
    at policies that would benefit everyone. Hopefully Macedonians and people all
    over the world can start looking at inclusivity as a norm that all people take
    part in instead of forcing it from whichever race or creed happens to have a majority
    in the country. Only then can a democracy flourish.
zero_shot:
  label: Fallacious
  reason: The comment makes a broad claim about how entire racial groups are perceived
    when voting (e.g., African Americans are seen as ‘supportive of their race’ while
    whites are seen as ‘racist’), without providing evidence or acknowledging nuance.
    This is a hasty generalization.
