input:
  title: This digital novel narrates the violence against ethnic Chinese during the
    1998 riots in Indonesia
  parent: I don't think people should focus so much on the past. Both Indonesia and
    China have a lot of significant problems they're facing right now. There's ever-increasing
    repression in both countries, inequality, suffering of all kinds. Is now the time
    to try to heal the wounds of some 25 year old event that affected some small minority?
    That is the sort of thing you try to do after you've solved the bigger problems.
  target: I think something you may be missing here, is that by fixing this problem,
    it helps lead to fixing those other problems you see as important. If people can
    come to terms with something that harmed a minority several years ago, it can
    help start healing some of that inequality and suffering. People working together
    to get past differences is what will bring solutions to the problems you mentioned.
    Turning a blind eye to the events of the past only drive a larger wedge between
    the people that were harmed and the damage done by the terrible actions of the
    Indonesians that perpetrated them. It could lead to the events being repeated,
    which would be an even greater tragedy. This digital novel does a great job of
    reminding people exactly what happened and why it should not happen again.
