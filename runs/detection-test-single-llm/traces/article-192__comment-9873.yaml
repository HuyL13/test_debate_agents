input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: Are we really getting bothered about soccer matches? Especially, the right
    to illegally stream soccer matches? I mean, if they start abusing the law to go
    after what its intended purpose, that would be bad of course, but don't people,
    particularly Turkish people, have far bigger problems to worry about? This sort
    of 'censorship' is hardly meaningful in the face of what Turkey's current dictator
    is doing.
  target: I see your point here, why should we care over the censorship of soccer
    matches being broadcast? That is very fair, but I think there is a bigger point
    being made here that you are potentially overlooking. This may seem like a small
    thing, but it is just a symptom of the growing authoritarian government style
    in Turkey. Even if it is not the most major problem in all of Turkey, there is
    plenty of resources to deal with all problems. The more problems we can address
    then the better the society in general will function. That is the hope at least,
    that if we can bring back even small freedoms to Turkey that larger ones will
    follow.
zero_shot:
  label: Fallacious
  reason: The comment asserts that restoring small freedoms will inevitably lead to
    larger freedoms, presenting an unsupported causal chain from a minor step to a
    major outcome—an instance of the slippery slope fallacy.
result:
  prediction: Fallacious
  correct: false
