input:
  title: Tunisia has a disinformation problem, but (further) criminalizing speech
    won't solve it
  parent: Governments that attempt to support human rights are a model for the rest
    of the world. As a certain peace ambassador I admire once put it, it requires
    immense strength to prioritize the needs of others. Kudos to Tunisia for not only
    fostering such strength, but also for their unwavering commitment to equality
    and justice. Their administration exemplifies dedication to human rights. If the
    rest of the world took a leaf out of their book, imagine the progress we could
    achieve?
  target: I am definitely a supporter of governments that support human rights, I
    think that most people in the world feels the same. I just don't understand your
    thought process here, how exactly are you labeling Tunisia as one? They are clearly
    try to restrict free speech with this newly proposed law, everyone knows that
    misinformation or disinformation is incredibly difficult to label. Secondly, who
    is this peace ambassador you are referencing? It doesn't add to your argument
    when you give credibility to some anonymous expert. Can you see where I am coming
    from on this? Wouldn't you want to know who this expert was if you were in my
    shoes? I, for one, am glad that this bill has been withdrawn and we need to make
    sure it stays that way. Let's band together and find out the best way to make
    Tunisia an actual beacon for freedom, equality and justice!
zero_shot:
  label: Fallacious
  reason: The comment asserts that most people in the world share the speaker’s view,
    using popularity as support for the argument—an Appeal to Majority.
result:
  prediction: Fallacious
  correct: false
