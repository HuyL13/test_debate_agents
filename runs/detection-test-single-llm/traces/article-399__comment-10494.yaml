input:
  title: '‘A day without internet is a day in the dark’: The Gambia''s growing digital
    divide'
  parent: I hope that digital reform can be put in place for the people soon. Unreliable
    internet access can lead to further losses in productivity and expression, setting
    the nation further behind. A nation lagging behind in the digital race can turn
    towards more questionable methods to accelerate development. This can lead to
    greater data breaches, restrictions, and widespread distrust in the government.
    Action must be taken quickly.
  target: It would be nice for Gambia to step up their internet service for their
    entire population, just reading the stories from the affected residents is troubling.
    I must disagree with your fatalist vision though, not having the best internet
    does not guarantee the end of Gambia. It is not a great thing obviously, but instead
    of stoking fears we should be proposing ideas to improve the situation. The government
    can improve it's internet exchange point which will add additional connection
    speed to its citizens, also it can open the market to allow more competition.
    More competition almost always ensures lower costs and lower costs means more
    people in Gambia can afford internet. These and many other solutions are the key
    here to boost the access to the internet for all. I am excited to see what the
    future will be with Gambia rightfully involved!
