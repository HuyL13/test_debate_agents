input:
  title: Can Jordan offer some lessons to oil-dependent ‘giants’ on renewable energy?
  parent: ''
  target: It's fantastic to read that the middle east is becoming interested in implementing
    renewable energy sources to replace fossil fuels. Solar and wind technologies
    especially seem well suited to the region, I could see them doing very well with
    those two. I know there will be people who will resist this transition and I think
    their attempts will be misguided. I think back to the better days, when people
    would see advancements as a blessing. It seems like now everyone reacts with fury,
    about what will be lost and ruined with whatever new tech is revealed. What would
    have happened if those people were around back in our past? Would they have scoffed
    at the wheel? Being able to harness fire or electricity? Luckily this did not
    happen and people saw these inventions as blessings, this is a great thing and
    we must recapture this spirit. I know if we do, then we will be better for it
    and so will the next generation. What could be better than that?
