  goal:
    conclusion_or_goal: They conclude that the priority should be on addressing abject
      poverty and commonplace violence affecting large populations in Pakistan, rather
      than focusing on the rights and visibility of a tiny minority.
    candidate: Appeal to Worse Problems
    supporting_reason: The argument cites the serious problems of poverty and violence
