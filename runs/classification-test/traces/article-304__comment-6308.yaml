  counterargument:
    decisive_counterargument: The fact that Pakistan faces major issues such as poverty
      and violence does not make the strides of a minority group trivial. Addressing
      the rights and representation of transgender people can coexist with tackling
      broader social problems; prioritizing one group does not necessarily deprive
      the other of attention. Therefore, using an even greater – but unrelated – problem
      to dismiss the significance of a minority’s progress is fallacious.
    candidate: Appeal to Worse Problems
    challenged_inference: Because Pakistan has serious problems like poverty and violence,
      the achievements of a small minority are less important and should be ignored
      in favor of focusing on those larger issues.
    label_justification: The argument explicitly uses the existence of a more serious
      problem to downplay the significance of a smaller, unrelated problem. This is
      the classic structure of an ‘Appeal to Worse Problems,’ where a greater issue
      is presented as a justification to disregard a lesser one. The objection demonstrates
      that this inference is faulty because it fails to recognize that multiple problems
      can be, and should be, addressed simultaneously.
