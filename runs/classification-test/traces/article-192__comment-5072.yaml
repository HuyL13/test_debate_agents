input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: Censorship and strong hand ways have always been part of the Turkish way.
    Nothing to see here. People should expect this to be the way, as it's always been,.
  target: Just because it's been that way doesn't mean it has to continue being that
    way. The Turkish people need to stand up to this using what little free speech
    they have remaining or the consequences will be dire. The repression will only
    grow further and further if it's not stopped before it's too late.
