  counterargument:
    decisive_counterargument: The target claims that if the Turkish people do not
      use whatever free speech remains to stand up against censorship, repression
      will inevitably grow further and become dire.  However, the target provides
      no evidence that repression actually escalates in a predictable, worst‑case
      trajectory when action is withheld, nor that action would reliably halt or reverse
      it.  Declaring that the situation will worsen without presenting any causal
      or empirical support is an unjustified anticipation of future consequences—an
      unsubstantiated slippery‑slope claim.
    candidate: Slippery Slope
    challenged_inference: Not taking action now will leave repression to grow continuously
      and result in dire consequences.
    label_justification: The objection highlights that the target’s conclusion about
      future, worsening repression is derived from an unproven chain of escalating
      events, which is the hallmark of a slippery‑slope argument.  The target’s inference
      relies on a future outcome that is not supported by evidence, fitting the definition
      of this fallacy.
