input:
  title: Capturing the mood on both sides of the Ukraine-Russia conflict in Donbas
  parent: ''
  target: Coming from what I have gleaned myself, and considering the folks who are
    directly affected by this ongoing conflict, it's simple human nature that trust
    will just erode over time. The dreadful experience of every time the sun sets,
    all the combat and fear just wears people down imperceptibly. This isn't a reflection
    on their patriotism but rather a tough reality. Can't blame them after all, when
    it comes to their own safety and the safety of their loved ones, everyone seemingly
    puts their livelihood over nationalism. Hard confrontations foster hard decisions,
    sadly.
