  counterargument:
    decisive_counterargument: The claim that trust inevitably eros in any conflict
      is an over‑generalization based on a single, subjective observation.  In many
      armed‑conflict settings, hard‑wired solidarity, shared identity, or coordinated
      resistance can actually strengthen communal trust, as seen in examples such
      as refugee communities that remain tightly knit during displacement or civilian
      groups that mobilise to protect each other during wartime.  Therefore, the inference
      that ‘human nature’ guarantees a gradual loss of trust under all combat conditions
      lacks sufficient empirical support.
    candidate: Hasty Generalization
