      fallacy: a claim that a relatively minor decision will trigger an unchecked,
      escalating series of consequences.  The counterargument exposes the missing
      evidence and the logical leap, thereby demonstrating that the fallacy’s primary
      reasoning fault (unfounded causal inevitability) is present.'
