input:
  title: Refugees in Ethiopia's camps raise privacy and exclusion concerns over UNHCR’s
    new digital registration
  parent: ''
  target: They are refugees in an extremely poor country, which means they come from
    even poorer ones and they are worried about an ID? How about focusing on just
    finding food, shelter, and a way out of violent countries before caring about
    having your eyes scanned and whatnot!? The security concerns are worrisome, I
    get that, but its preferable over being homeless and starving!
