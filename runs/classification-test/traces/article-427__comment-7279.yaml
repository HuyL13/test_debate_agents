input:
  title: Why Did Women Journalists Strike in Spain?
  parent: Once you let them dictate rules against fairness, they will continue the
    problem. It only gets worse. Rights will be trampled and compromised.
  target: Whoa there, let's not get crazy! Demanding equal treatment isn't going to
    cause an uprising there the rules and everything else get changed. Women are just
    fed up with not being treated fairly, surely you can understand how that effects
    women everywhere? Let's not lose sight of things that are even bigger issues like
    climate change, world hunger, or economic crises. It's about priorities.
