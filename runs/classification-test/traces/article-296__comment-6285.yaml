input:
  title: In India, regulators are deciding the fate of sensitive data behind closed
    doors
  parent: ''
  target: The fact that there are members of the Srikrishna Committee who didn't help
    with the Aadhaar Act implies the committee is unbiased. These members are proof
    that the committee is focused on safeguarding privacy rights and that all members
    of the committee are on board. If they members who helped draft the Aadhaar Act
    were against ensuring privacy rights are protected, they wouldn't allow neutral
    members on the board, would they? Since they did, we can safely say that every
    member is a die-hard protector of citizens' privacy rights even if they don't
    say it outright. Their actions speak for themselves.
