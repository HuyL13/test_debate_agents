  counterargument:
    decisive_counterargument: The fact that a few committee members did not help draft
      the Aadhaar Act does **not** prove that the entire committee is unbiased or
      that every member is a zealous pro‑privacy advocate.  The mere inclusion of
      some ‘neutral’ individuals cannot override the possibility that the committee
      as a whole could still harbor biases or be influenced by the interests of the
      drafting members.  Therefore the leap from a small subset of members to a sweeping
      claim about the whole committee is an unjustified generalization.
