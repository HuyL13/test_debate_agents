      natural immunity, leading to massive morbidity and mortality. Public health
      measures such as lockdowns, mask mandates, and testing not only reduce transmission
      rates but also buy time for vaccine distribution, ultimately saving lives. Thus,
      relying solely on natural immunity is not a safe or rational strategy.
