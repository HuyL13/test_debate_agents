  counterargument:
    decisive_counterargument: A natural inclination for freedom does not automatically
      make any policy that restricts it unjust or harmful. What is natural or desirable
      does not constitute a normative requirement for how a state should govern; policies
      can be justified on other grounds such as security, public order or cultural
      cohesion. Therefore, the claim that Turkmenistan’s censorship is wrong because
      people naturally desire freedom is unjustified.
    candidate: Appeal to Nature
    challenged_inference: Because people naturally seek freedom, the censorship imposed
      by Turkmenistan’s leaders is wrong.
    label_justification: The objection illustrates that the argument uses the natural
      desire for freedom as a normative basis for judging the policy. This is precisely
      the hallmark of an Appeal to Nature fallacy, where a natural state of affairs
      is claimed to be morally right or wrong without additional justification.
    failure_exposed: true
    evidence_ids:
    - T1
    evidence_spans:
    - It's natural for people here to seek freedom. Turkmenistan isn't offering that.
