input:
  title: The Caribbean speaks out on the climate crisis
  parent: ''
  target: Extremely impressive youth movement going on in the Caribbean, they are
    the future and are poised to protect the planet. Everyone on the planet needs
    to come forward and support what these young people are doing. I think in the
    present day we have lost a key cog between the generations, we have created too
    large of a gap for many to cross. That is a real shame and it must be addressed,
    we need to be able to communicate with our youth like we did in the past. Though
    many are on the right path, there are some that could use the guidance of those
    with more experience. That would be a great thing and can surely lead to more
    understanding for all involved of how to tackle this huge problem that is being
    faced by our earth. As much of a challenge as it will be, together all of us can
    overcome it and make all of our previous generations proud.
