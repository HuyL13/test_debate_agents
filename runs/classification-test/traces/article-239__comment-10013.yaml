  counterargument:
    decisive_counterargument: The fact that a youth movement is described as ‘impressive’
      and that “everyone on the planet needs to come forward and support” it does
      not in itself prove that supporting the movement is the best or only course
      of action. Popularity or an appeal to universal support is insufficient evidence
      of effectiveness, feasibility, or necessity. One must evaluate the movement’s
      actual impact, resources, and goals before concluding that global support is
      required.
    candidate: Appeal to Majority
    challenged_inference: Because the youth movement is impressive and everyone must
      support it, we should support it.
    label_justification: The argument relies on the universality claim “everyone on
      the planet needs to come forward and support” to justify the conclusion, rather
      than on evidence about the movement’s efficacy or feasibility. This is a classic
      Appeal to Majority (argumentum ad populum) fallacy.
