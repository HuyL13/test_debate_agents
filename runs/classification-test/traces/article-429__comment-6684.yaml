input:
  title: Tunisia has a disinformation problem, but (further) criminalizing speech
    won't solve it
  parent: ''
  target: The Tunisian government officials that withdrew the bill made a good decision
    by pulling it from consideration. It is obvious that a group like the ACLU would
    definitely denounce this bill, so you know it's a terrible law. I was already
    skeptical of the bill, but when I realized they would agree with me it became
    obvious and clear. This sort of restriction on speech is scary and should always
    be avoided. The more we restrict speech the more problems we always create. While
    I understand why government officials are concerned with misinformation we must
    be careful in how we address this. Only with a group effort of experts, government
    official and civilians can we solve this ongoing problem. Does anyone disagree
    with this approach? Can we all agree on this and find a middle ground together
    where free speech is protected and disinformation is eliminated?
