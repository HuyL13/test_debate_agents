  counterargument:
    decisive_counterargument: The target asserts that ‘most people agree’ abortion
      is necessary in cases such as rape or life‑threatening pregnancy, yet provides
      no demographic study, poll, or statistical evidence. By treating this unverified
      majority view as fact, the argument relies solely on the popularity of the view,
      assuming that because many (or a presumed majority) think it suitable, it must
      be correct. This is a classic Appeal to Majority, where a claim is justified
      by the presumed opinions of the crowd rather than by empirical support.
    candidate: Appeal to Majority
    challenged_inference: Most people agree that abortion is necessary in cases of
      rape or life‑threatening pregnancy.
    label_justification: The objection demonstrates that the reasoning in the target
      depends on a purported majority opinion without evidence, fitting the definition
      of an Appeal to Majority. It does not merely critique the content of the claim;
      it exposes the logical requirement that the claim be substantiated, which is
      missing.
