  counterargument:
    decisive_counterargument: The claim that Bangladesh must either shut down its
      universities or ban the internet on those campuses is a false dilemma. It presents
      only two extreme options, ignoring realistic middle‑ground solutions such as
      implementing stricter cybersecurity protocols, enhancing campus security, or
      creating digital safety policies that do not require total shutdown or universal
      internet bans. These alternatives could protect student safety while preserving
      academic and digital access.
    candidate: False Dilemma
    challenged_inference: Inference that the situation presents only two mutually
      exclusive solutions, dismissing any other viable options.
    label_justification: The target statement explicitly narrows the range of choices
      to two extremes without acknowledging other possibilities. This is a textbook
      example of the false dilemma fallacy, where the speaker commits an inference
      error by assuming exclusivity where it does not exist.
    failure_exposed: true
