  goal:
    conclusion_or_goal: Decisive action—either banning the internet on campus or shutting
      down universities—must be taken to protect student safety.
    candidate: False Dilemma
    supporting_reason: Safety comes before everything.
    support_relation: The reason is presented as the justification for the conclusion
      that decisive action is required.
    label_justification: The argument limits the possible responses to two extreme
      options (ban or shut down), implicitly arguing that these are the only viable
      solutions. By presenting this constrained choice while ignoring other potential
      measures, the speaker commits a False Dilemma fallacy. The safety claim is the
      stated reason, but the exclusion of alternatives undermines the logical form
      of the argument.
