input:
  title: Bangladesh regulator blocks engineering university webpage containing reports
    of student abuse
  parent: It seems to me that Bangladesh must either shut down its universities or
    ban the internet on those campuses in order to maintain public safety for students.
    I don't see how students can feel safe unless immediate action is taken. Let's
    talk solutions, not merely options.
  target: I agree completely. It's obvious that decisive action must be taken, even
    if viewed as extreme by some. It's either ban the internet for student safety
    or shut down completely. Safety comes before everything. Perhaps it's time for
    stricter regulation and zero-tolerance policies towards bullying. Even if it restricts
    some freedom, it's worth saving the lives of students.
