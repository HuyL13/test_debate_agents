  counterargument:
    decisive_counterargument: The inference that Bangladesh must either shut down
      universities or ban campus internet to safeguard students presupposes a strict
      two‑option universe. In reality, a wide array of alternatives could protect
      student safety—such as enhancing on‑campus security, providing mental‑health
      services, improving campus infrastructure, or fostering open communication with
      students—without resorting to drastic closures or total internet bans. Thus,
      the premise that only these two extreme measures can maintain public safety
      is flawed.
    candidate: False Dilemma
    challenged_inference: Bangladesh must either shut down universities or ban internet
      on campuses to maintain public safety.
    label_justification: The target presents an exclusive “either…or” choice while
      implying that no other solutions exist. This limited choice structure is a classic
      false dilemma, as it falsely restricts options and suggests that the only viable
      solutions are shutting down institutions or banning internet access.
