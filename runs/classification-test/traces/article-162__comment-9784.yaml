    label_justification: The argument moves directly from the premise that internet
      throttling occurs to the sweeping conclusion that this action always causes
      catastrophic harm, without acknowledging variations in implementation or context.
      This demonstrates a hasty generalization, as it applies a broad negative consequence
      to all cases of internet throttling.
