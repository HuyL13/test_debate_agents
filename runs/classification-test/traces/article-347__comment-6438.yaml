  goal:
    conclusion_or_goal: NGO election influence is not a governmental priority; governments
      should focus on larger problems such as healthcare costs and education.
    candidate: Appeal to Worse Problems
    supporting_reason: NGO influence on elections is not among the top 10 or top 100
      governmental problems, whereas healthcare costs and education are presented
      as much more serious issues.
    support_relation: The reason is used to establish that NGO election interference
      should receive lower priority than other pressing problems, thereby diverting
      attention and resources toward those worse problems.
    label_justification: The argument asserts that because other issues are worse,
      the less serious risk of NGO election interference can be ignored; this is a
      classic Appeal to Worse Problems, as it treats the severity of unrelated problems
      as a justification for neglecting the initial concern.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
