input:
  title: A snapshot of climate strikes across Southeast Asia
  parent: Not become one with mother nature is no way to go in the world. Everyone
    should be for nature and keeping the environment great. Lets protect what we have
    in this world as nature intended.
  target: I think the majority of people are getting on board with climate action.  Everyone
    is seeing the changes as they happen.  Even older folks, the most anti-climate
    group are seeing this and starting to think they should support it.  They are
    the ones that remember when it was colder.  For example my state is very conservative
    but even older people know that is not snowing anymore like it was when they were
    kids.  I think that it the key and the younger people are leading the way with
    this.
