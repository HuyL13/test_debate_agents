      when it was colder.  For example my state is very conservative but even older
      people
arbiter:
  selected_candidate: Hasty Generalization
  decisive_condition: The target makes a broad claim that “the majority of people
    are getting on board with climate action” based on observations of a small, specific
    group—older conservatives who remember colder winters—who are now starting to
    support climate action. This extrapolation from the behaviors of that limited
    sample to the entire population satisfies the definition of a hasty generalization.
  decision_reason: The argument generalizes from the noted shift among older, previously
    skeptical individuals to claim that the majority of the population shares that
    stance, thereby violating the structural requirement of a hasty generalization.
