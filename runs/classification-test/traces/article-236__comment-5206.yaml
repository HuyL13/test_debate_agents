  counterargument:
    decisive_counterargument: While many people may think climate action is a good
      idea, popular opinion does not in itself prove that the action is warranted,
      effective, or necessary. A majority’s belief is not evidence of truth; it merely
      reflects a trend or sentiment. To justify pursuing climate action one must provide
      empirical data, risk assessments, and cost‑benefit analyses that demonstrate
      its real-world benefits, rather than relying solely on how many people feel
      it is right.
    candidate: Appeal to Majority
    challenged_inference: That the popularity of climate action guarantees its correctness
      or necessity
