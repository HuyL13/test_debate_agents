input:
  title: Record crowd commemorates Tiananmen Massacre at Hong Kong candlelight vigil
  parent: ''
  target: The memories of people continue to preserve the reality of events, as it
    is in their nature to hold on to the truth. As they say, you can't fool all the
    people all the time. Ever noticed how even the most forgotten parts of history
    find their way back to our consciousness? That's nature for you. The attempt to
    rewrite history is not only going against the natural order but also invites the
    natural repercussions, as nature works in its own mysterious ways to restore balance.
    Accepting what has happened may seem difficult but it is the most natural way
    to heal and move forward. One can't just turn the existing natural laws upside-down
    without expecting some form of reckoning. Let's let the nature take its course.
    After all, the true story of our past is the foundation on which we build our
    future.
