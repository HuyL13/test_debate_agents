  counterargument:
    decisive_counterargument: The argument’s logic—that because no one publicly voices
      opposition to human rights it means the idea is universally supported and therefore
      correct—misuses the popularity of a view as evidence of its truth. Lack of opposition
      does not prove universal approval; many people may simply remain silent or disagree
      privately, and a majority can still be wrong. Consequently, the premise that
      a broad consensus guarantees both moral correctness and success is fallacious.
    candidate: Appeal to Majority
    challenged_inference: It assumes that the absence of public opposition to human
      rights proves universal support, thus validating the stance and predicting success.
    label_justification: The argument depends on the presumed popularity of the view
      to support its claim that defending human rights is correct and will succeed.
      This is precisely the definition of an Appeal to Majority fallacy, which uses
      widespread acceptance (or presumed lack of dissent) as the sole justification
      for the claim.
