input:
  title: In Togo, singer Elias Atayi uses music as a vehicle for human rights
  parent: ''
  target: 'Great story about Elias Atayi and his dedication to making music to amplify
    human rights. I think it''s a great idea and I''m certain that there are vast
    amounts of people who agree to me. I mean, think about it, who is against human
    rights? I have never heard anyone come out against them, so that has to mean it''s
    nearly universal in support! Just having that sort of backing shows that defending
    human rights is the correct thing to do, we all need to step up and spread this
    message far and wide. With how many people are behind this it is sure to be a
    success! #HumanRights'
