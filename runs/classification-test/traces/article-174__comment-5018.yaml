input:
  title: 'Netizen Report: Tunisian Court Refuses to Ban Online LGBTQ Radio Shams Rad'
  parent: Having religious and free speech is natural need of people all over the
    world. We need to stop government censorship. Government censorship is never a
    good thing, it leads to discontent in many other areas as well.
  target: Do you think all people agree with that? There are lots who prefer security
    over things like free speech. Whether they expand or restrict free speech for
    their people should be a matter that the majority of people in those countries
    decide, not what some people think is a natural need.
