  discriminator: Hasty Generalization requires explicit cases/sample -> broader population/class.
    Slippery Slope requires action/condition -> progressively worse consequences.
  resolution:
    winner: Hasty Generalization
    decisive_test: The argument assumes that if a single losing party refuses to step
      down, then automatically every elected official would also refuse and chaos
      would ensue. This leap from one specific scenario to a universal claim about
      all officials lacks supporting evidence, fitting the definition of a hasty generalization.
      The stepwise escalation required for a slippery slope is absent, as the argument
      presents only a single causal link (refusal → chaos) rather than a chain of
      increasingly severe outcomes.
    loser_failure: The claim does not demonstrate a progressive series of consequences,
      nor does it illustrate intermediate steps leading to chaos; it merely states
      that refusal will directly result in disorder. Without this progression, it
      does not meet the structural criteria for a slippery slope fallacy. Hence the
      argument better matches a hasty generalization.
    evidence_ids:
    - T2
    evidence_spans:
    - If the losing party does not need to step down then every elected official could
      choose to do that and there would be chaos.
