  counterargument:
    decisive_counterargument: The argument assumes that because a broad majority disapproves
      of LGBTQ rights, their preference should unilaterally determine the legal standing
      of LGBTQ individuals. However, respecting individual rights does not hinge on
      majority opinion; democracies are also mandated to protect minorities against
      oppression and to uphold universal human rights standards. The mere size of
      the majority does not legitimize discrimination, rendering the appeal to majority
      invalid.
    candidate: Appeal to Majority
    challenged_inference: Because the vast majority in Azerbaijan does not support
      LGBTQ rights, those rights should be denied or ignored, regardless of external
      values.
    label_justification: The inference leverages the majority’s stance as the sole
      justification for normative policy, sidestepping legitimate grounds such as
      universal human rights. This is a textbook instance of an appeal to majority,
      where the popularity of a belief is presented as evidence of its truth or correctness.
