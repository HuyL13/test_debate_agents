input:
  title: In Azerbaijan silence looms as yet another member of LGBTQ+ community is
    fatally targeted
  parent: ''
  target: It's clear from all polling that the vast, overwhelming majority of the
    population of Azerbaijan doesn't support LGBTQ rights. Does democracy not matter?
    The voice of the majority should be respected, even if it's contrary to the values
    some of us in other countries might have. It's up to us to help change that majority
    opinion, not force it on them.
