    conclusion_or_goal: Justify that the majority opinion in Azerbaijan should guide
      policy on LGBTQ rights and that external actors should help change that opinion
      rather than impose it
    candidate: Appeal to Majority
    supporting_reason: Polling shows the vast, overwhelming majority of Azerbaijan’s
