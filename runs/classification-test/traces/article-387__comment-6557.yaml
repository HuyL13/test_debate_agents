  counterargument:
    decisive_counterargument: Naturalness does not automatically grant a legal or
      moral right—many things that are natural are not protected by rights or policy.
      The claim that people ’naturally’ seek information does not alone justify an
      obligation to preserve a freedom of the press; the right is a social construct
      that requires deliberate legal and institutional support, not an inherent consequence
      of natural desire.
    candidate: Appeal to Nature
    challenged_inference: People’s right to information must be preserved because
      it is a natural desire
    label_justification: The argument equates a natural human behavior (seeking information)
      with a legitimate, enforceable right, demonstrating the faulty inference that
      nature implies normative permission. This is precisely the classic Appeal to
      Nature error, where something is deemed good or necessary simply because it
      occurs in nature.
    failure_exposed: true
