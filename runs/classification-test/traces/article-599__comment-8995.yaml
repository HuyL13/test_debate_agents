    decisive_counterargument: The claim that a country has only two options—criminalizing
      investigative journalism or allowing it with no safety guarantees—ignores legitimate
      alternatives such as enacting protective legislation, providing emergency support
      for journalists, and ensuring secure investigative processes. These measures
