  counterargument:
    decisive_counterargument: The argument draws a sweeping conclusion about the experience
      of all Black Americans—‘hundreds of thousands who daily deal with police brutality’—based
      on just two high‑profile cases. That leap from a handful of examples to a general
      population is an overgeneralization that commits a hasty‑generalization fallacy.
      A single reasoning step cannot establish the broader claim without sufficient
      evidence covering the whole group.
