  counterargument:
    decisive_counterargument: The argument takes the fact that a large share of people
      feel abuse is wrong and uses it to claim that everyone should act against it.
      Merely stating that the majority holds a view does not prove that the view is
      morally correct or that it is the only legitimate reason to act, so the conclusion
      that we must stand up derives from an unwarranted appeal to popularity.
    candidate: Appeal to Majority
    challenged_inference: The belief that the vast majority consider abuse wrong is
      sufficient to mandate collective action against such abuse.
    label_justification: The objection identifies that the argument hinges on the
      majority’s opinion to assert moral necessity; this is precisely the logical
      structure of an Appeal to Majority, where the appeal to the size of support
      is mistaken for proof of truth or obligation.
