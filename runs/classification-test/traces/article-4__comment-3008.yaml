input:
  title: Citizens from Chinese city on lockdown roar ‘Beijing has abandoned Wuhan!’
  parent: ''
  target: Wuhan was caught unprepared. Their knee jerk response only made things worse.
    The first thing they should have done was notify the hospitals to start tracking
    the numbers of patients with the disease. Once President Xi Jinping was briefed
    on the speed of the spread of the virus, he was the best source to disseminate
    the information. His expertise as a leader can guide the provinces through quarantines
    and other actions needed to slow down the spread.
