    decisive_counterargument: Saying that false bomb threats are less important simply
      because global warming is more serious ignores that each problem can affect
      people in distinct ways; the seriousness of one does not automatically diminish
      the urgency of the other. The argument conflates the severity of one issue with
      the dismissibility of another.
    candidate: Appeal to Worse Problems
    challenged_inference: False bomb threats are less important because global warming
      is a more severe problem.
    label_justification: The objection shows that the reasoning relies on the premise
      that the existence of a more serious problem justifies downplaying a less serious
      one, which is the classic structure of an Appeal to Worse Problems fallacy—using
      a worse issue as a distraction to minimize a lesser one.
