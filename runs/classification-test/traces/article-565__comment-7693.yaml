input:
  title: New book presents rarely researched aspects of Myanmar's political and media
    transition
  parent: ''
  target: I'm sure this is a great work of research and due diligence, however it
    can't be terribly accurate because it's a compilation of expert contributions.
    Had the book's conclusions been based on the widespread opinions and views of
