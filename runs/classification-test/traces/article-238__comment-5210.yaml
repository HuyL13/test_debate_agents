  counterargument:
    decisive_counterargument: The fact that Azerbaijan is secular and Iran is religious
      does not, in itself, make suspicion or wariness a natural or inevitable outcome.
      Many secular governments successfully cooperate with or trust religious states,
      and many religious states maintain wary relations with secular ones. Claiming
      that 'because it is natural' that Azerbaijan should be wary conflates a so‑called
      natural state of affairs with a justification for political stance, which is
      an invalid reasoning step.
