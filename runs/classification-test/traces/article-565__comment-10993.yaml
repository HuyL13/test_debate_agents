input:
  title: New book presents rarely researched aspects of Myanmar's political and media
    transition
  parent: ''
  target: After years of living under a repressive junta, of course people are reluctant
    to speak out. Because people are reluctant to speak out against inadequacies they
    perceive in government, the government can reasonably take the silence as acceptance
    of their policies and feels free to behave however it wants. Any regime leans
    toward obtaining more power, and without institutional checks and pushback from
    the citizens, the regression to full military dictatorship is inevitable.
