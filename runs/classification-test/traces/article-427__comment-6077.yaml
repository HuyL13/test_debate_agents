input:
  title: Why Did Women Journalists Strike in Spain?
  parent: ''
  target: Why can't the higher ups in journalism circles in Spain help these women?
    How about the former head of the Spanish Press Federation, Arsenio Escolar?  Couldn't
    he help stage an intervention? What year is it again?  It feels like Spain is
    still in the dark ages.  These men have the power, and they should not ignore
    the valid complaints of these women who should be treated as equals.
