  counterargument:
    candidate: Appeal to Authority
    challenged_inference: The argument that focusing on the present—like Banksy does—makes
      an artist’s work more impactful than addressing colonial trauma.
    decisive_counterargument: The effectiveness of art is not determined solely by
      whether it addresses contemporary topics; addressing historical trauma can illuminate
      the roots of present injustices, foster collective healing, and mobilize communities
      in ways contemporary issues alone may not. Banksy is merely one example; many
      artists who explore colonial history engage audiences powerfully and influence
      current social change.
    evidence_ids:
    - T2
    failure_exposed: true
    label_justification: The target relies on citing Banksy, a well-known activist
      artist, to imply that art should address modern issues. This use of an authority
      figure’s practice to justify the claim that contemporary focus is inherently
      better constitutes an Appeal to Authority fallacy.
    evidence_spans:
    - 'today! I''m sure your home country is still not in great shape after all! Like
      Banksy, for instance: He uses art to wake people up to modern issues like war'
