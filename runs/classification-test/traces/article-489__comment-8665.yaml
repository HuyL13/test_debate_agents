input:
  title: A 15-year-old rape victim is the latest collateral damage of Duterte's drug
    war
  parent: In authoritarian countries like this, police just always get away with their
    crimes. Even though it might have gotten worse under Duterte, the underlying problem
    has existed for as long as any of us have. It's going to be very hard for things
    to change given how normal some of these abuses have been. Hopefully they can
    put a lid on it and change things.
  target: Whatever the majority of the populace thinks is going on in the police force
    is probably correct. Mass formation of thoughts is often true. Such a large grouping
    can't be wrong, there must be a form of truth to it.
