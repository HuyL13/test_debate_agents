  counterargument:
    decisive_counterargument: The passage assumes that because a large number of children
      in this country are harmed, the country’s government must be chiefly responsible
      and that other nations’ concerns can be ignored. However, simply observing child
      abuse does not establish that the nation in question uniquely warrants primary
      focus, nor does it justify sidelining other serious problems worldwide. This
      conclusion hinges on an unverified claim that “every country on earth knows
      how wrong it is to hurt kids,” treating that assertion as a universal authority
      without evidence. The logical leap from the statistic to the policy priority
      therefore constitutes an *Appeal to Authority* fallacy, as it uses the supposed
      moral consensus of all nations to justify a specific action without demonstrating
      its validity.
    candidate: Appeal to Authority
    challenged_inference: This is something that should be the country's main concern.
    label_justification: The counterargument points out that the reasoning depends
      on an unsubstantiated universal claim that all nations recognize child abuse
      as wrong. By treating that claim as a guiding authority without supporting evidence,
      the argument commits an Appeal to Authority fallacy. The objection is directly
      tied to the target’s inference, not merely a generic criticism.
    failure_exposed: true
