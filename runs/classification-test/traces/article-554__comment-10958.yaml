    - be resolved. I wonder if these two in Sri Lanka might consider such an approach?
      It seems like a long shot, but maybe they will see the light and give
  counterargument:
    decisive_counterargument: The author assumes that the old, informal method of
      resolving disputes—direct negotiation between the parties—was successful before
      and therefore should resolve the current political crisis.  However, the present
      situation involves constitutional mandates, vested interests, and institutional
      rules that did not apply to the earlier context.  Expecting a historically used
      informal approach to resolve a modern, high‑stakes political conflict ignores
      the very differences in stakes, legality, and power structure.  Courts, by contrast,
      are designed to apply the law impartially and can offer a binding resolution
      that parties cannot simply sidestep.
    candidate: Appeal to Tradition
    challenged_inference: Because people in the past could sit down and resolve disputes,
      Sri Lanka should also use that approach to decide who will be Prime Minister.
    label_justification: The objection shows that the argument relies on the fact
      that an older, informal method was sometimes possible as a warrant for using
      it now, which is a classic Appeal to Tradition fallacy.  The counterargument
      demonstrates that the premises do not logically support the inference, exposing
      the fallacy.
