  goal:
    conclusion_or_goal: Encourage the disputing parties in Sri Lanka to negotiate
      directly rather than rely on courts to resolve the issue.
    candidate: Appeal to Tradition
    supporting_reason: The speaker recalls that previously, when parties disagreed,
      they could sit down together and work out differences.
    support_relation: The recollection of past peaceful negotiation is used as justification
      to try that approach now.
    label_justification: This argument invokes the existence of a past practice (direct
      negotiation) as a reason for adopting it again, which is a classic appeal to
      tradition.
    mechanism_supports_goal: true
    evidence_ids:
