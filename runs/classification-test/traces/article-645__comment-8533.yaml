input:
  title: Filipino activists decry Facebook’s ‘automated censorship’
  parent: So true! It is hard to believe that this censorship that Facebook is doing
    is still happening.  What happens next? Do they censor all political names so
    when anyone talks about any figure they get censored? This is going to lead to
    mass hysteria when no one can get any truthful information. Chaos will reign!
    Everyone being blindsided by what is and isn't true, the government wants to confuse
    people to have total control over them. Let's not let this happen! We have to
    fight this!
  target: Totally agree. If it happened here, it is undoubtedly happening everywhere
    across the world. Maybe Facebook should do away with any form of moderation or
    censorship. We should of course consider the consequences, but in this case the
    pros may outweigh the cons.
