  counterargument:
    decisive_counterargument: Saying that governments’ attempts to curb music are
      wrong simply because music has historically been a vehicle for change relies
      on the idea that tradition is inherently valuable. That inference is unjustified—interventions
      can be legitimate even if they disrupt a historical practice, and tradition
      alone does not establish moral worth.
