    decisive_counterargument: The passage assumes that because there is no evidence
      that politicians randomly act in their genes, they must lack the capacity for
      compromise.  It takes an unproven claim—‘political predators are not naturally
      inclined to compromise’—and treats it as a fact, ignoring any contrary evidence
      and the complex social, institutional, or personal factors that can lead to
      cooperation.  In effect, the author is arguing from a presumed nature rather
      than from actual behavior or data.
    candidate: Appeal to Nature
    challenged_inference: Because politicians are ‘predators,’ it is natural that
      they lack compromise and that this account explains their infighting.
    label_justification: The argument appeals to an innate character (‘not in their
      nature to engage in such behaviors’) as the causal explanation, which is the
      defining trait of the *Appeal to Nature* fallacy.  It conflates a descriptive
      claim about human nature with a prescriptive reason for political behavior,
      without evidence that such a natural disposition truly exists or is causal.
