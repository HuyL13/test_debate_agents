    support_relation: uses the existence of more serious problems to down‑play the
      importance of the experiments
    label_justification: The argument employs an appeal to worse problems by asserting
      that because the region faces severe issues, the ethical concerns about experiments
      become less urgent, which is a fallacious reasoning strategy.
