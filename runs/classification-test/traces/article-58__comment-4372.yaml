    conclusion_or_goal: The speaker argues that because the people in Africa face
      many serious problems (poverty, conflict), there should be less emphasis on
      conducting medical trials and experiments, i.e., that such trials are not a
      huge priority.
    candidate: Appeal to Worse Problems
    supporting_reason: the claim that Africa’s bigger problems justify de‑prioritising
