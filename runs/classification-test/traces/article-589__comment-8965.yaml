    label_justification: The counterargument points out that the target’s reasoning
      depends only on the fact that most other countries have adopted gay marriage,
      without providing any substantive justification tied to the lagging countries’
      own contexts or values. This demonstrates the classic appeal to majority (bandwagon)
      fallacy, as the target claims that the majority’s action itself constitutes
      a reason for others to follow.
