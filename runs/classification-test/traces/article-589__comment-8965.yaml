  counterargument:
    decisive_counterargument: A majority of countries legalizing gay marriage does
      not provide a moral or practical reason for the lagging countries to follow
      suit. Decisions about legal rights should be based on principles such as equality,
      human dignity, and societal readiness, not merely on what most other countries
      do. The argument therefore relies on the bandwagon effect, asserting that because
      most countries now accept gay marriage, the others must also want to emulate
      them. This is an Appeal to Majority.
    candidate: Appeal to Majority
    challenged_inference: They should think about the way they act and want to be
