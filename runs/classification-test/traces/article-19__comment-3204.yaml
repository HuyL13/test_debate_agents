  counterargument:
    decisive_counterargument: Freedom of expression is indeed valuable, but it can
      be reasonably limited when such restrictions protect public safety, prevent
      violent or defamatory speech, or forestall the spread of harmful misinformation.
      A natural desire alone does not override legitimate societal duties, so the
      claim that restrictions are automatically unjustified because they “go against
      a natural want” is unfounded.
    candidate: Appeal to Nature
    challenged_inference: The argument assumes that because restrictions conflict
      with a natural desire for freedom of expression, they cannot be justified.
    label_justification: 'The objection identifies that the target’s reasoning relies
      on the premise that something “natural” is inherently good, framing the restrictions
      as unjust merely because they diverge from a natural preference. This is the
      classic appeal to nature fallacy: claiming moral superiority based solely on
      naturalness without substantive justification. The counterargument directly
      counters this by pointing out that naturalness does not preclude justified limits
      on expression.'
