input:
  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: To me this just seems to want to placate a blind belief that more press
    access equals good. I find it perfectly acceptable that Papua New Guinea doesn't
    want to blindly open the floodgates to journalists given their situation. Western
    countries know very little about Papua New Guinea and anything happening there.
    This results in journalists almost entirely framing the debate of what to think.
    Lots of journalists are simply going to exacerbate anything they find to drum
    up interest
  target: Why are we putting in more restrictions? Does this really provide a benefit
    or is it a way to distract from something else?  Are there any benefits I am unaware
    of? It seems to go against a need for freedom of expression, a natural want/need
    for all people. What problem is this actually solving? What do these restrictions
    improve? What do you think?
