    - which is the insecurity caused by the coup.
  counterargument:
    decisive_counterargument: The speaker claims that because the coup has caused
      a greater insecurity problem, attention should automatically shift away from
      the internet shutdowns and that the shutdowns are therefore unimportant.  That
      reasoning merely redirects the spotlight onto a more serious issue without showing
      that the shutdowns are less critical or impossible to address.  It uses the
      seriousness of one problem to dismiss the relevance of another, which is exactly
      the logic of an appeal to worse problems.
    candidate: Appeal to Worse Problems
    challenged_inference: The focus on internet shutdowns is less needed because the
      coup‑induced insecurity is a more serious issue.
    label_justification: The argument relies on the relative seriousness of the coup‑induced
      insecurity to de‑emphasise the internet shutdowns, a textbook formulation of
      an appeal to worse problems.  It substitutes priority with severity without
      supporting evidence, so the fallacy label of “Appeal to Worse Problems” is appropriate.
