input:
  title: How internet shutdowns in Myanmar have been endangering lives and affecting
    humanitarian work since the coup
  parent: ''
  target: Why is the focus on the internet shutdowns, and not that actual human rights
    abuses from the insecurity caused by the coup. There has been enough evidence
    based on the statistics to show that Myanmar needs more international intervention.
    It is important to get news out from the people in Myanmar, but we need to focus
    on the problem itself which is the insecurity caused by the coup.
