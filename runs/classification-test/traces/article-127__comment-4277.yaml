  goal:
    conclusion_or_goal: Shift the focus from internet shutdowns to the insecurity
      caused by the coup and emphasize the need for international intervention in
      Myanmar.
    candidate: Appeal to Authority
    supporting_reason: The argument cites evidence based on statistics to suggest
      that Myanmar needs more international intervention.
    support_relation: The statistical evidence is used to justify the shift in focus
      toward insecurity and to support the call for international intervention.
    label_justification: While the argument relies on statistics, it does not employ
