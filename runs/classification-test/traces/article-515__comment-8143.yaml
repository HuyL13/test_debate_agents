  counterargument:
    decisive_counterargument: The claim that governors must necessarily be chosen
      by the majority merely because that’s what the population is, rests on the assumption
      that popular preference alone validates an institutional arrangement. However,
      many governments appoint regional leaders to ensure coherence with national
      policy, maintain stability, and prevent local collusion or manipulation. Popular
      choice does not automatically guarantee effective governance, nor is it the
      only viable method. Hence, the preference of the majority is not a decisive
      proof that elections are the sole or best method for selecting governors.
    candidate: Appeal to Majority
    challenged_inference: Governors should be elected by the majority of the people
      living there
