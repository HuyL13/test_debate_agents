  counterargument:
    decisive_counterargument: While the target claims that a series of minor reforms
      can culminate in a significant, sustainable improvement in policing, it offers
      no evidence that each individual reform will actually be effective, nor does
      it show how these reforms will successfully interact or be adopted together.
      Consequently, the conclusion that ‘multiple, smaller changes strung together
      could bring a bigger, sustainable change’ follows from the premises without
      justification.
