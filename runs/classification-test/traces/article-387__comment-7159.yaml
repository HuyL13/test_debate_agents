    - at least in their culture, has withstood the test of time a lot better than
      the alternative that was offered.
  counterargument:
    decisive_counterargument: Longevity alone does not prove that a political system
      is superior or preferable. Many long‑standing institutions have caused harm,
      stifled innovation, or prevented necessary reforms. The fact that Hong Kong
      was briefly governed by the British does not negate the possibility that a liberal
      system could ultimately offer better outcomes; it merely shows that a short
      experiment was insufficient to transform a deeply entrenched authoritarian culture.
      Therefore concluding that authoritarianism is better because it has endured
      for centuries is unwarranted.
    candidate: Appeal to Tradition
    challenged_inference: Because authoritarian rule has persisted for centuries,
      it is inherently preferable to the alternative liberal system presented by British
      rule.
    label_justification: The argument appeals to the notion that a long‑standing system
      is by default superior, without providing evidence that it actually delivers
      better results or justifies its maintenance. This is a classic Appeal to Tradition,
      as it assumes continuity equates to quality.
