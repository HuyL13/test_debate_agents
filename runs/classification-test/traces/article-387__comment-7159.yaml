  goal:
    conclusion_or_goal: Authoritarianism is preferable or superior to a more liberal
      alternative for Hong Kong and China.
    candidate: Appeal to Tradition
    supporting_reason: The argument cites Hong Kong and China’s centuries of authoritarian
      rule and the brief liberal period under British rule, asserting that authoritarianism
      has survived the test of time better than the liberal alternative.
    support_relation: The reason—historical longevity—is employed to justify the preference
      for authoritarianism over liberal governance.
    label_justification: Using the fact that a system has existed for a long time
      to declare it better is a classic Appeal to Tradition. The argument does not
      provide empirical comparative evidence, relying instead on the tradition of
      authoritarian rule for its claim.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
