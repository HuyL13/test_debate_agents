  counterargument:
    decisive_counterargument: The argument assumes that the fact that most people
      consider fake COVID‑related information a serious problem automatically warrants
      harsh government action. Popular opinion does not determine whether a response
      is necessary, appropriate, or proportionate. Inability to justify the measures
      from the majority belief reveals a faulty inference.
