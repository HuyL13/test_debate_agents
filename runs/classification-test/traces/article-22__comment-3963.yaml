input:
  title: Rejection of new Australian coal mine is a rare win for community environmental
    campaigners
  parent: There is too much emotional pleasing in this article simply because most
    people allegedly believe in it. This isn't even true butt the article tries to
    frame it that way in a soft manner. Ot tries to act as though the majority are
    for it but this is merely the case at best with the tiny minority of people involved.
    This is a problem with all special interests. The average person doesn't care
    enough to be this involved.
  target: This is very true. That's because most normal people have much bigger concerns
    than things like this. Hard to be worried about something like the relatively
    minuscule effects of one little coal plant when you are struggling to get by,
    paycheck to paycheck. The government should be focused on the more important things.
