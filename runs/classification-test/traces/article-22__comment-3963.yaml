  counterargument:
    decisive_counterargument: Even if most people are busy with other concerns, that
      does not mean the coal plant’s effects are trivial or that the government should
      neglect them. Minor immediate impacts can aggregate into significant environmental
      and health risks, and policy decisions should be based on objective risk, not
      on what most people happen to care about at the moment.
