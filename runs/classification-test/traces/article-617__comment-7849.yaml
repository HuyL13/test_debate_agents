    candidate: Appeal to Nature
  goal:
    conclusion_or_goal: Justify the use of rule by might as a legitimate and natural
      form of governance
    candidate: Appeal to Nature
    supporting_reason: Rule by might is normal behavior displayed by animals; therefore
      it should be accepted in humans
    support_relation: The claim of naturalness is used to justify power‑holding and
      coercive governance
    label_justification: The argument relies on the occurrence of similar behavior
      in the animal kingdom to support the legitimacy of ruling by might, which is
      a classic example of an appeal to nature fallacy.
    mechanism_supports_goal: true
