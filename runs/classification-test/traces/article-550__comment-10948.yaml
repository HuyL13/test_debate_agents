      human‑rights and extremism concerns by claiming that energy improvements lack
      relevance, thereby exposing the fallacy that a seemingly more “important” issue
      is dismissed simply because it is considered worse or larger. This aligns with
      the definition of Appeal to Worse Problems, where a more pressing issue is used
      to justify deprioritizing another issue and the counterargument shows that such
      a hierarchy is unwarranted. Evidence for this reasoning is found in passages
