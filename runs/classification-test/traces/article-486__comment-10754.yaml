  counterargument:
    decisive_counterargument: 'It is not the case that a denial by the government
      *necessarily* signals that an attack was successful, nor does the claim that
      such denial is ‘natural’ provide any proof of success.  Governments deny or
      admit breaches for a range of strategic, political, or security reasons; a denial
      can equally be an attempt to protect public confidence or comply with legal
      constraints.  The argument therefore relies on the premise—‘it is natural that
      the government would deny’—as evidence that the attacks succeeded, which is
      an Appeal to Nature: the naturalness of a behavior is taken as a justification
      for distrust and as a surrogate for factual confirmation.  This premise is unsupported
      and discounts legitimate reasons for a denial, so the inference that the attacks
      were successful is invalid.'
    candidate: Appeal to Nature
    challenged_inference: If the attacks had been successful, it would have been perfectly
      natural for the government to refute it, in order to cover up their own incompetence
      in the matter.
    label_justification: 'The objection shows that the argument uses the naturalness
      of governmental denial as a reason to distrust the government’s statements and
      to infer success.  This is a classic Appeal to Nature fallacy: naturalness is
      invoked to justify the inference, but naturalness is not a reliable indicator
      of factual truth.  The fallacy is therefore supported.'
    failure_exposed: true
