input:
  title: Filipino activists decry Facebook’s ‘automated censorship’
  parent: ''
  target: It's not a good look when a company like Facebook sets up auto-flagging
    protocols like this. However, a bigger problem is those countries in which Facebook
    is not even allowed. What's worse, the problem described in this story (auto-flagging)
    or a complete social media blackout? Let's keep our priorities in view at all
    times. It seems there's always a bigger fish to fry.
