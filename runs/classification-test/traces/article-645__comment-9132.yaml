  counterargument:
    decisive_counterargument: The claim that a social‑media blackout is necessarily
      a worse problem than Facebook’s auto‑flagging merely sets a priority ladder
      without evidence that the lower rung is insignificant. Even if a blackout could
      have more severe economic or societal consequences, that does not logically
      imply that the auto‑flagging issue can be ignored or lessens in importance.
      The argument simply asserts a hierarchy of problems (“there’s always a bigger
      fish to fry”) without explaining why the auto‑flagging should be treated as
      less consequential. Hence the inference that the auto‑flagging can be deprioritized
      is unjustified.
    candidate: Appeal to Worse Problems
    challenged_inference: auto‑flagging is less important than a blackout
    label_justification: The objection directly targets the fallacious reasoning that
      the comparative severity of one problem (blackout) is enough to dismiss the
      other (auto‑flagging). This demonstrates the “appeal to worse problems” because
      the discussion relies on the idea that a more serious issue automatically takes
      precedence over a less serious one, without supporting the claim that the lesser
      issue is negligible.
    failure_exposed: true
    evidence_ids:
