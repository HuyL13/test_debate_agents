  counterargument:
    decisive_counterargument: The fact that more serious harms exist does not justify
      ignoring false allegations. False claims can inflict real damage on the accused
      and undermine public confidence in the justice system; therefore a system that
      protects victims must also safeguard against wrongful accusations. Dismissing
      false allegations as a lesser issue because a worse problem exists exemplifies
      the ‘appeal to worse problems’ fallacy.
