  counterargument:
    decisive_counterargument: The reasoning conflates the fact that people often blame
      songs with a universal claim that songs cannot be at fault. The observation
      that a norm exists for blaming music does not by itself show that self‑blame
      is valid or that the songs are harmless. A single or limited observation about
      blame patterns is not sufficient to negate responsibility or the potential provocativeness
      of lyrical content. The argument therefore leaps from a specific behavioral
      pattern to a sweeping conclusion about causal responsibility, ignoring counter‑evidence
      that certain lyrics can directly influence listeners’ actions. This constitutes
      a leap from limited evidence to a general claim.
    candidate: Hasty Generalization
    challenged_inference: It concludes that songs are not at fault because the blame
      norm exists and lyrics depend on listener weakness; an inference that generalizes
      from a few blame instances to a universal attribution of responsibility.
    label_justification: 'The objection demonstrates that the argument draws a general
      conclusion about the culpability of songs based solely on an observation about
      how people tend to blame music, without considering broader evidence of lyrical
      influence. This is a classic hasty generalization: a conclusion about all cases
      is derived from an insufficient sample.'
