input:
  title: Carlos Ghosn's great escape embarrasses Japanese government
  parent: So if you are arrested in Japan you are held under "hostage justice" until
    you confess.  That seems to me like torturing prisoners until they confess.  I
    guess in Japan, you are guilty until proven innocent the reverse of the US justice
    system.  I don't see how a coerced confession can even be tried fairly.
  target: If the system was not innocent until proven guilty, do you think they would
    have given him bail and let him out on house arrest? To me that seems like they
    were going to let him at least have a say in court. Even Japanese legal scholar
    Ichiro Suzuki has come out and said that the Japanese judicial system is lax,
    especially for the wealthy. So that should be an indication that defendant had
    rights and was granted them.
