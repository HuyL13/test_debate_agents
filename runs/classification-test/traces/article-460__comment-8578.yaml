input:
  title: Malaysia orders ‘stern action’ against media misreporting government statements
    on COVID-19
  parent: ''
  target: When you allow the government to take control of freedom of speech it will
    lead to much worse problems. Who is to decide what is fake news about Covid or
    any other issue? Regardless, it is up to the people to determine if it is true
    or not. If the authorities are allowed to punish people for freely speaking online
    where does it go? How much worse will it get?
