  counterargument:
    decisive_counterargument: The claim that arresting powerful people is *much* more
      important than arresting those who hire them relies on a single reported incident
      to justify a blanket strategy. In reality, dismantling a criminal organization
      requires coordinated action against *all* levels—high‑level leaders who coordinate,
      and mid‑level operatives who execute plans and hold critical information. The
      target’s reasoning leaps from an isolated observation to a sweeping policy prescription
      without evidence that such a hierarchical focus will in fact bring down the
      organization, thus committing a hasty generalization.
