input:
  title: Password hack claim puts cyber security on the public agenda in North Macedonia
  parent: ''
  target: When I see a major hacking story like this, I immediately become doubtful
    of all the details that come from parties that are directly involved in the incident.
    Should we just buy automatically what these biased individuals release to the
    public? I think not. What we need here is an independent security firm to come
    in and see what damage was actually done. Too expensive? Not needed? I highly
    disagree with this and so does Tom Stayward of Tom's Cybersecurity Plus. He is
    an expert of internet security and he says they must hire a team of experts to
    check into this matter. Furthermore he is no slouch in the field, he has investigated
    numerous such incidents and has found the root truths in all of them. He says
    'It's often not what the officials first believe, many times there are breeches
    they don't even know have happened." I know some people will just want to move
    on, but I feel we must find the truth. Is anything more important than the truth?
