    decisive_counterargument: The conclusion that we should hire an independent security
      firm relies solely on Tom Stayward’s assertion of his expertise, yet no empirical
      evidence is offered to show that his recommendation is reliable or that independent
      verification is in fact needed. Relying on one expert’s opinion to justify a
      procedural change is precisely the classic appeal to authority fallacy.
    candidate: Appeal to Authority
    challenged_inference: Because Tom Stayward is an expert, his recommendation to
      employ an independent security firm is a sufficient reason to do so.
    label_justification: The argument uses Tom Stayward’s purported authority as the
      sole justification for hiring additional experts, without presenting independent
      evidence or reasoning. This matches the appeal to authority fallacy, where an
      expert’s opinion is treated as proof without substantive support.
