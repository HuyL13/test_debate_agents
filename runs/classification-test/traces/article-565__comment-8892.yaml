input:
  title: New book presents rarely researched aspects of Myanmar's political and media
    transition
  parent: ''
  target: While this is an important topic and it deserves some play there are much
    bigger things going on. We need to make sure that democracy is at the front of
    the citizens minds. That way freedom of speech and press will prevail. We can't
    let little things take over our minds, we need the big topics to stay out front.
