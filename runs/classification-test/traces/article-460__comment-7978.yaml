input:
  title: Malaysia orders ‘stern action’ against media misreporting government statements
    on COVID-19
  parent: ''
  target: Those in power have always been punitive towards those who criticize them.
    And in that part of the world, such an approach is the settled, long-standing
    way of doing things. We can't expect them to turn on a dime, can we? Let's be
    patient while we encourage them to embrace a different tradition, one which protects
    the freedom of the press as much as the power held by the central authority. Changing
    inherited practices takes time and effort, after all.
