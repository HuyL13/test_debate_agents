    candidate: Appeal to Tradition
  goal:
    conclusion_or_goal: Encourage patience while urging a gradual shift toward a tradition
      that protects press freedom.
    candidate: Appeal to Tradition
    supporting_reason: The argument asserts that the punitive approach toward critics
      has long been established in that part of the world, thereby using historical
      precedent to explain why change will be slow.
    support_relation: The traditional punitive stance is invoked to justify the expectation
      that the authorities will not readily alter their behavior, which underlies
      the appeal for patience and a gradual cultural shift.
    label_justification: The reasoning depends on the long‑standing nature of the
      punitive practice as a basis for predicting unwillingness to change, a classic
      Appeal to Tradition.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T3
    evidence_spans:
    - Those in power have always been punitive towards those who criticize them. And
