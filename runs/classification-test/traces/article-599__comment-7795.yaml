  counterargument:
    decisive_counterargument: The claim that simply charging a person will inevitably
      lead to life imprisonment or execution is an unfounded extrapolation. In most
      legal systems, a charge triggers a due‑process procedure that includes trials,
      defense representation, possible appeals, and the right to remain innocent until
      proven guilty. There is no evidence that a charge automatically becomes a conviction,
      conviction into a life sentence, or execution without a fair trial. Therefore
      the argument relies on an unsupported escalation rather than a concrete causal
      link.
