input:
  title: 'Unfreedom Monitor Report: El Salvador'
  parent: ''
  target: The country had been so peaceful throughout the years, wonder what changed?
    Could be the uptick of crime and violence that have to be stopped. I had an old
    co-worker that came from El Salvador and he would tell me how great it was to
    live there before he moved. In 1985, he came to America for a better life. It
    was much more calm then. His cousin, although he isn't an expert officially, has
    been in law enforcement there for years. He claims that the crime rates are unbelievably
    high. I think his views on the situation really lend weight on my belief of what
    is happening.
