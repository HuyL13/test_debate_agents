  counterargument:
    decisive_counterargument: While it’s true that poverty and corruption are pressing
      challenges, demeaning the concerns of trans people is unjustified; people can
      advocate for both social justice for marginalized groups and national development
      simultaneously. Dismissing a minority’s rights because they constitute a tiny
      fraction of the population ignores the fact that their rights are part of the
      broader struggle for a just, inclusive society.
