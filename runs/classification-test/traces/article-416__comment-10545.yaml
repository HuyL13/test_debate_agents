    conclusion_or_goal: The target argues that protesters in Hong Kong should focus
      their efforts on achieving better local government rather than pursuing full
      autonomy from China.
    candidate: False Dilemma
    supporting_reason: The weakness and ineffectiveness of Hong Kong’s leadership
      makes full autonomy unrealistic, so a more pressing and achievable goal is to
      protest for good local government.
    support_relation: The reason is used to justify the recommendation to prioritize
