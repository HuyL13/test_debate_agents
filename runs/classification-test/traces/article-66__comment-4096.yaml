  counterargument:
    decisive_counterargument: The fact that most gun owners have clean records and
      that most people support the Second Amendment does not logically prove that
      guns do not contribute to violence. A sizeable proportion of gun‑related deaths
      involve guns that are in the hands of non‑owners, criminals, or used in accidental
      or self‑harm incidents. Therefore the conclusion that 'guns don’t kill people'
      and the policy support for the Second Amendment are based on an unsupported
      leap from a majority stance to the truth of the claim.
    candidate: Appeal to Majority
    challenged_inference: The target concludes that because the majority of gun owners
      are law‑abiding and that the Second Amendment is widely supported, guns are
      safe and do not cause violence.
    label_justification: 'The argument explicitly uses the fact that a majority hold
      a position (law‑abiding gun owners, widespread support for the Second Amendment)
      to justify the policy claim that guns are safe, which fits the definition of
      an appeal to majority: leveraging popularity or number as certifying evidence.'
