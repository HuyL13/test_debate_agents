  goal:
    conclusion_or_goal: The speaker asserts that gun owners are largely responsible
      citizens and that this fact justifies the widespread support for the Second
      Amendment.
    candidate: Appeal to Majority
    supporting_reason: The majority of gun owners are law‑abiding citizens, and statistics
      about violent crime bear this out because most gun owners have clean records.
    support_relation: The majority status of gun owners is used as empirical support
      for the claim that gun ownership is safe and the Second Amendment is justified.
    label_justification: The argument relies on the fact that the majority of a population
      holds a certain property (law‑abiding behavior) to support a conclusion about
      a political right, which is the classic Appeal to Majority fallacy.
    mechanism_supports_goal: true
    evidence_ids:
