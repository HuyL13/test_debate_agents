  goal:
    conclusion_or_goal: The speaker urges that we stand up for all rights and stop
      further targeting of rights of marginalized groups.
    candidate: Slippery Slope
    supporting_reason: If they continue to take the rights of transgender people,
      what’s to stop them from taking the rights of others—women, religious minorities,
      racial minorities—where will it stop?
    support_relation: The speculative chain of rights erosion is used to justify the
      call to action to protect rights for all groups.
    label_justification: The argument assumes an unsubstantiated progression from
      the rights of one group being taken to the rights of many others being taken,
      which is a classic slippery-slope fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
