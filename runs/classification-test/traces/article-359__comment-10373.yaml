  counterargument:
    decisive_counterargument: Majority opinion does not make a policy optimal or correct.
      People can be misinformed, swayed by fear, or lack better information, and historical
      instances show that popular choices can be harmful. Without evidence of effectiveness,
      claiming that a lockdown is the best solution merely because most accept it
      is unfounded.
    candidate: Appeal to Majority
    challenged_inference: The claim that the lockdown is the best solution simply
      because the majority of people accept it.
    label_justification: The objection points out that popularity does not constitute
      proof of effectiveness. This directly addresses the reasoning pattern of the
      appeal to majority fallacy, where the argument relies on the size of the audience
      as justification rather than factual support.
