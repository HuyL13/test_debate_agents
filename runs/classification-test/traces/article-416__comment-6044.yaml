  counterargument:
    decisive_counterargument: The text asserts that children must heed the police
      and cease rioting because police authority guarantees truth, yet it offers no
      evidence that the police are correct or that their guidance is wise. The mere
      fact that the police are in control does not establish that their perspective
      is the best or that rioting is futile. The claim is thus an unsubstantiated
      appeal to authority—the argument concludes that the children should stop rioting
      solely because authoritative actors (the police) say so, with no independent
      justification or empirical support. This logical misstep is a classic Appeal
      to Authority.
    candidate: Appeal to Authority
    challenged_inference: These kids should stop rioting because the police are in
      authority and they know what is best.
    label_justification: The inference rests exclusively on the police’s status as
      authority figures without providing any corroborating evidence that their directive
      is valid or in the children’s best interest. Hence the fallacy is an Appeal
      to Authority, not merely a critique of the content.
