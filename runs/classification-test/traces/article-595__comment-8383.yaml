    decisive_test: The claim that the deaths of flamingos in Central Anatolia reveal
      an unseen cause that will soon cause many tragedies worldwide assumes a global
      effect based on a single, specific incident. This is an over‑generalization
      from a single exemplar to all future flamingo populations, matching the definition
      of a Hasty Generalization. A Slippery Slope would require a chain of progressively
