  counterargument:
    decisive_counterargument: The target asserts that Armenia’s silence on Russia’s
      invasion has only a marginal effect on Russian politics and that the only factor
      that could meaningfully alter the balance is a unified United Nations push.
      This inference is unsupported because the passage provides no evidence whatsoever
      that a UN‑wide consensus would in practice shift Russian political decisions,
      nor does it consider other possible influences—such as economic sanctions, internal
      pressure, or bilateral relations. Without evidence linking UN action to Russian
      political outcomes, the claim that “a unified push from the UN would change
      the balance” fails to establish a causal relationship and therefore lacks a
      sound logical basis.
