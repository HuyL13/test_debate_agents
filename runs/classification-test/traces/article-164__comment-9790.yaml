input:
  title: As Ebola outbreak ends, coronavirus begins in DR Congo
  parent: ''
  target: "Considering how severe both Ebola and Covid diseases can be, I’m actually\
    \ not sure DR Congo is doing enough to fully address these major public health\
    \ crises.  People who might have these diseases may need to be very carefully\
    \ monitored and significant steps need to be taken that they don’t give these\
    \ diseases to uninfected people.  \n\nTrue, the government is responding to these\
    \ diseases with some public health requirements. This is not enough, however.\
    \ Citizens themselves need to be proactive about their health, ensuring they stay\
    \ well hydrated, sleep adequately each night, and consume enough nutritious foods\
    \ with vitamins and minerals. Avoiding junk foods and focusing on high quality\
    \ ingredients like fresh fruits and vegetables and whole grains will help the\
    \ population boost its potential immunity levels and be in a state of less overall\
    \ inflammation. This will let people take personal ownership of their health and\
    \ have a better chance of recovering quickly should they be unlucky enough to\
    \ get one of these viruses."
