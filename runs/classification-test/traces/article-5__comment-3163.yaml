  counterargument:
    decisive_counterargument: 'The author assumes that because people have historically
      tricked the law—an anecdote his granddad told him—this excuses or even celebrates
      the act, and further claims that the resulting ‘holes’ will inevitably be plugged,
      thereby improving the system.  However, a past instance of outwitting an authority
      does not prove that the same behaviour is morally acceptable or that the system
      will correct itself in the future.  The narrative relies on a historical precedent
      as if it proves the desirability of the act, which is a classic appeal to tradition:
      the fact that something has happened before is treated as evidence that it should
      be accepted now, even though no causal or moral connection is established.'
    candidate: Appeal to Tradition
    challenged_inference: That the existence of historical instances of people outsmarting
      the system justifies or endorses current evasive tactics, and that any resulting
      adjustments will inevitably make the system better.
    label_justification: The objection points out that the argument draws on the past
      example as if it validates the present conduct.  This matches the definition
      of Appeal to Tradition—using longevity or past precedent to justify the current
      position—rather than merely critiquing the argument.  It identifies that the
      reasoning flaw resides specifically in treating tradition as evidence, satisfying
      the fallacy label.
