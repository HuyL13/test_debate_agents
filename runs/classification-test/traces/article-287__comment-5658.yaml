  counterargument:
    decisive_counterargument: The reasoning jumps from the experiences of a few refugees
      that you know to the claim that a majority of all people in El Salvador are
      willing to forfeit civil rights for safety. Those refugees represent a highly
      self‑selected subset of the population—those who left the country and chose
      to share their story with you—and they may have reasons for overstating the
      violence. The argument therefore draws a conclusion about a vast population
      based on an unrepresentative, small sample, which is the hallmark of a Hasty
      Generalization.
    candidate: Hasty Generalization
    challenged_inference: A majority of the people in El Salvador do not mind giving
      up some civil rights in order to have a safer country.
    label_justification: The objection shows that the conclusion about the majority
      cannot be justified from the limited information presented; the argument generalizes
      from a few cases to all people, which is precisely the reasoning failure of
      a Hasty Generalization.
