  title: 'Unfreedom Monitor Report: El Salvador'
  parent: ''
  target: El Salvador has a recent history of being a very violent and crime infested
    place.  I know several refugees from there that live in my hometown and they talk
    about how dangerous it was.  So I think that a majority of the people there do
    not mind giving up some civil rights in order to have a a safer country.  It is
    just a natural thing to do.  At some point a balance does need to be reached,
    but what good are civil rights in a country that is so dangerous.
