  counterargument:
    decisive_counterargument: The claim that removing a long‑existing tradition will
      inevitably provoke a radical backlash relies on the idea that the past ‘worked’
      simply because it had been in place.  History shows that reforms based on re‑examining,
      modifying, or even discarding traditions can be successful and can avoid extreme
      reactions—e.g., the gradual liberalisation of many democracies or the introduction
      of new immigration policies in countries that previously had different rules.  Therefore,
      the mere longevity of a practice does not prove that its removal will cause
      harmful consequences, and the argument rests on an unqualified appeal to tradition.
    candidate: Appeal to Tradition
    challenged_inference: Declaring that the removal of the tradition will necessarily
      lead to radical response because the tradition had historically worked
    label_justification: The inference treats the mere endurance of a tradition as
      the sole justification for its continued existence, implying that change will
      harm; this is the classic Appeal to Tradition fallacy.
