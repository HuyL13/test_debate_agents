input:
  title: Internet blocked as protests intensify in northeast India against the Citizenship
    Amendment Act
  parent: Why change the law now when its been unchanged since 1955? Talk about doing
    away with tradition. No wonder people are upset. This will change large parts
    of India! India is not used to bringing in so many different kinds of refugees!
  target: I agree completely. They had a system that, while flawed, more or less worked
    since before most of us were even alive. Did they not expect that radical change
    would lead to a radical response? This is what happens when like you say, they
    do away with tradition.
