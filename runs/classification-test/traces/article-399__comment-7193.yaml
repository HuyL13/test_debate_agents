  counterargument:
    decisive_counterargument: While the pandemic definitely highlighted the critical
      role of internet connectivity for certain activities (remote work, distance
      learning, telemedicine), this single global event is insufficient evidence to
      conclude that universal internet access is an indispensable basic amenity for
      all societies. The pandemic created extraordinary, unprecedented conditions
      that forced many to rely heavily on digital infrastructure. In typical circumstances—such
      as in contexts where local economic activities are predominantly offline or
      where digital tools offer limited added value—comprehensive internet coverage
      may yield negligible benefits, while the costs of deploying, maintaining, and
      subsidising such infrastructure could outweigh the gains. Thus, basing the policy
      of universal internet access on one anomalous situation risks an over‑generalization
      to all peoples and contexts.
    candidate: Hasty Generalization
    challenged_inference: Internet should be accessible to all
    label_justification: The argument takes the singular experience of a global pandemic—an
      atypical, extreme scenario—and extrapolates it to a universal claim that internet
      access is essential for everyone. This leap from a specific case to a broad
      normative statement fits the definition of a hasty generalization, where limited
      evidence is used to form a sweeping conclusion.
