input:
  title: '2021: A fruitful year for Indigenous communities in Taiwan'
  parent: ''
  target: It's great that they're finally getting the recognition and respect that
    they deserve. It's to the benefit of the non-indigenous as well, and they in Taiwan
    should take note of that. As award winning author Jay Griffiths said, if people
    can't acknowledge the wisdom of indigenous cultures, that's their loss.
initial_analysis:
  structure:
    structure_type: authority_to_claim
    slots:
    - role: authority
      text: award winning author Jay Griffiths
    - role: endorsed_claim
      text: if people can't acknowledge the wisdom of indigenous cultures, that's
        their loss.
    structure_complete: true
    evidence_ids:
    - T2
    evidence_spans:
    - that. As award winning author Jay Griffiths said, if people can't acknowledge
