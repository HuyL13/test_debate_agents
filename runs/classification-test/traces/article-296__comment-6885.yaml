    label_justification: 'The target says that because people naturally question status
      quo, privacy must be paramount and definitions must improve. This turns a natural
      tendency into a normative claim without evidence. That is precisely the fallacy
      of Appeal to Nature: equating naturalness with desirability or necessity. No
      other fallacy from the given list matches the reasoning structure.'
