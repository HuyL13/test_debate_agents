  counterargument:
    decisive_counterargument: Naturalness is a descriptive fact, not a normative one.
      Merely stating that it is natural to question the status quo does not justify
      the need for better definitions of data sensitivity nor that privacy should
      be regarded as the paramount concern. The argument relies on the assumption
      that because something is natural, it is preferable or necessary, which is a
      classic appeal to nature.
    candidate: null
    challenged_inference: Using the premise that questioning the status quo is natural
      to conclude that better definitions of data sensitivity are required and that
