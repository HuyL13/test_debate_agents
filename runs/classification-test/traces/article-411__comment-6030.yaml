  counterargument:
    decisive_counterargument: The argument that prohibiting easy internet access would
      violate the government's authority assumes that the authority itself guarantees
      the power or obligation to provide internet to everyone. Authority is a permission
      to act, not a mandate that the state must provide a particular service; the
      government could legitimately choose not to supply internet without that act
      being a violation of its authority. Thus the inference that building such a
      policy would contravene authority is unsupported.
    candidate: Appeal to Authority
    challenged_inference: Prohibiting easy internet access would violate the government's
      authority
    label_justification: 'The objection shows that the claim relies on the government''s
      inherent authority as a reason to provide internet, rather than on factual evidence
      about the government''s powers or obligations. This is an appeal to authority:
      the argument substitutes the fact that the government is an authority for the
      unsubstantiated claim that it must provide internet, which is an incorrect use
      of authority to justify the policy.'
    failure_exposed: true
    evidence_ids:
    - T1
