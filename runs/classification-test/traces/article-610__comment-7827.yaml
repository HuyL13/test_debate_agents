  counterargument:
    decisive_counterargument: To assume that a practice is good or should be permitted
      just because it has persisted for a long time is a faulty line of reasoning.
      The mere fact that people have thrown away trash in a certain way over many
      years does not establish that the practice is harmless, efficient, or optimal.
      Empirical evidence, rather than historical continuity, should guide policy decisions.
