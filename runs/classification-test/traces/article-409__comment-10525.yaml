  counterargument:
    decisive_counterargument: The argument assumes that addressing the root causes
      alone is sufficient and that any immediate measure like pepper spray is unnecessary
      or even a distraction. In reality, legalizing and providing pepper spray can
      supply an immediate safety tool that saves lives while longer‑term social programs
      are being designed, implemented, and refined. Therefore, the conclusion that
      pepper spray should be postponed because there are bigger problems is unjustified.
      The inference that only root‑cause solutions should be prioritized neglects
      the complementary value of an acute protective measure.
