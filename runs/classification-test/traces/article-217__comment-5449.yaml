input:
  title: Trinidad & Tobago NGO identifies treatment of women as key issue in upcoming
    elections
  parent: ''
  target: It is one of the oldest traditions in the world to elect people to office
    who the public can trust. If you are someone who has sexual assault allegations,
    you are not trustworthy and electing you would break that tradition. If they think
    its okay to run with these allegations, which other traditions would they break/
