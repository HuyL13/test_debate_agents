    - are not trustworthy and electing you would break that tradition. If they think
      its okay to run with these allegations, which other traditions would they break/
    candidate: Appeal to Tradition
  goal:
    conclusion_or_goal: People who have sexual assault allegations should not be elected
      to office because they lack trustworthiness.
    candidate: Appeal to Tradition
    supporting_reason: The assertion that one of the oldest traditions is to elect
      trustworthy individuals is used to justify the claim that those with sexual
      assault allegations are untrustworthy and therefore inappropriate candidates.
    support_relation: mechanism_supports_goal
    label_justification: The tradition of electing trustworthy people is invoked as
      the sole basis for rejecting candidates with sexual assault allegations, constituting
      an appeal to tradition.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - It is one of the oldest traditions in the world to elect people to office who
      the public can trust. If you are someone who has sexual assault allegations,
      you
    - are not trustworthy and electing you would break that tradition. If they think
      its okay to run with these allegations, which other traditions would they break/
  counterargument:
    decisive_counterargument: 'The argument relies on the premise that it is a traditional
      practice to elect trustworthy officials, and therefore any candidate with sexual
      assault allegations must be excluded. This is an example of the appeal to tradition
      fallacy: the fact that an action has been done for a long time does not make
      it correct or the only valid approach. Traditions can and should be reassessed,
      especially when allegations cast doubt on a candidate''s trustworthiness.'
    candidate: Appeal to Tradition
    challenged_inference: Because someone has sexual assault allegations, they are
      untrustworthy, so electing them would break the tradition of electing trustworthy
      officials, therefore they should not be elected.
    label_justification: The objection points out that the reasoning uses a long‑standing
      practice (election of trustworthy officials) as a justification for excluding
      a candidate, which is precisely the structure of the appeal to tradition. The
      counterargument demonstrates that tradition alone does not suffice to determine
      validity of the conclusion.
    failure_exposed: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - It is one of the oldest traditions in the world to elect people to office who
      the public can trust. If you are someone who has sexual assault allegations,
      you
    - are not trustworthy and electing you would break that tradition. If they think
      its okay to run with these allegations, which other traditions would they break/
