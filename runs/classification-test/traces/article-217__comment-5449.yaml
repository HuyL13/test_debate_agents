    slots:
    - role: tradition_premise
      text: It is one of the oldest traditions in the world to elect people to office
        who the public can trust.
    - role: preservation_conclusion
      text: Electing someone with sexual assault allegations would break that tradition,
        and if they think it is okay to run with these allegations then they would
        be breaking other traditions.
    structure_complete: true
