  counterargument:
    decisive_counterargument: The conclusion that the survey results are untrustworthy
      simply because a local political expert didn’t co‑author the study is unwarranted.
      The credibility of a survey rests on methodological rigour—sampling, questionnaire
      design, data analysis—rather than the presence of a named authority. Many credible
      studies are produced by independent researchers without a specific regional
      expert, yet are accepted on the basis of transparent procedures. Therefore,
      rejecting the findings because they lack an expert from the area is a form of
      appeal to authority, not evidence.
    candidate: Appeal to Authority
    challenged_inference: The findings are invalid or skeptically treated unless they
      are certified or endorsed by a local political expert.
    label_justification: This counterargument directly attacks the fallacious reliance
      on a single authority’s endorsement for the validity of the data, exposing that
      the argument uses an appeal to authority where the absence of that authority
      is taken as a disqualifying factor.
