input:
  title: Capturing the mood on both sides of the Ukraine-Russia conflict in Donbas
  parent: ''
  target: I get that the author/s of this article conducted their surveys, but something
    important is missing here. There is no certification of these findings (and more
    importantly, their meaning) by an expert on the local politics of the region.
    Without that it's difficult to onboard these "results" with anything more than
    skepticism. If they had recruited someone like Professor Z, who is actually from
    the region himself, into the project, then I would more readily accept these findings.
