  counterargument:
    decisive_counterargument: 'The claim that abortion is wrong simply because it
      is not natural commits an appeal‑to‑nature fallacy: it equates what is ''natural''
      with what is morally acceptable, without justifying how or why that equivalence
      holds. The text asserts abortion is a uniquely human invention and therefore
      unnatural, then concludes that because it''s unnatural it must be morally wrong.'
