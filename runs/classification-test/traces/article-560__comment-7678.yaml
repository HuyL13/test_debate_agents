      groups. And why not? Because it's not natural. Surely this means that it can't
      really be right. You can't go so directly against nature and think what you're
      doing is right.
    label_justification: The critique targets the inference that being 'unnatural'
      implies moral wrongness, which is exactly the logical pattern of Appeal to Nature.
      The objection shows that the original argument relies on an unsupported presumption
      that nature equates to moral good, thereby exposing the argument’s specific
      reasoning defect.
