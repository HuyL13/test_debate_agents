input:
  title: In Hong Kong, local entrepreneurs champion the pro-democracy cause
  parent: ''
  target: People in Hong Kong should understand that this is not the path to peace.
    How do they think China will react to things like this, by just letting it go?
    No, they will only clamp down more and more. More impositions, more repressive
    laws, probably culminating in violent, military action. Hong Kong will only hasten
    it becoming the next Xinjiang with these kinds of actions.
