  counterargument:
    decisive_counterargument: The fact that a government can ban the sites that stream
      football matches does not logically entail that it will next ban every mention
      of football. Governments often limit only the distribution of content, not the
      discussion of it, and there is no evidence that this censorship will expand
      to the broad, abstract level claimed. Thus the inference that the next step
      will be a wholesale ban on any mention of football is not justified.
    candidate: Slippery Slope
    challenged_inference: The inference that the next thing the government will do
      is ban any mention of football if it does not align with the government.
    label_justification: 'The argument posits a chain of escalating censorship—from
      banning broadcast sites to banning all mention—without providing any intermediate
      evidence of such a progression. This is a classic slippery-slope reasoning:
      an initial action is taken as a single, inevitable precursor to a more extreme,
      but unsubstantiated, consequence. Hence, the fallacy identified is a slippery
      slope.'
    failure_exposed: true
