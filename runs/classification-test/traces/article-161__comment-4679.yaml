  counterargument:
    decisive_counterargument: 'The claim that the Citizenship Amendment Act would
      not benefit Assam relies simply on the fact that the Assam Accord has worked
      for 30 years, implying that continuing the status quo is good. This is an appeal
      to tradition: it treats historical endurance as proof of efficacy without examining
      current conditions or alternative policies. Since the Accord’s record does not
      automatically guarantee the continued success of a similar or different policy,
      the argument is logically weak.'
