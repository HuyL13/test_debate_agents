  counterargument:
    decisive_counterargument: 'The argument assumes that because a phenomenon happens
      naturally—in this case, languages evolving with communities— it is inherently
      worthwhile or morally right to preserve that phenomenon. That moral endorsement
      is not warranted by the fact of naturalness: many natural processes are harmful
      or undesirable, so natural occurrence alone does not justify preservation. This
      is a classic appeal to nature: using the fact that something is natural to claim
      it should be preserved or protected.'
    candidate: Appeal to Nature
    challenged_inference: Because languages evolved naturally with communities, it
      is natural—and therefore desirable—that people should preserve them; thus, languages
      ought to be preserved.
    label_justification: The objection demonstrates that the premise of natural evolution
      is improperly used as normative justification, which is precisely the appeal-to-nature
      fallacy. By showing that naturalness does not inherently entail goodness or
      the need for preservation, the counterargument directly undermines the reasoning
      pattern on which the inference rests.
