input:
  title: Latin American Facebook users weigh in on US election results with memes
  parent: ''
  target: Good or bad, expressing oneself through memes has become a norm nowadays,
    it's a natural form of communication. Hence, no matter the content of the memes,
    it's part of human nature to adapt and express ourselves. However, just like in
    nature where certain behaviors can be harmful (like a snake's venomous bite),
    some memes can perpetuate negativity and misinformation. Similarly, while it's
    a natural form of expression, sharing demeaning or offensive memes can ignite
    harmful thoughts or behaviors in others. So, while it's natural, we should still
    exercise caution and discernment in both creating and sharing memes.
