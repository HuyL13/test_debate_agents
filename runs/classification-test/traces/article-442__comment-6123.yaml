input:
  title: In Togo, singer Elias Atayi uses music as a vehicle for human rights
  parent: ''
  target: Why do we take the word and opinions of artists so seriously? If people
    keep listening to them and basing their opinions off theirs, none of us will have
    our own way of thinking. Plus, they are all rich and the rich don't have our interests
    in mind. Why rely on what this one guy says?
