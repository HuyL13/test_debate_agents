    label_justification: The reasoning proceeds from an emotional claim—children are
      innocent victims—to the conclusion that they deserve more support, without providing
      substantive justification. This emotional appeal is a classic form of the fallacy
      of appeal to pity or appeal to innocence, which is a type of emotional appeal
      error.
