    label_justification: The TARGET claim presents a binary choice—either focus on
      people choosing to lose things or focus solely on children—implying these options
      exhaust all possibilities. However, the reasoning fails because resources can
      be distributed to support both groups simultaneously, demonstrating a false
      dilemma fallacy.
