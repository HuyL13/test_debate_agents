  counterargument:
    decisive_counterargument: You can still help both the activists who are making
      intentional choices and the children who are starving; the argument suggests
      that you must choose one group over the other, which incorrectly frames the
      situation as a zero‑sum choice.
    candidate: False Dilemma
    challenged_inference: Our energy would be better spent helping the innocent victims
