  counterargument:
    decisive_counterargument: The claim that the article’s lack of a citation from
      a specific expert (e.g., Dr. Pablo Gómez) automatically undermines its reliability
      is a false appeal to authority. Merely pointing out the absence of a named authority
      does not demonstrate that the article’s observations—here, that online meme
      popularity does not track public opinion—are incorrect. Valid conclusions can
      be drawn from systematic social‑media data analyses and existing scholarly work,
      even if those sources are not explicitly cited in the article. Therefore, the
      article remains credible without the presence of one named authority, and the
      argument that it must be discounted because of missing citations is logically
      unsound.
