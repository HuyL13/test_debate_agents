      article's argument about meme popularity and public opinion.
    label_justification: The counterargument targets the TARGET’s reliance on a single
      expert’s citation as essential proof; this is an appeal-to-authority fallacy.
      The TARGET asserts that lacking such authority invalidates the article, which
      is a concise claim that the argument fails to establish. The rebuttal shows
      that non‑cited, evidence‑based claims can still be reliable, exposing the appeal‑to‑authority
      error, and thus the appropriate fallacy label is “Appeal to Authority.”
