    support_relation: This is used to justify the imperative that judges must intervene
      early, by implying no other alternative exists.
    label_justification: The argument forces a choice between two extremes as if it
      were the only possibilities, which is characteristic of a false dilemma. The
      speaker does not acknowledge or consider any other potential courses of action.
