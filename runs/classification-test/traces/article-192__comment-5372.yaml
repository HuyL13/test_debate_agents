    candidate: Appeal to Worse Problems
  goal:
    conclusion_or_goal: The speaker contests that concerns about illegal soccer‑streaming
      censorship are a low priority compared to Turkey’s political problems.
    candidate: Appeal to Worse Problems
    supporting_reason: The comment highlights Turkish people’s ‘far bigger problems’
      and the actions of Turkey’s current dictator as the more pressing issue, implying
      that censorship is hardly meaningful in that context.
    support_relation: The mention of the more serious issue is used to dismiss the
      censorship concern, thereby supporting the conclusion that the latter is of
      little importance.
    label_justification: By suggesting that the censorship debate is trivial relative
      to more severe political problems, the argument employs an appeal to a worse
      problem, a recognized fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T2
    - T3
    evidence_spans:
    - purpose, that would be bad of course, but don't people, particularly Turkish
      people, have far bigger problems to worry about? This sort of 'censorship' is
      hardly meaningful in the face
    - of what Turkey's current dictator is doing.
  counterargument:
    decisive_counterargument: Even if other significant issues exist, citing them
      does not automatically diminish the importance or validity of addressing illegal
      streaming of soccer matches. The mere presence of a larger problem does not
      negate the rights or legal framework relevant to the smaller issue. Dismissing
      the legality of streaming solely on the basis of other political grievances
      is a fallacious relativization, not a legitimate rebuttal.
    candidate: Appeal to Worse Problems
    challenged_inference: The argument claims that because of larger political problems,
      censorship of illegally streamed soccer matches is insignificant and thereby
      unjustified.
    label_justification: A reference is made to a larger, unrelated problem (the political
      situation under the Turkish dictator) in order to downplay the relevance of
      the smaller issue (illegal streaming). This is precisely the mechanism of the
      ‘Appeal to Worse Problems’ fallacy. The objection highlights that the target’s
      reasoning uses the larger problem to invalidate a separate legitimate concern,
      thereby exposing that specific fallacious structure.
