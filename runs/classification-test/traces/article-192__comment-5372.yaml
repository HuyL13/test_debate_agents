input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: ''
  target: Are we really getting bothered about soccer matches? Especially, the right
    to illegally stream soccer matches? I mean, if they start abusing the law to go
    after what its intended purpose, that would be bad of course, but don't people,
    particularly Turkish people, have far bigger problems to worry about? This sort
    of 'censorship' is hardly meaningful in the face of what Turkey's current dictator
    is doing.
