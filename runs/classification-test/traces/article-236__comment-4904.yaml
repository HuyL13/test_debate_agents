      (e.g., predation, disease spread, deforestation in the wild). The fact that
      something occurs in nature does not automatically confer moral or practical
      value. Therefore the argument’s claim that living in harmony with nature is
      the sole legitimate path is invalid because it relies on a naturalistic fallacy
      rather than evidence that such harmony actually yields better outcomes.
