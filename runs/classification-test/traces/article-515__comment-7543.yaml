  counterargument:
    decisive_counterargument: A majority can be misinformed, biased, or selfish; majority
      rule does not automatically lead to the best or most just decisions. The claim
      that ‘the majority typically chooses the best way forward’ is a blanket assertion
      that uses the size of the majority as evidence of its correctness—a characteristic
      of an appeal to popularity.
    candidate: Appeal to Majority
    challenged_inference: The argument assumes that because the majority’s will leads
      to the best outcomes, countries must adopt democracy so that the majority’s
      will is the governing principle.
    label_justification: This objection shows that the argument relies on the majority’s
      size as a sufficient basis for truth or acceptability, which is precisely the
      hallmark of an appeal to majority (argumentum ad populum).
