  counterargument:
    decisive_counterargument: The assertion that ‘people will naturally protest injustice’
      assumes that every instance of injustice automatically elicits a protest, which
      is unsupported by evidence. In reality, responses to injustice vary widely—some
      individuals may stay silent, seek legal remedies, or simply ignore the issue.
      Therefore, the claim that students will protest solely because a fellow student
      died is an unjustified generalization.
    candidate: Hasty Generalization
    challenged_inference: People will naturally protest injustice.
    label_justification: The objection demonstrates that the conclusion extends the
      premise—that injustice exists—to assert a universal and inevitable response
      (protest by all people) without sufficient evidence that such a reaction will
      indeed occur. This is precisely the pattern of a hasty generalization, where
      a specific situation is generalized to an entire population or set of people.
    failure_exposed: false
