input:
  title: '‘A day without internet is a day in the dark’: The Gambia''s growing digital
    divide'
  parent: ''
  target: It is only natural for people to want access to information. People need
    access to the internet as it has now become an essential part of life. It is a
    connection to the economy, knowledge,  way to connect with people all around the
    world. We need a plan to ensure all people have equal access to the internet.
