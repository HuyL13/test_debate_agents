input:
  title: Can Jordan offer some lessons to oil-dependent ‘giants’ on renewable energy?
  parent: ''
  target: It's a good sign that the Middle East seems to be finally looking seriously
    at renewable energy. Too often they have seem to be stuck with using oil and other
    polluting fuels. When I look at the issue I think about my neighbor Paul, he says
    he knows a lot bout energy technologies. He says that the Middle East should focus
    entirely on solar power. He does seem to know what he is talking about, so who
    am I to argue? I can see some people arguing that he doesn't have a degree or
    is even an expert, but that seems snobbish to me. He uses a lot of words that
    sound like they could be about energy and he said he watched a tv show about it
    once. I think that is pretty impressive and his opinion should be respected.
