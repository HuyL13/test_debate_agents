    candidate: Appeal to Tradition
  goal:
    conclusion_or_goal: The country cannot achieve a true democratic transition because
      its media is not free.
    candidate: Appeal to Tradition
    supporting_reason: That is one of the main traditions of a democratic country
    support_relation: The premise that free media is a tradition of democracies is
      used to justify the claim that it is a necessary condition for democracy.
    label_justification: The argument appeals to the fact that free media is a traditional
      feature of democratic states as if tradition itself establishes its necessity,
      which is an Appeal to Tradition fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
