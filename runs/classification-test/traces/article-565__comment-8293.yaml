      possible. Every democracy has and needs one.
  counterargument:
    decisive_counterargument: Even if some democracies historically had free media,
      this does not establish that free press is a necessary condition for true democracy.
      Many countries maintain democratic governance while restricting media, and some
      states with extensive free media are not democratic. Thus, the assertion that
      free press is required for democracy rests on an overgeneralised tradition rather
      than a necessary causal link.
    candidate: Appeal to Tradition
    challenged_inference: Because free media is a longstanding tradition of democratic
      countries, it must be essential for a true democratic transition.
    label_justification: 'The argument explicitly cites a historical tradition (free
      media) as evidence that democracy requires it, which is the hallmark of an Appeal
      to Tradition fallacy: using the existence of a custom or long‑standing practice
      to conclude that it is necessary or optimal. The rebuttal shows that the tradition
      does not prove necessity, exposing the fallacious reliance on tradition.'
