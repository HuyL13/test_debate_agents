conflicts:
- id: hasty-generalization__vs__slippery-slope
  type: candidate_disagreement
  candidates:
  - Hasty Generalization
  - Slippery Slope
  triggered_by:
  - surviving_candidate_disagreement
  discriminator: Hasty Generalization requires explicit cases/sample -> broader population/class.
    Slippery Slope requires action/condition -> progressively worse consequences.
  resolution:
    winner: Hasty Generalization
    decisive_test: 'The target sentence claims that global climate change is the root
      cause of religious conflicts in Myanmar based solely on the general observation
      that resource scarcity tends to lead to conflict, without providing any specific
      evidence tying climate change to the particular situation in Myanmar. This is
      a classic hasty generalization: a causal claim about a broad class of events
      (religious conflicts in Myanmar) is drawn from an unverified, general premise
      (resource scarcity causes conflict). No progression of increasingly bad outcomes
      characteristic of a slippery‑slope argument is present. The evidence supporting
      this conclusion is contained in passages T1, T2 and T3.'
    loser_failure: The slippery‑slope claim would require showing an escalating sequence
      of adverse consequences (e.g., from climate change to resource scarcity to worsening
      conflict to something more extreme). The target only offers a single causal
      leap from climate change to conflict; it does not present a chain of progressively
      worsening effects, so it does not satisfy the structural condition for a slippery‑slope
      fallacy.
    evidence_ids:
    - T1
    - T2
    - T3
