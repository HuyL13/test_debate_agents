    conclusion_or_goal: Granting the right to abortion for women and girls who are
      assaulted will inevitably lead to widespread abortion on demand and a plummeting
      birth rate.
    candidate: Slippery Slope
    supporting_reason: Allowing abortion rights will trigger a demand for increasingly
      numerous rights, creating a chain reaction that culminates in countrywide abortions
      on demand.
    support_relation: The reason is used to argue that the initial legal change will
      produce an escalating series of additional rights and negative outcomes.
    label_justification: The argument presents an unsubstantiated, causal chain—from
      one granted right to many others—that leads to an undesirable consequence. This
      is the classic form of a slippery‑slope fallacy, as it projects a sequence of
      events without providing evidence for each link.
    mechanism_supports_goal: true
    evidence_ids:
