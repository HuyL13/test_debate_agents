input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: ''
  target: The federal government needs to resolve this fast before other regions mimic
    this kind of behavior. Failing to get this guy replaced successfully is basically
    the end of the government. When lower level leaders can just defy their superiors,
    that's the only outcome that can occur. The government has to get this done by
    any means. They have no alternative.
