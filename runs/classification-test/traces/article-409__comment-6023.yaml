input:
  title: Jamaicans agonise, politicians seek solutions after another young woman is
    killed
  parent: ''
  target: The legalization of pepper spray for use by women for self-protection sounds
    like a good idea, sure, but Jamaica must be careful. Taking this line can lead
    to unforeseen consequences, as things can get out of control very quickly. First,
    they will be given the right to use pepper spray, but what comes after that? Perhaps
    blackjacks. And then? Maybe tasers. And after that? Probably guns. And then there
    would be a troubling new layer of violence in Jamaica. This kind of approach to
    solving problems can evolve rapidly and get away from you, eventually creating
    a whole new set of problems. I'm not saying pepper spray is a bad idea, just that
    caution is highly advised.
