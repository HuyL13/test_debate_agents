input:
  title: Can Jordan offer some lessons to oil-dependent ‘giants’ on renewable energy?
  parent: ''
  target: This is good news and I'm hopeful for the future, in the region and everywhere
    else. Imagine how much worse it could get if we just keep focusing on fossil fuels,
    like some advocate for. If we stick to such an archaic energy source, all it will
    lead to is climate change getting worse and worse until eventually, humanity and
    likely all other life on earth very simply goes extinct. This isn't just about
    economics, but life and death.
