input:
  title: Jamaicans agonise, politicians seek solutions after another young woman is
    killed
  parent: ''
  target: They should choose a religious figure to find a solution this problem of
    violence against women in Jamaica.  Who could be a better authority to decide
    such a thing other than a man of God?  It would help these women certainly.  But
    since not everyone follow the same religion, we should consult a diverse group
    of people including women.
