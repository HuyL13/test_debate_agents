input:
  title: Tunisia has a disinformation problem, but (further) criminalizing speech
    won't solve it
  parent: ''
  target: I agree that it's good that this bill was withdrawn but who is to say where
    it stops? The issue now becomes what other laws can the people find to challenge
    and have withdrawn? Are we going to petition for leniency in burglary or tax evasion
    laws just because we don't agree with them? Would murder be considered fair? It's
    crucial to note that this could pave the way to utter chaos where anyone with
    a slick lawyer could get away with ruthless crimes. The direction we are headed
    in is scary!
