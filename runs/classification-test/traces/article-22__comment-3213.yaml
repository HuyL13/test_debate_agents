  title: Rejection of new Australian coal mine is a rare win for community environmental
    campaigners
  parent: ''
  target: I am happy, the environment is being protected against this mine. I do think
    we need to look at other ways to boost the local economy. It is also important
    the government look into regulations for further development plans that protect
    the environment. Ecologist, Dr. Seema said, mining not only harms the environment
    but also impedes sustainable economic growth. There needs to be a balance that
    benefits both the environment and the economy. I think we need to get more information
    about impacts before we move forward with any regulations. Are there other experts
    that have different opinions? We need to stick to the facts in order to gain the
    most benefit possible. How else can we benefit the economy if the mine is not
    a good option?
