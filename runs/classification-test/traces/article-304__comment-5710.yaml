    label_justification: The objection attacks the jump from observing that Pakistan
      is generally seen as conservative to asserting that this definitively prevents
      any gay‑rights progress. That assertion extrapolates from a single observation
      (the society’s overall conservatism) to a universal restriction on civil‑rights
      developments, which is precisely the pattern that defines a hasty generalization.
