  counterargument:
    decisive_counterargument: Just because a large number of students are protesting
      does not automatically prove that the stated problem is genuinely serious, nor
      that compliance with the protesters’ demands is the most effective or legitimate
      way to restore peace. Numbers, or popularity, provide no evidence about the
      accuracy or morality of the claims or the efficacy of the proposed actions.
