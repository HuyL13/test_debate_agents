    candidate: Appeal to Majority
  goal:
    conclusion_or_goal: The claim is that because the majority of people in Papua
      New Guinea support the new media restrictions, there is no right to question
      them, thereby justifying the restrictions.
    candidate: Appeal to Majority
    supporting_reason: The argument cites the perceived majority support as evidence
      that the restrictions are acceptable and that objections should be dismissed.
    support_relation: The reasoning uses the majority’s preference as a justificatory
      basis for the policy, implying that majority opinion alone confers legitimacy.
    label_justification: The argument employs the ad‑populum fallacy by asserting
      that the majority’s support renders the policy unquestionable, rather than providing
      independent evidence that the policy is sound.
    mechanism_supports_goal: true
    evidence_ids:
