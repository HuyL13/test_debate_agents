      no right to question them.
  counterargument:
    decisive_counterargument: even if a majority in png believes a policy, that does
      not automatically validate it or preclude legitimate critique; history shows
      majority‑supported rules can be harmful, and dissent can uncover legitimate
      concerns.
    candidate: Appeal to Majority
    challenged_inference: the inference that because a majority might support media
      restrictions, nothing can legitimately question them
    label_justification: the objection points to an argument that relies on the size
      of the group (the majority) to justify absence of scrutiny, which is the hallmark
