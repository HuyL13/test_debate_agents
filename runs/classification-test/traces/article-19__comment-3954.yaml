input:
  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: Why are we putting in more restrictions? Does this really provide a benefit
    or is it a way to distract from something else?  Are there any benefits I am unaware
    of? It seems to go against a need for freedom of expression, a natural want/need
    for all people. What problem is this actually solving? What do these restrictions
    improve? What do you think?
  target: This may be unintuitive, but lots of people in the world aren't interested
    in the complete free flow of information. It just leads to endless polarization
    and divisions in society. The majority in PNG might be completely for this, and
    if they are, then we have no right to question them.
