  counterargument:
    decisive_counterargument: The argument claims that because these people have been
      in Taiwan the longest, they automatically qualify as the true Taiwanese and
      therefore deserve their needs to be met. Longevity alone does not establish
      rightness, authority, or entitlement; those claims require evidence of legal,
      moral, or political justification. The mere fact of a long presence is irrelevant
      to whether their wants should be satisfied or whether they know what is best
      for the country.
    candidate: Appeal to Tradition
    challenged_inference: Because they have been there the longest, they are the true
      Taiwanese and therefore ought to have their wants and needs met (and they know
      what is best for the country).
    label_justification: The objection targets the inference that historical presence
      is sufficient grounds for entitlement and authority. This inference mirrors
      the structure of an argumentum ad antiquitatem, a classic appeal to tradition.
      The premise that “they have been there the longest” is used as sole justification
      for the conclusion that they are ‘true Taiwanese’ and consequently deserve to
      have their needs met. The argument commits a fallacious appeal to tradition
      by assuming that longevity alone validates that claim.
    failure_exposed: false
    evidence_ids:
