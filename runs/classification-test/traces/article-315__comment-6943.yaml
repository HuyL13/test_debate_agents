  goal:
    conclusion_or_goal: Indigenous peoples deserve to have their wants and needs met.
    candidate: Appeal to Tradition
    supporting_reason: They have been there the longest.
    support_relation: The argument uses their historical presence as a justification
      for their deserving rights and needs.
    label_justification: The claim that longevity alone grounds entitlement to be
      granted wants and needs is an appeal to tradition, where historical fact is
      improperly invoked as sole moral authority.
