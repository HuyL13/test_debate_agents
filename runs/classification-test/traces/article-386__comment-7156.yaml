  counterargument:
    decisive_counterargument: While conflict has indeed been a part of human activity,
      the claim that tribalism and warfare are inevitable and that peaceful coexistence
      is always the exception ignores substantial evidence of historical change. Throughout
      the last few centuries, many societies have established legal frameworks, international
      norms, diplomatic institutions, and social movements that have dramatically
      reduced violence and fostered sustained peace—examples include the expansion
      of democratic governance, the creation of the United Nations, and the widespread
      adoption of human rights conventions. These developments show that human societies
      can—and do—alter previously entrenched patterns of conflict, contradicting the
      assertion that tribalism is “too innate and natural” to ever be defeated.
    candidate: Hasty Generalization
    challenged_inference: It seems like these sorts of conflicts are just eternal.
