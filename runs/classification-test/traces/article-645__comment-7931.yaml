  counterargument:
    decisive_counterargument: The fact that Facebook has historically monitored and
      removed posts does not automatically make such actions morally acceptable or
      justify dismissing criticism as irrational. Tradition or past practice does
      not determine the rightness or fairness of an act; it merely records that an
      organization has chosen a particular policy. Users can still justifiably protest
      because the policy may violate principles of free expression, privacy, or due
      process. Therefore, concluding that reacting with shock is irrational because
      Facebook’s actions are a long‑standing practice commits the fallacy of appealing
      to tradition.
    candidate: Appeal to Tradition
    challenged_inference: Reacting with shock to Facebook's monitoring and removal
      is irrational because these actions simply follow Facebook’s long‑standing practices.
    label_justification: The objection shows that the target’s claim rests on the
      premise that Facebook’s historical routine justifies ignoring criticism. An
      appeal to tradition is a fallacy where longstanding practice is used to justify
      the status quo, overlooking independent moral or logical evaluation. Hence,
      the counterargument specifically targets this reasoning pattern.
