  title: Filipino activists decry Facebook’s ‘automated censorship’
  parent: ''
  target: Facebook has long held that controversial posts will be monitored and/or
    removed. This is hardly new. They've come under fire for similar things in other
    regions of the world, many times, because this has been their way, their modus
    operandi, from almost the beginning. It seems irrational and unfair to react with
    shock when Facebook is only acting according to its longtime practice and standard
    operation.
