  counterargument:
    decisive_counterargument: Believing that the majority must be correct ignores
      the fact that majority opinions can be wrong or unjust. History shows many movements
      for justice arose precisely because the prevailing majority supported injustice
      or oppression; thus, using popularity as proof of correctness is an incorrect
      appeal to the majority.
    candidate: Appeal to Majority
    challenged_inference: Most of the people can’t be wrong, so follow the crowd for
      peace.
    label_justification: 'The target’s argument depends on the premise that the majority’s
      viewpoint is inherently correct. This is the hallmark of an appeal to majority:
      the conclusion is justified solely by the popularity of the belief, rather than
      by substantive evidence. The counter‑argument shows that a large number of people
      can still hold flawed or harmful beliefs, thereby exposing the specific reasoning
      flaw of an appeal to majority.'
