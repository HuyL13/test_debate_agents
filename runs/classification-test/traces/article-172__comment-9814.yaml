      There
    candidate: Appeal to Majority
  goal:
    conclusion_or_goal: Phasing out coal is justified/beneficial.
    candidate: Appeal to Majority
    supporting_reason: The statement that most people in Australia (and in a large
      part of the world) are on board with phasing out coal is used to justify the
      transition.
    support_relation: This popular sentiment is cited as evidence that the transition
      is correct, employing the appeal to popularity fallacy.
    label_justification: The argument relies on the proportion of the population in
      favor of coal phase‑out as if majority approval alone establishes the argument’s
      truth, which is the hallmark of an Appeal to Majority (argumentum ad populum).
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T3
    evidence_spans:
    - It seems like most of the people in Australia are on board with the phasing
      out of coal as an energy source. I think this has been the prevailing attitude
    - further our industriousness. Most scientists agree that renewables are better
      for the environment than coal burning plants are. Time marches on as does innovation.
      The radio gave way to Television
  counterargument:
    decisive_counterargument: The author generalizes a global consensus from an observation
      that many Australians support phasing out coal, providing no empirical evidence
      that a majority elsewhere shares this view. The inference that 'most people
      would agree' that losing coal jobs is a worthy sacrifice is therefore unsupported,
      making it a hasty generalization.
    candidate: Hasty Generalization
    challenged_inference: That the prevailing attitude in much of the world (and that
      most people would agree coal phaseout is a worthy sacrifice) follows from the
      author's observation that many Australians support it.
    label_justification: The argument takes the viewpoint of a limited demographic
      (Australian public) and presents it as evidence for a universal global attitude
      without justification, which fits the definition of a hasty generalization.
    failure_exposed: true
    evidence_ids:
    - T1
    - T5
    evidence_spans:
    - It seems like most of the people in Australia are on board with the phasing
      out of coal as an energy source. I think this has been the prevailing attitude
    - Most people would agree that losing a few thousand coal mining jobs in an effort
      to leave a livable planet for our children and grandchildren is a worthy sacrifice.
      There
