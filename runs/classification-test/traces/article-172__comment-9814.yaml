input:
  title: Australian court's historic rejection of coal mine highlights the impact
    of climate change
  parent: ''
  target: It seems like most of the people in Australia are on board with the phasing
    out of coal as an energy source. I think this has been the prevailing attitude
    across a big part of the world as well. It does not surprise me that the courts
    are starting to see the science behind the reliance on fossil fuels to further
    our industriousness. Most scientists agree that renewables are better for the
    environment than coal burning plants are. Time marches on as does innovation.
    The radio gave way to Television and newspapers to the internet. These are things
    that people all have adapted to and accepted for the most part. Coal mining and
    oil drilling are going that same route. Most people would agree that losing a
    few thousand coal mining jobs in an effort to leave a livable planet for our children
    and grandchildren is a worthy sacrifice. There are many other mining jobs that
    these coal miners could transition to and not have to learn any kind of "new"
    line of work.
initial_analysis:
