    decisive_counterargument: The claim that digital authoritarianism is “pretty weak”
      merely reflects a lack of evidence, not its actual influence. Even a seemingly
      modest use of online censorship or surveillance can erode civil liberties, shape
      public discourse, and bolster the regime’s overall control. Therefore, dismissing
      digital authoritarianism because it appears less obvious overlooks its real
      significance.
