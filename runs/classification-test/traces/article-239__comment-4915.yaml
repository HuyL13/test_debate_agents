  title: The Caribbean speaks out on the climate crisis
  parent: ''
  target: Imagine how much better off we'd be in terms of the climate if we just embraced
    the natural ways humans lived before the creation of all these artificial technologies.
    People used to know how to live in harmony with nature. We wouldn't have to be
    worrying about the ocean knocking at our doors if every tiny aspect of our lives
    didn't involve pollution.
