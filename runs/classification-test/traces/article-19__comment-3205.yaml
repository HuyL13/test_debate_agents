    candidate: Appeal to Nature
  goal:
    conclusion_or_goal: The policy of requiring permission to ask world leaders questions
      is wrong and should not exist.
    candidate: Appeal to Nature
    supporting_reason: The argument relies on the claim that asking permission is
      not natural and therefore indicates something is very wrong.
    support_relation: The reason is used to justify the conclusion by asserting that
      normality (or naturalness) is a standard for moral or political acceptability
      and that violating it renders the practice undesirable.
    label_justification: 'This is a classic appeal to nature fallacy: the author judges
      the policy as bad simply because it is not natural, using naturalness as an
      implicit standard of goodness or acceptability.'
    mechanism_supports_goal: true
    evidence_ids:
    - T1
