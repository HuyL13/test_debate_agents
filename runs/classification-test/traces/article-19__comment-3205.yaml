input:
  title: Papua New Guinea’s new media rules could undermine the work of journalists
  parent: ''
  target: Having to get permission to ask a world leader questions is not natural.
    It indicates something is very wrong. Its not in our nature to act this way when
    we want or need answers to important societal issues. What is natural is what
    we have in the west where lots of people regularly talk to our leaders and have
    transparency.
