input:
  title: New book presents rarely researched aspects of Myanmar's political and media
    transition
  parent: ''
  target: It seems certain they will regress back into their former state once again,
    given that a smattering of the old regime and its attitudes still lingers among
    those in the new government. Those elements must be completely snuffed out or
    they will gain more and more ground until they squeeze out of government all the
    new reformed-minded people, and then you have a return to military rule and a
    clampdown on free expression.
