    label_justification: The argument claims that the lingering old regime elements
      will inevitably lead—through a chain of worsening effects—from regaining influence
      to ultimately restoring military rule. This teleological, step‑by‑step escalation
      with no evidence of inevitability constitutes a slippery‑slope fallacy.
