input:
  title: Filipino activists decry Facebook’s ‘automated censorship’
  parent: Facebook goes too far. Sison means something to a lot of people in the philippines.
    So they should be allowed to post about him in the philippines. The people respected
    him, and Facebook should allow people to share. He simply counts as a political
    figure. Facebook should back down.
  target: I agree that Facebook monitors things a little too far at times. Think about
    the alternative of everyone posting whatever they wanted. Without some line in
    the sand, criminals and anyone else could post whatever illegal images they wanted.
    Think about actions that not censorship would have on Facebook, and social media
    in general. It is scary to think about. I am not even saying that all posts would
    go into the wild west territory and be harmful, but the few cases that I have
    seen of misuse it's a reasonable fear. Let's not ignore the risks!
