    decisive_counterargument: The claim that most politicians are crooked is made
      without any evidence or specific examples and is applied to all politicians
      as a conclusion that they cannot be trusted.  Politicians, like any group, are
      heterogeneous; some are honest and accountable.  Therefore the inference does
      not follow from the premise.
    candidate: Hasty Generalization
    challenged_inference: If you have an election and the losing party does not leave
      office how can you trust them? Most politicians are crooked and should not be
      trusted. People need to make sure to stay on top of these people because they
      all do what is in their best interest and not your best interest. People need
      to stay alert and informed.
    label_justification: The objection points out that the argument draws a blanket
      conclusion about all politicians from an unsupported general statement (“Most
      politicians are crooked”), which is precisely the reasoning defect identified
      by the Hasty Generalization fallacy.  The objection does not merely criticize
      tone or content – it targets the logical step of extending a single unverified
      claim to an entire population.
