  counterargument:
    decisive_counterargument: While celebratory gunfire may have historical roots,
      relying on tradition alone is insufficient to justify a practice that creates
      danger for the public. Over time societies have reassessed and revised customs—such
      as banning fireworks to prevent injuries or disarming combatants after war—to
      protect their members. The potential for injury and loss of life is a legitimate
      concern that outweighs the mere presence of a long‑standing custom.
    candidate: Appeal to Tradition
    challenged_inference: The conclusion that tradition alone validates celebratory
      gunfire and that any attempt to curb it is silly.
    label_justification: The objection directly confronts the reliance on historical
      practice as a reason to continue a harmful activity, which is the defining feature
      of the Appeal to Tradition fallacy. By demonstrating that many traditions have
      been abandoned when they posed societal dangers, the counterargument shows that
      tradition is not a sufficient criterion for moral or practical decisions.
