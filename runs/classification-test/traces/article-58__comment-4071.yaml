      causes the population’s death.
    label_justification: 'The objection directly targets the logical structure of
      the argument: it replaces a nuanced issue with an oversimplified two‑option
      framework. This is the hallmark of a false dilemma, whereby the speaker frames
      the situation as only two mutually exclusive outcomes and thus justifies an
      extreme stance. The counterargument demonstrates that the inference is based
      on an unsupported dichotomy, not on factual inevitability, thereby exposing
      the fallacy.'
