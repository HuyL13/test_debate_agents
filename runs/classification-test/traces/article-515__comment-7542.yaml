input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: ''
  target: It's only natural that those with a taste of power would not readily relinquish
    them. In the same vein as those who vie for power to contend with others. It's
    just like watching lions in the wild, the struggle for supremacy and control is
    always at play. There's a certain instinctual push that drives this behavior,
    whether in humans or animals. If you think about it, it's just akin to how a pack
    of wolves snarls and fights until one emerges as the alpha, it's a survival instinct
    ingrained in our very being. It all boils down to this same instinctual drive,
    the fight for survival, the acquisition of power or dominance, whether it's in
    politics or in the wild.
