input:
  title: Should there be Shona-language versions of Google and social media sites?
    This Zimbawean technologist says yes
  parent: ''
  target: Preserving one's own language through time and change is indeed the right
    thing to do, and it's encouraging to see such dedication. Traditionally, respecting
    and upholding an ancestral language has always been thought of as a testament
    to our identity and heritage - a sentiment that's been held true for generations.
    Isn't it reassuring to believe in the unchanging truth of our traditions, regardless
    of whether or not it has universal applicability? This should inspire us all to
    keep the flame of our linguistic heritage alive for future generations to appreciate
    and engage with. After all, isn't tradition what makes us who we are?
