  counterargument:
    decisive_counterargument: Saying that preserving a language is right simply because
      it has traditionally been upheld as part of identity does not prove it is intrinsically
      good or the best choice in the present. Traditions can be outdated, exclusionary
      or harmful, and the mere fact that they have existed for generations does not
      establish that they should continue or that they are universally applicable.
      Thus, the inference that tradition alone warrants language preservation is logically
      unsupported.
    candidate: Appeal to Tradition
    challenged_inference: Preserving one’s own language is right because it has traditionally
      been considered a testament to our identity and heritage.
    label_justification: The target’s argument relies on the premise that because
      a practice has existed in tradition, it is inherently good and should be continued.
      That reliance on historical precedent as justification is the defining characteristic
      of an appeal to tradition. The counterargument shows that tradition does not
      logically determine value, exposing the fallacious inference.
