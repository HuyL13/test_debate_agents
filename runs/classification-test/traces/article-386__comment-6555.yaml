input:
  title: Flood of false bomb threats raise security concerns in Kosovo
  parent: ''
  target: I'm sorry to hear about the chaos and confusion aroused by these false alerts.
    However, there is outright war going on, with Russian aggression exerting itself
    against Ukraine. All threats are threatening, of course, but some pale in comparison
    to others, especially those which involve rockets being fired into your buildings
    and killing hundreds or thousands of people. Kosovo is right to consider the potential
    connections there, but it might also want to reconsider its decision not to place
    sanctions on Russia, since the ongoing war is a much more severe situation than
    mere false alerts, and things might get much worse as Russia gets the upper hand
    in its conflict with Ukraine and then Kosovo may have more to face than scary
    phone calls and false alerts.
