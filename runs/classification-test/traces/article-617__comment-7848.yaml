input:
  title: 'Cameroon: Report the Anglophone conflict and perish'
  parent: ''
  target: Journalists should not be fearing for their lives just by doing their job.
    It is unthinkable to consider that reporters are arrested, attacked and murdered
    routinely in Cameroon. These sorts of threats and violence goes against all of
    the natural world. It is completely unnatural and is repulsive to our natural
    instincts. Instead we must protect these journalists as we would our own family.
    This is what we must do as humans, it is only natural. Do you all agree on this
    simple notion?
