input:
  title: '2021: A fruitful year for Indigenous communities in Taiwan'
  parent: ''
  target: It's wonderful to see such recognition, so hard-earned and a long time coming.
    But let's be careful, too. While social progress and the recognition of all people
    groups is good, we must not make changes too quickly, as these patterns of social
    order have been in place in the region for a very long time. Reform is always
    welcome but not at the expense of long established views which have so powerfully
    shaped such a large part of the world.  Let's strive for changes that honor tradition
    while making room for progress.
