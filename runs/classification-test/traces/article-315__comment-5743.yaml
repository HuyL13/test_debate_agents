  counterargument:
    decisive_counterargument: Long‑standing tradition does not automatically justify
      resisting change; traditions can be harmful or outdated. A careful evaluation
      of the values and outcomes of a practice is required, not a blanket statement
      that quick change is undesirable because the practice has existed for a long
      time. Therefore, the argument that we should not act quickly simply because
      social patterns have been in place ‘for a very long time’ is unfounded.
