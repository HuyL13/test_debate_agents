  counterargument:
    decisive_counterargument: The argument assumes that because some false accusations
      exist, any system that considers allegations will inevitably harm innocent politicians;
      this is a generalization based on insufficient evidence. In practice, most democracies
      incorporate safeguards—such as corroborating evidence, due‑process hearings,
      and a presumption of innocence—so that allegations are weighed before any punitive
      action. Thus the concern that the system will systematically slander innocent
      officials is exaggerated.;
    candidate: Hasty Generalization
    challenged_inference: In justifying that taking allegations into account will
      lead to innocent politicians being unfairly removed, the argument assumes a
      causal link without sufficient evidence, generalizing from a few alleged false
      cases to all cases;
    label_justification: 'The counterargument points out that the claim takes a handful
      of false allegations as proof that every instance of considering an allegation
      will blame an innocent person. This is a classic hasty generalization: a broad
      conclusion about all potential outcomes is drawn from a limited observation—here,
      the existence of some false accusations. The argument lacks evidence that such
      false accusations are common enough or that safeguards would fail, so it commits
      the Hasty Generalization fallacy rather than merely raising a legitimate concern.'
