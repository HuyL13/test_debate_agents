input:
  title: New book presents rarely researched aspects of Myanmar's political and media
    transition
  parent: ''
  target: Freedom of expression is very important even in developing countries. Credible
    journalism is also essential in paving the way for reform. This book clearly shows
    the struggle for free speech in Myanmar, from the military junta era to now. It
    raises a worrying trend too, the use of old laws to suppress free speech even
    under civilian leadership. it's useful to bear in mind, even countries under democratic
    transition like Myanmar, struggle with freedom of expression.
