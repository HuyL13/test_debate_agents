  counterargument:
    decisive_counterargument: The passage claims that every country undergoing democratic
      transition—illustrated only by Myanmar—faces struggles of free expression, yet
      no data from any other nation is offered. Drawing a conclusion about the entire
      class of transitioning states from a single case is precisely the hasty generalization
      fallacy.
