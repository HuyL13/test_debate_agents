  counterargument:
    decisive_counterargument: The claim that any language’s value comes from human
      nature’s love of communication misleads by treating inherent inclination as
      a sufficient reason for online implementation. Human communication can exist
      in countless forms; simply offering an online venue for one minority language
      does not guarantee increased communication, engagement, or cultural preservation,
      especially when instrumental factors such as user base, infrastructure, and
      resource allocation are ignored.
    candidate: Appeal to Nature
    challenged_inference: Because humans are naturally inclined toward language and
      communication, adding Shona to digital platforms is inherently good.
    label_justification: The argument appeals to the naturalness of communication
      as a justification for the action, asserting that since communication is deeply
      ingrained in human DNA, providing a Shona-language platform is necessarily beneficial.
      This is precisely the classic appeal-to-nature fallacy, where a natural fact
      is conflated with a normative claim.
