    label_justification: 'The objection exposes an Appeal to Nature fallacy: the reasoning
      substitutes a natural metaphor for a normative argument, claiming that because
      nature often exhibits harmony, humans must mimic that pattern. This is a direct
      appeal to the natural world as a guide for human behaviour, which the counter‑argument
      demonstrates to be invalid.'
