  counterargument:
    decisive_counterargument: 'The argument rests on the claim that because the natural
      world is generally harmonious, religious communities ought to be harmonious
      too. This is a classic appeal to nature: it treats a natural observation as
      a normative endorsement. In reality, the animal kingdom contains many examples
      of violent competition, predation and group conflict—e.g., pack-hunting wolves,
      territorial bee colonies, or violent primate clans—showing that nature is not
      uniformly peaceful. Thus the step from nature’s behaviour to a moral prescription
      for human religious groups is unwarranted. Furthermore, human social cohesion
      depends on cultural, historical, political, and psychological factors that are
      not dictated simply by natural analogies, so the expectation that religious
      unity is inevitable because “all things tend to live in harmony” is unfounded.'
    candidate: null
