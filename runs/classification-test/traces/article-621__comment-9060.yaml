    conclusion_or_goal: More must be done to protect them, for the sake of the ecosystem.
    candidate: Slippery Slope
    supporting_reason: If we don't ramp up protection efforts, they'll surely slip
      into extinction and then that will just lead to greater collapse in the ecosystem
