input:
  title: Activists in Lebanon are taking on the country's stray bullet problem
  parent: Celebratory gunfire has been a part of different cultures for decades if
    not hundreds of years. Trying to stop it now because of a few accidents is silly.
    Are we going to stop driving due to thousands being killed in wrecks every year
    Tradition is important. All cultures have them!
  target: And for many more thousands of years before that, guns never even existed.
    Maybe they should stick to the more natural traditions. Surely we can be happy
    celebrating in more natural ways, ones that don't involve metal inventions that
    can maim and kill people from miles away.
