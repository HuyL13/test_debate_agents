input:
  title: 'Unfreedom Monitor Report: El Salvador'
  parent: While all the centralized power this government has seems pretty problematic,
    the 'digital authoritarianism' bit seems pretty weak. Is this really a big and
    important part of the problem these people are facing? It feels like the more
    traditional authoritarian methods are significantly more important to deal with
    than how some people are treated online.
  target: Only focusing on the big problems may let many smaller solvable ones last
    longer then they should. Attack all problems if possible. A healthier system may
    be the result.
