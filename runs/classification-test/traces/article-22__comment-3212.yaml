input:
  title: Rejection of new Australian coal mine is a rare win for community environmental
    campaigners
  parent: ''
  target: This whole push for environmentalism is going too far. A coal company that
    would have created hundreds of jobs and brought all the benefits associated was
    stopped, for what? Because some people are worried about global climate change?
    What's next, even the 'renewable' energy sources are bad and we all just have
    to live incredibly basic lives with no luxuries, all for the sake of the environment?
    Are hundreds of lost jobs going to turn into thousands, or even millions? We need
    to find a balance.
