  goal:
    conclusion_or_goal: The speaker argues that environmentalism—specifically the
      stopping of a coal company—is going too far and should be moderated.
    candidate: Slippery Slope
    supporting_reason: The reasoning predicts that stopping a coal company for climate
      concerns will inevitably lead to far‑reaching negative consequences such as
      a mass loss of jobs and a decline in living standards, implying an inevitable
      cascade of problems.
    support_relation: The slippery slope reasoning is used as the principal argument
      to justify the conclusion that environmentalism is excessive and needs a balance.
    label_justification: The argument presents an unsubstantiated chain from a single
      policy (stopping a coal company) to a series of severe future outcomes (loss
      of jobs, basic living conditions), which is characteristic of a slippery‑slope
      fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    - T3
    evidence_spans:
    - This whole push for environmentalism is going too far. A coal company that would
