  counterargument:
    decisive_counterargument: Memes are not confined to just two categories—funny
      and depressing.  They can be informative, satirical, political, or simply neutral.  Claiming
      that memes must be either funny or depressing ignores these legitimate forms,
      so the statement is false.
    candidate: False Dilemma
    challenged_inference: There are only two types of memes, funny or depressing
