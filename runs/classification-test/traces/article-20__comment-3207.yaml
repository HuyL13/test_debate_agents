  title: 'Silent and uneasy: Armenia’s response to the Russian invasion of Ukraine'
  parent: ''
  target: I don't think there is a clear answer to this dilemma. Armenia seems very
    intertwined with Russia both for economic reasons and security reasons. Is there
    a way for Armenia to continue to benefit from Russia but not support them in ways
    that cause harm to other nations? If they have to break ties with Russia they
    are likely to suffer economically but continuing to support Russia may result
    in negative consequences with other nations. Maybe there is a way for Armenia
    to maintain relationships with Russia and other nations that they will benefit
    from.
