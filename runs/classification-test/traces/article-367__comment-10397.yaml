input:
  title: EU flag torn down from Georgian Parliament in second day of far-right street
    violence
  parent: It wasn't really a good idea to call off the march because of the violent
    protesters.  Allowing intimidation to dictate whether others can show their disapproval
    of suppression of human rights, sets a dangerous precedent. Imagine if violent
    protestors decided men should no longer be allowed to drive because statistics
    show they are responsible for most accidents. Those that disapprove of such a
    restriction, would not be able to protest against it which may signal to officials
    most citizens approve of it.
  target: Leaving the decision to end the protest on the government might be the better
    thing. They are the authority to do so, so let them make the call. They should
    take immediate steps to enforce a stricter control on these hate groups.
