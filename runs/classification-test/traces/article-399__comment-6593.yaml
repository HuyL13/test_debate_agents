input:
  title: '‘A day without internet is a day in the dark’: The Gambia''s growing digital
    divide'
  parent: Everyone in Gambia should just listen to the leaders. Things will go smoother
    for everyone. Some may argue, but trust is important.
  target: I agree with you that it is important to listen to the leaders, but what
    happens when the majority of them don't have  your best interest in mind? Should
    people listen to them then? I am sure the majority of the leaders aren't looking
    out for the  people's best interest. I am sure a majority of us have been let
    down by actions that seem to favor the powerful few over the general population.
    I am pretty sure that most people would feel the same way I do.
