  resolution:
    winner: Appeal to Majority
    decisive_test: Appeal to Majority's mandatory structural condition— that the argument
      relies on a claim about a majority population to justify a conclusion— is directly
      reflected in the target text. The target explicitly states, “I am sure the majority
      of the leaders aren't looking out for the people’s best interest” (T2) and “I
      am sure a majority of us have been let down” (T2) and that “most people would
      feel the same way I do” (T3), using that majority claim to argue that people
      should not listen to the leaders. This satisfies Appeal to Majority’s structure.
      In contrast, the target does not present an explicit instance of drawing a broad
      conclusion from a limited sample, which would be required for a Hasty Generalization.
      The generalization implied by the target is tied to a majority claim rather
      than a small anecdotal sample, so Hasty Generalization’s mandatory condition
      is not directly supported.
    loser_failure: The target lacks the necessary evidence of an insufficiently broad
      or poorly representative sample that would justify a Hasty Generalization. The
      references to majority claims instead directly support Appeal to Majority, leaving
      Hasty Generalization unsupported.
