  counterargument:
    decisive_counterargument: While coal mines have historically provided jobs and
      income to local economies, that fact alone does not prove stopping them will
      inevitably create a new problem.  Historical success does not dictate future
      outcomes, and alternative industries can supplant mining jobs without harm.  Therefore
      the claim that ending the mines necessarily results in a new problem lacks substantive
      evidence and simply relies on the tradition of mining for justification.
    candidate: Appeal to Tradition
    challenged_inference: The argument infers that because coal mines have traditionally
      supported local economies, ceasing their operation will inevitably generate
      a new problem, without providing supporting evidence.
    label_justification: The inference relies on the historical role of coal mines
      to justify maintaining them, treating tradition as evidence that any change
      will be detrimental.  This is characteristic of an Appeal to Tradition fallacy,
      where the longevity or established practice is used as proof of the best or
      necessary choice.
