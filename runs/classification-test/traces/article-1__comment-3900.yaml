input:
  title: Record crowd commemorates Tiananmen Massacre at Hong Kong candlelight vigil
  parent: Some believe that the democratization of China is a good thing, but only
    think this way because it has become a popular opinion. It's hardly a simple matter.
    Perhaps the Chinese government knows what it best after all. Many do think that
    the current Chinese government have their priorities straight. We should let people
    decide for themselves.
  target: For you to use democracy and the Chinese government in the same sentence
    must mean you are either clueless as to what democracy is or you are a troll who
    is representing the CCP. We all know what the government is all about. They might
    allow you to vote which is a democratic act, but you are still selecting officials
    with communist beliefs.
