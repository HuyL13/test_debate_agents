  counterargument:
    decisive_counterargument: 'The claim that it is “unfair” for minorities to push
      legislation against the apparent will of the majority hinges on the idea that
      majority opinion alone can determine what is fair, and that any policy that
      diverges from that opinion is unjust.  That is an Appeal to Majority (majoritarianism)
      fallacy: the argument uses the consensus—or lack thereof—among the people as
      the sole justification for fairness, ignoring the principle that minority rights
      and legal protections may legitimately override majority preferences.  Consequently,
      the reasoning that minorities cannot legitimately change laws because the majority
      fears or disagrees with such changes is logically flawed.'
