      commenters agree that their system is BROKEN.
    label_justification: The inference is supported solely by the consensus of commenters,
      which is a classic appeal to popularity. The argument does not provide substantive
      evidence; thus the reasoning is fallacious and specifically falls under the
      appeal to majority.
