  counterargument:
    decisive_counterargument: The claim that ‘Everyone who knows about Japan’s criminal
      justice system knows it is insane and should be illegal’ relies entirely on
      the subjective opinion of a majority of commenters, without any factual evidence
      or logical justification. Demonstrating that many people hold a particular view
      does not establish the truth of that view; it merely reflects its popularity.
      Therefore, this argument commits the appeal to majority (argumentum ad populum).
