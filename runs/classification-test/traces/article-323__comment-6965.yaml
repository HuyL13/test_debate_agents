  goal:
    conclusion_or_goal: Shona will not become a global online language; it may only
      be suitable for local use.
    candidate: Appeal to Tradition
    supporting_reason: People will try to preserve their tradition.
    support_relation: The speaker uses the desire to preserve tradition as a justification
      for concluding that Shona's viability as an online language is limited to local
      use and will not achieve global adoption.
    label_justification: The argument appeals to the value placed on tradition to
      explain why a language would not be adopted globally, yet the premise does not
      provide a valid causal link to the conclusion, fitting the definition of an
      Appeal to Tradition.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    evidence_spans:
    - People will try to preserve their tradition. So shona as a natural online language
      may or may not work. It certainly won't go global, but might suffice for local
      use.
  counterargument:
    decisive_counterargument: The argument claims that the desire to preserve tradition
      will inherently make Shona unsuitable for global online use. This is an unsupported
      causal claim; tradition alone does not determine whether a language can thrive
      on the Internet, as many languages with strong traditions (e.g., English, Chinese)
      are globally dominant. Without evidence linking tradition to digital adoption
      barriers, the inference that tradition guarantees limited success is invalid.
    candidate: Appeal to Tradition
    challenged_inference: Because people will try to preserve their tradition, Shona
      as a natural online language may or may not work and it certainly won’t go global,
      although it might suffice for local use.
    label_justification: The objection specifically attacks the reasoning that appeals
      to the desire for tradition as a justification for limited success, which is
      the core of the Appeal to Tradition fallacy. The counterargument shows that
      the link between tradition and global viability has no supporting evidence,
      thereby exposing exactly that fallacy, not merely a generic critique.
    failure_exposed: true
    evidence_ids:
    - T1
    evidence_spans:
    - People will try to preserve their tradition. So shona as a natural online language
      may or may not work. It certainly won't go global, but might suffice for local
      use.
