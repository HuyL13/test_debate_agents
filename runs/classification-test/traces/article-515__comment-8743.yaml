input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: ''
  target: 'This kind of infighting is innate among politicians. In fact, this trait
    is so native, such a natural building block of the politician''s makeup, that
    it is the very reason he entered politics in the first place. Their love of power
    is like the spots on a leopard: an unchangeable mark of a particular kind of animal.
    We can hope for better from our leaders, but I wouldn''t count on it. Besides,
    the fact that this trait and its results (infighting) are so naturally intrinsic
    to politics means they are probably the best way to approach political issues.
    Darwin would be proud.'
