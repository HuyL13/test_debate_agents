    candidate: Appeal to Nature
  goal:
    conclusion_or_goal: Infighting among politicians is a natural, innate trait, and
      therefore it should be regarded as the most suitable or best way to approach
      political issues.
    candidate: Appeal to Nature
    supporting_reason: The argument asserts that because infighting is naturally intrinsic
      to politics—present as an unchangeable trait akin to spots on a leopard and
      endorsed by Darwin—the naturalness itself provides justification for its use
      as the preferred political strategy.
    support_relation: The claim that infighting is a natural, innate trait is employed
      to justify treating it as the optimal approach to political matters, implying
      that naturalness equals effectiveness or desirability.
    label_justification: The argument appeals to the idea that a characteristic is
      good or acceptable simply because it is natural. By arguing that politicians’
      infighting is a natural, evolutionary feature and therefore appropriate, the
      speaker commits the Appeal to Nature fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T2
    - T3
    - T4
    evidence_spans:
    - 'he entered politics in the first place. Their love of power is like the spots
      on a leopard: an unchangeable mark of a particular kind of animal. We can hope'
    - for better from our leaders, but I wouldn't count on it. Besides, the fact that
      this trait and its results (infighting) are so naturally intrinsic to politics
