    - probably the best way to approach political issues. Darwin would be proud.
  counterargument:
    decisive_counterargument: The target’s reasoning conflates the naturalness of
      political infighting with its desirability and effectiveness.  The mere fact
      that politicians display infighting ‘by nature’ does not justify or promote
      its use as the optimal way to address political issues.  Natural occurrence
      is a neutral description, not an endorsement for that behavior.  Therefore,
      the argument rests on an invalid appeal to nature—claiming something must be
      good or the best approach simply because it is inherent.
    candidate: Appeal to Nature
    challenged_inference: Because infighting is a natural part of politicians’ makeup,
      it is therefore the best way to approach political issues.
    label_justification: The objection directly targets the fallacious reasoning that
      equates naturalness with appropriateness, which is the hallmark of an Appeal
      to Nature.  It does not merely criticize the argument’s conclusion but demonstrates
      that the inference from ‘natural’ to ‘best practice’ is logically unsupported.
