input:
  title: Refugees in Ethiopia's camps raise privacy and exclusion concerns over UNHCR’s
    new digital registration
  parent: How much deeper are we going to dig into relying on artificial technologies
    for every little thing? Applications of these sorts of unnatural things really
    dehumanize people. These people are right to be worried, because they're being
    turned from real individuals into some digital statistic in a machine.
  target: You can either join the new technology or get left behind. There is to middle
    ground with tech. There is not as much balance as many think.
