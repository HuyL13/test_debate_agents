    candidate: Appeal to Majority
  goal:
    conclusion_or_goal: Everyone should be able to identify all foreign interference
      in their internal affairs.
    candidate: Hasty Generalization
    supporting_reason: Foreign interference is widespread globally, as illustrated
      by the author’s reference to Russia and China’s alleged interference in U.S.
      elections and the belief that Slovakia and most other countries have the same
      experience.
    support_relation: The author uses the claim of widespread interference to argue
      that citizens worldwide should be equipped to detect such influence.
    label_justification: The argument generalizes from an unsubstantiated claim about
      only a few cases (Russia and China, with an assumption about Slovakia and the
      rest of the world) to a sweeping assertion that applies to all nations. This
      lack of evidence or representative sample constitutes a hasty generalization.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - From an American perspective, this just sounds like a good idea. How much has
      Russia and China and so on interfered in our elections? I bet Slovakia and most
