  counterargument:
    decisive_counterargument: Even if it is a natural human tendency to seek justice
      or to fight when we believe we have been wronged, that naturalness does not
      automatically justify or mandate the pursuit of those actions. Natural behavior
      can be morally neutral or even harmful—e.g., an instinctive fight response can
      cause unnecessary violence or cause harm to innocents. Likewise, the inclination
      to reconsider balance and peace need not be followed without evaluating the
      specific circumstances or ethical consequences. Therefore, using ‘naturalness’
      as a basis for deciding what we ought to do is a fallacious appeal to nature.
