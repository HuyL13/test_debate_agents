input:
  title: 'Unfreedom Monitor Report: El Salvador'
  parent: If the country has been peaceful for nearly three decades, why stop it.
    Its methods must be working to some degree and shouldn't be punished. Other aspects
    of rights shouldn't be ignored but don't forget about peace being a large positive.
  target: I agree with you, and it's evident that you're right because the people
    support this government. Isn't it clear that they're willing to trade in some
    freedom for security? While this may be contrary to say American values, that
    doesn't mean it's wrong. If the majority of people are behind this kind of authoritarianism,
    it should be respected.
