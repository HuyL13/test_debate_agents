  counterargument:
    decisive_counterargument: The assertion that ‘it is only natural’ for governments
      to control the narrative serves no logical purpose beyond stating what the speaker
      assumes, and it incorrectly assumes that naturalness can be used as a moral
      or justificatory principle. Natural phenomena—bad or good—do not in themselves
      determine what is acceptable or preferable; for instance, disease and stupidity
      are also natural yet largely undesirable. Therefore, claiming naturalness as
      a reason to expect or accept government control of information is unjustified
      – the argument relies on an Appeal to Nature fallacy.
    candidate: Appeal to Nature
    challenged_inference: It is only natural that governments want to control narrative
      about their machinations and do so because institutions behave according to
      nature.
    label_justification: 'The counterargument directly targets the logical link in
      the target that uses naturalness as a justification: it shows that calling something
      ‘natural’ does not entail it is morally right or that it should be expected/accepted.
      Hence, the argument commits the Appeal to Nature fallacy rather than merely
      presenting a critique.'
