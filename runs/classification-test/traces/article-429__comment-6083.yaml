input:
  title: Tunisia has a disinformation problem, but (further) criminalizing speech
    won't solve it
  parent: ''
  target: It's only natural that the government wants to control the narrative about
    their machinations.  That's the way governments usually work (but not all have
    bad intentions).  They've always been crooked and not really concerned about the
    common people and their freedoms. As nature takes its course, so do institutions.  However,
    this doesn't negate the need for persistent vigilance and insistence on transparency
    and accountability.
