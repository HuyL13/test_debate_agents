  counterargument:
    decisive_counterargument: The mere fact that artists have historically highlighted
      social issues does not prove that listening to them now will actually spur meaningful
      societal change. A long‑standing practice by itself offers no evidence that
      the approach still yields the same outcomes or that it is the best way to address
      contemporary problems. Traditions can persist for reasons unrelated to their
      effectiveness, and adopting them without evaluating their current relevance
      is unfounded.
    candidate: Slippery Slope
    challenged_inference: Artists throughout history have made a habit of bringing
      attention to social causes, thus we should continue to embrace artists to spur
      societal change.
    label_justification: The objection exposes a *slippery slope* fallacy because
      the argument takes the historical habit of artists raising social causes and
      implicitly claims that continuing this practice will inevitably or inevitably
      lead to positive societal change. This links a single initial action (listening
      to artists) to a far‑reaching, unverified consequence (social change) without
      demonstrating a necessary causal chain. The reasoning assumes that because the
      pattern existed in the past, it will unfold similarly in the future, which is
      precisely the slippery‑slope logic.
