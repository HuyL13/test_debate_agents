  decisive_condition: The target’s reasoning rests on the claim that the workers on
    the project—who are asserted to “know what’s best” —provide the sole justification
    for building the mine, a reliance on an authority whose expertise is not corroborated
    as necessary for the claim, constituting an appeal to authority.
  decision_reason: The argument states that because the people in charge of the project
    (the workers) claim it is beneficial and would create jobs, the mine should be
    built. The workers are presented as the sole authority, and this reliance on their
    claim is an appeal to authority. Evidence supporting this is found in T1 (authority
    claim) and T3 (claimed benefit).
