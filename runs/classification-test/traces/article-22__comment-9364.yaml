input:
  title: Rejection of new Australian coal mine is a rare win for community environmental
    campaigners
  parent: ''
  target: So they listened to celebrities and locals who have no real understanding
    of climate change or the coal industry? The people who work on this project know
    what's best and would have provided many people jobs! The benefits to not building
    it aren't even known, but as the people in charge of the project said, the benefits
    to building it would have meant 300 families with jobs.
