    conclusion_or_goal: People should move to another platform because Facebook’s
      long‑standing tradition of censoring will not change.
    candidate: Appeal to Tradition
    supporting_reason: Facebook has always flagged posts that contain or promote opinions
      deemed unacceptable, a practice that has persisted since the beginning.
    support_relation: The argument cites Facebook's long-standing censorship practice
