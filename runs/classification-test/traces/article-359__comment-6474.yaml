input:
  title: 'Video: Two months of lockdown in Kashmir'
  parent: ''
  target: How far can lockdowns go? It starts with a few weeks, then it's months,
    and as noted here, there's no definitive end in sight. Before you know it, these
    governments will expect lockdowns to be the normal state of things with people
    living their entire lives indoors and maybe getting permission to venture outside
    every now and then.
