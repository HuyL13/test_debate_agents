  counterargument:
    decisive_counterargument: MLK Jr. is invoked to argue that riots are ineffective
      and therefore protest should be abandoned. In fact, MLK’s own statements championed
      non‑violent civil disobedience, not surrender to police authority. The target
      misuses the authority of an respected figure to justify a policy claim that
      follows no logical connection from the cited statement.
    candidate: Appeal to Authority
    challenged_inference: The argument that protesting won’t solve anything and students
      should obey police is supported by citing MLK Jr. as evidence of the inadequacy
      of riots.
    label_justification: The objection shows that the reasoning relies on the authority
      of an individual who actually advocated for non‑violent protest, not on a conclusion
      that protest is futile. This misapplication of an authority to justify a claim
      demonstrates an Appeal to Authority fallacy, rather than merely criticizing
      the argument.
