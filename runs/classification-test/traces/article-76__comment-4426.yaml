input:
  title: More Afghan journalists killed as militants ramp up attacks on Shiites
  parent: I find it incredible that this nation cannot come together after years and
    years of occupation and infighting, all in the name of religion. I find it very
    hard to understand why people who profess to be of the same religion cannot get
    along in any real way. There is a real need for unity in this situation - in the
    natural world, all things tend to live in harmony and peace and it should be this
    way in religious communities as well. After all you are the SAME religion with
    various practices within the sects. Think of the animal kingdom and various species
    that live in groups and they do not have the issues humans have - we are a part
    of that same animal kingdom so why can't we do the same, especially amongst those
    who base their participation in human life on religion? Humans need to learn how
    to live together, in spite of and because of our individual differences.
  target: You mention religion, and I think religious difference is the root of the
    problem. But I'm less optimistic about these groups finding any unity in their
    faith and thus a way to live in harmony. All religions are like this -- they serve
    to divide by magnifying differences instead of finding points of commonality.
    Historically, there have been attempts to bring these groups together, and it
    always falls apart on the basis of religion. Unfortunately, that means there is
    no path to religious harmony in this or any region of the world.
