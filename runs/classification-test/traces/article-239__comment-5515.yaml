    - and don't know what they're even protesting. There's a reason we don't let kids
      be politicians.
  counterargument:
    decisive_counterargument: The target’s claim that adults are automatically the
      best decision‑makers because they are adults and have experience constitutes
      an **appeal to authority/expertise**. It substitutes the mere fact that adults
      hold official positions for evidence that their views are inherently superior,
      ignoring that competence, judgment, and knowledge are not guaranteed simply
      by age or title. Furthermore it dismisses all youth dissent – which is frequently
      well‑reasoned – by invoking a blanket rule that “kids are kids” without supporting
      how that limits their knowledge about climate policy. This is a rejection of
      the argument based on an unsupported reliance on authority rather than on the
      merits of the specific claims put forward.
    candidate: Appeal to Authority
    challenged_inference: The inference that because adults run the country and have
      experience they automatically know better than children in climate policy decisions
    label_justification: The objection directly attacks the inference that authority
      (adult status and experience) justifies dismissing children’s arguments. This
      is the hallmark of the Appeal to Authority fallacy, as the target substitutes
      claimed authority for substantive evidence.
