  goal:
    conclusion_or_goal: Adults should make climate policy decisions, not children.
    candidate: Hasty Generalization
    supporting_reason: Kids are kids and don't know what they're even protesting.
    support_relation: used to justify that adults, being experienced, are the only
      suitable decision-makers for climate policy
    label_justification: The argument generalizes that all children lack knowledge
      about what they are protesting, an unwarranted overgeneralization that serves
