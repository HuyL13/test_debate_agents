  resolution:
    winner: Appeal to Authority
    decisive_test: Appeal to Authority
    loser_failure: The claim that adults should make climate policy decisions rests
      on the premise that adults, by virtue of running the country and having experience,
      are automatically better decision‑makers. The target explicitly presents this
      authority claim – 'Adults run the country. They know what to do as they have
      the experience.' – which is the mandatory structural condition for an Appeal
      to Authority. In contrast, the Hasty Generalization fallacy requires that a
      conclusion about a broad group be drawn from a specific, limited set of cases
      or singular observations. The target does not provide any distinct instance
      or sample from which to derive the overbroad claim about children; it merely
      states a blanket assertion that 'Kids are kids and don't know what they're even
      protesting.' Without a concrete sample that the generalization is built upon,
      the structure for a Hasty Generalization is incomplete, so the argument fails
      to satisfy its mandatory condition.
    evidence_ids:
    - T1
    - T2
    evidence_spans:
