  counterargument:
    decisive_counterargument: Assuming the majority's preference should dictate pandemic
      measures ignores the fact that large segments of the population often lack the
      technical knowledge needed to assess complex health risks. Relying solely on
      a popular vote can lead to policies that amplify fear or complacency, rather
      than those grounded in scientific evidence and expert risk assessment. Public
      health decisions must weigh empirical data and expert consensus, not just what
      most people say they want.
    candidate: Appeal to Majority
    challenged_inference: These sorts of things should be put up to a vote, because
      the majority's opinion on what risks they're willing to take should be the most
      important.
    label_justification: The argument appeals to the majority's preference as a sufficient
      reason for policy, asserting that democratic choice is paramount despite the
      complex, technical nature of public health decisions. This is a classic Appeal
      to Majority fallacy, where the popularity of an opinion is taken as evidence
      of its correctness.
