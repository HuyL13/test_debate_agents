input:
  title: As Ebola outbreak ends, coronavirus begins in DR Congo
  parent: ''
  target: Do the people of this country want to go through all of this all over again?
    Maybe they are only emboldened further to fight against COVID, but I feel like
    maybe they are tired of it all and the relative lack of danger compared to Ebola
