  goal:
    conclusion_or_goal: The speaker argues that society was better, safer, and kinder
      before traditional values were threatened, implying that the current changes
      (e.g., pride marches and churches’ opposition) are harmful.
    candidate: Appeal to Tradition
    supporting_reason: The argument links the past state of society’s well‑being to
      the existence of traditional values, suggesting that the preservation of these
      values is the cause of a better society.
    support_relation: The reason is presented as the justification for the conclusion
      that society was better prior to the shift away from traditional values.
    label_justification: The claim rests on the supposed virtue of historical continuity—traditional
      values are deemed good simply because they have existed—without providing independent
      evidence that they actually produced the claimed outcomes. This is a classic
      appeal to tradition.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    - T3
    evidence_spans:
    - Up until the past 15 years or so, pride marches were not a thing and the churches
      had the support of most everyone. They probably don't like the fact that
    - things are changing and our values are going away, so they are fighting for
      their beliefs! Society was much better, safer, and more kind before our traditional
      values were being
    - threatened.
  counterargument:
    decisive_counterargument: The claim that society was 'much better, safer, and
      more kind' only because traditional values were unthreatened is an *Appeal to
      Tradition*. It assumes that what was common or accepted in the past must be
      the best or only valid state of affairs, without demonstrating that the tradition
      itself caused the positive outcomes. Multiple social, economic, and cultural
      changes over the past decade could explain the differences, so concluding that
      tradition is the cause is unsupported.
    candidate: Appeal to Tradition
    challenged_inference: The inference that traditional values were the cause of
      a safer and kinder society is unsupported; the passage assumes that because
      the society was better before, it was because of tradition.
    label_justification: The objection directly targets the logical leap that past
      conditions assure the superiority of specific values, a classic instance of
      the Appeal to Tradition fallacy.
    failure_exposed: false
    evidence_ids:
    - T1
    - T2
    - T3
    evidence_spans:
    - Up until the past 15 years or so, pride marches were not a thing and the churches
      had the support of most everyone. They probably don't like the fact that
    - things are changing and our values are going away, so they are fighting for
      their beliefs! Society was much better, safer, and more kind before our traditional
      values were being
    - threatened.
