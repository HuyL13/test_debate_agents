    candidate: Appeal to Nature
  goal:
    conclusion_or_goal: The government should understand that people naturally want
      to choose local representatives and therefore act appropriately instead of quashing
      their concerns.
    candidate: Appeal to Nature
    supporting_reason: It is natural for people to want to choose their own leadership
      that actually represents their interests.
    support_relation: The argument claims that because a desire for local representation
      is a natural human tendency, the government has a moral obligation to respect
      that desire and act properly.
    label_justification: The reasoning relies on the naturalness of a preference to
      justify a normative claim about what the government must do, which is the structure
      of an appeal to nature fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - What does the government expect, when they're putting in an appointment that
      so many of the local people are against? It's natural for people to want to
