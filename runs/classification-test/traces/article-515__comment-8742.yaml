input:
  title: In Afghanistan, Governors Don't Just Step Down Because the President Asks
    Them To
  parent: ''
  target: What does the government expect, when they're putting in an appointment
    that so many of the local people are against? It's natural for people to want
    to choose their own leadership that actually represents their interests. The government
    should understand that and act appropriately instead of trying to quash their
    concerns.
