    - leadership that actually represents their interests. The government should understand
      that and act appropriately instead of trying to quash their concerns.
  counterargument:
    decisive_counterargument: The claim that it is natural for people to want to choose
      their own leadership does not logically justify that the government should adjust
      its appointments accordingly; naturalness is an irrelevant appeal to moral rightness.
    candidate: Appeal to Nature
    challenged_inference: Author's inference that the natural desire of people for
      representation mandates government action (i.e., the government should act appropriately
      instead of quashing concerns).
    label_justification: The counterargument directly attacks the logical link between
      the natural preference for local representation and the normative conclusion
      that the government must act appropriately. By pointing out that naturalness
      is an irrelevant basis for a normative claim, it exposes an Appeal to Nature
      fallacy rather than merely criticizing the argument’s content.
