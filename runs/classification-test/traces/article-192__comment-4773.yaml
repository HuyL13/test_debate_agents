    - if they don't have the same values on things like free speech that these Western
      institutions are criticizing them for.
    candidate: null
  goal:
    conclusion_or_goal: The argument asserts that Turkey’s government is legitimate
      and its policies should be respected, implying that there is no problem with
      these policies even if they differ from Western values.
    candidate: Appeal to Authority
    supporting_reason: the will of the Turkish people should be respected
    support_relation: provides the justificatory basis for the conclusion
    label_justification: The reasoning uses the authority of the people—the purported
      majority—as a justification for accepting the government’s policies, which is
      a classic appeal to authority (or majority) fallacy.
    mechanism_supports_goal: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Is Turkey not a democracy? If this is the government and subsequently the policies
      they voted for, what's the problem? The will of the Turkish people should be
      respected, even
    - if they don't have the same values on things like free speech that these Western
      institutions are criticizing them for.
  counterargument:
    decisive_counterargument: Majority support does not automatically validate a policy,
      especially when that policy may infringe on fundamental rights such as free
      speech.  A democratic legitimacy cannot erase the obligation to critique and
      amend decisions that conflict with basic liberties, and the belief that “they
      voted for it” is an appeal to popularity rather than a ground for accepting
      the policy.
    candidate: Appeal to Majority
    challenged_inference: The will of the Turkish people should be respected as a
      justification for the government’s policies, even if these policies conflict
      with principles such as free speech that other institutions consider important.
    label_justification: This objection attacks the claim that the majority’s vote
      alone justifies the policies, exposing a logical misuse of the majority’s will
      as a sole criterion.  That is the classic definition of an Appeal to Majority
      (ad populum) fallacy—using the fact that a large number of people support something
      to assert that it is right, without addressing substantive concerns, such as
      violations of free speech.
    failure_exposed: true
    evidence_ids:
    - T1
    - T2
    evidence_spans:
    - Is Turkey not a democracy? If this is the government and subsequently the policies
      they voted for, what's the problem? The will of the Turkish people should be
      respected, even
    - if they don't have the same values on things like free speech that these Western
      institutions are criticizing them for.
