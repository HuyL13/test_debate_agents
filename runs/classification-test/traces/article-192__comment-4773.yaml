input:
  title: In Turkey, a football federation joins a list of institutions with powers
    to censor content online
  parent: ''
  target: Is Turkey not a democracy? If this is the government and subsequently the
    policies they voted for, what's the problem? The will of the Turkish people should
    be respected, even if they don't have the same values on things like free speech
    that these Western institutions are criticizing them for.
