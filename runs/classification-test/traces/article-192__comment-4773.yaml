    winner: Appeal to Majority
    decisive_test: The argument claims that the Turkish people’s will should be respected
      as justification for the government’s policies, implying that majority approval
      alone validates those policies. This is a classic appeal to majority (ad populum)
      fallacy, where the popularity of a belief is used as the sole argument for its
      correctness, with no substantive support. The argument does not reference an
      expert or authoritative source, so it does not qualify as an appeal to authority.
    loser_failure: Appeal to Authority falls short because the text does not invoke
      any expert, official, or authoritative institution to validate the policies.
      Instead it relies on the number of people who voted for the government, which
      explicitly refers to majority support. Thus the justification is based on popularity,
      not on authority, making Appeal to Majority the correct label.
