input:
  title: Remembering Amadou Diallo, a Guinean victim of police brutality in the USA
  parent: ''
  target: Why does everyone think that a protest and movement will do anything? This
    has been going on for years and nothing has changed. Protesting isn't going to
    change it either. Think of all the protests we have seen on the past, most of
    them yielded no concrete changes. We should really think about how we can directly
    influence policy changes. Maybe the people protesting for change should be the
    first to sign up to be officers to begin the change? They could bring the perspective
    and actually effect the change they want to see from within. It would do a lot
    more to help than just standing outside with a sign, don't you think?
