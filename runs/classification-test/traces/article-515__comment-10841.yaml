  counterargument:
    decisive_counterargument: The claim that the governor’s refusal to proceed and
      ordering another’s arrest is a minor concern ignores that this episode signals
      a direct breach of constitutional order and undermines the very institutions
      needed to confront larger crises such as the Taliban, poverty and women’s rights.
      Ignoring this problem or treating it as less important, simply because other
      issues seem more pressing, falsely assumes that the two problems are mutually
      exclusive and that addressing them is impossible in tandem. In reality, a shaky
      rule‑of‑law foundation could worsen the very problems it tries to replace, so
      the governor matter cannot be dismissed merely by pointing to other challenges.
    candidate: Appeal to Worse Problems
    challenged_inference: The inference that the governor’s actions are far less important
