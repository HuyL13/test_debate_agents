  counterargument:
    decisive_counterargument: The claim that the ‘true’ democratic decision must be
      driven by majority public opinion ignores that this is a matter about individual
      rights, privacy and humanitarian obligations; majority preferences can be uninformed
      or biased and they can override the rights of a minority of refugees.  Simply
      appealing to the fact that most citizens vote for a policy does not justify
      abandoning established duties toward those who rely on UN‑managed registration.  Hence
      the argument relies on an *appeal to majority* fallacy.
    candidate: Appeal to Majority
    challenged_inference: Appealing to majority public opinion as the sole deciding
      factor in a refugee registration policy in a democracy.
    label_justification: 'The objection shows that the original claim treats majority
      opinion as the definitive measure of legitimacy, which is precisely the structure
      of an Appeal to Majority: using the number or popularity of a group as the proof
      of correctness.  This is distinct from other fallacies such as hasty generalization
      or false dilemma because it does not generalize from a sample or present a false
      dichotomy, but rather elevates majority opinion itself as the decisive standard.'
