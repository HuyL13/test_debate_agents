input:
  title: Refugees in Ethiopia's camps raise privacy and exclusion concerns over UNHCR’s
    new digital registration
  parent: The countries taking in refugees have more to worry about. Making sure they
    are accounted for, is essential. The problem of invisible refugees outweighs their
    privacy in a country they breached.
  target: I think I agree, but I think that's more something the people of the country
    should decide. It sounds like this is more a move by the UN than the actual countries
    themselves. Why don't their people put it to a vote? Majority opinion should be
    the deciding factor here, like everything else in a true democracy.
