input:
  title: New study finds internet censorship in Turkmenistan reaches over 122,000
    domains
  parent: ''
  target: Turkmenistan's internet censorship is no different from that of other authoritative
    state. The reality seems like this is something that has to be tolerated, since
    it either that or go without access. But, isn't censoring internet and stifling
    freedom of expression like living without access? Wouldn't it be better to fight
    for relaxed rules rather than accepting extreme censorship or no access, as if
    those are the only choices?
