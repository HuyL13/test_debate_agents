  title: Citizens from Chinese city on lockdown roar ‘Beijing has abandoned Wuhan!’
  parent: ''
  target: I think it's pretty clear the government simply couldn't do more and those
    complaints are not really reasonable. It's easy for armchair experts with no understanding
    of the actual issue to make those kinds of comments, but it's not fair. Either
