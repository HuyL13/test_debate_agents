  counterargument:
    decisive_counterargument: Just because a practice is part of a culture’s tradition
      does not mean it is morally justified or harmless. Traditions can be rooted
      in unjust or harmful beliefs, and legal and ethical norms evolve precisely to
      protect vulnerable populations. Mild corporal punishment, for example, has been
      linked to long‑term psychological harm, and child labor in family businesses
      can impede education and development. Therefore, the claim that tradition alone
      confers a right to such practices is unfounded.
    candidate: Appeal to Tradition
    challenged_inference: Things like kids working in the family business or mild
