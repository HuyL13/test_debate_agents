    conclusion_or_goal: 'Duterte only has two viable options: continue encouraging
      tough policing, or cleanse and rebuild the police force from scratch.'
    candidate: False Dilemma
    supporting_reason: The passage sets up an exclusive choice between continuing
      to encourage 'coarseness and brio' among police or cleansing/rebuilding the
      force, while rejecting reform as ineffective.
    support_relation: The two-way framing is used to illustrate that reform is not
      an option, a classic presentation of a false dilemma that narrows the decision
