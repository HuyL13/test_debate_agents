    decisive_counterargument: The claim that failure to fully account for policy brutality
      will inevitably result in police turning into judge, jury, and executioner relies
      on an unsubstantiated escalation. No evidence is provided that the mere lack
      of accountability leads to such extreme outcomes. It is entirely possible that
      stricter oversight, reforms, or public pressure could arrest the trend before
      it reaches that level. Therefore, the argument’s leap from incomplete accountability
      to total police overreach is unjustified.
