  counterargument:
    decisive_counterargument: You say that because governments own the media, the
      entire press is biased and aligns with government opinions. That is a sweeping
      generalization that ignores the large number of independent outlets that routinely
      publish balanced reporting, and it presents no evidence that the ownership alone
      leads to biased coverage. In short, the claim runs from a presumed condition
      (government ownership) to an unsubstantiated conclusion (complete bias) without
      providing any specific instances of bias.
    candidate: Hasty Generalization
    challenged_inference: The media over all is owned by governments who are able
      to push their own agendas as something that is fact instead of being unbiased.
      The media is no less corrupt then the ruling government parties and the elites.
      It is certainly no coincidence that the media stories generally align with the
      popular government opinions. Between the government and the big corporation's
      it's a wonder if we hear anything on the news that is truly truthful.
    label_justification: The objection points out that the argument generalizes from
      supposedly limited government ownership to an absolute claim about all media.
      This lack of evidence and sweeping conclusion is precisely the hallmark of a
      hasty generalization.
    failure_exposed: true
