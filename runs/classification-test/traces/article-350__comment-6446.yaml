  counterargument:
    decisive_counterargument: 'The claim that refugees have no inherent rights and
      therefore can be neglected is false and unjustifiable. By international law
      and basic moral reasoning, all individuals—whether refugee or not—bear inherent
      human rights such as dignity, safety, and the right to seek asylum. To dismiss
      refugees because there are other societal concerns reflects an Appeal to Worse
      Problems: it attempts to lower refugees’ moral priority by downplaying their
      rights in favour of presumed greater concerns. Hence the argument fails to provide
      a valid rationale for neglecting refugee protection.'
