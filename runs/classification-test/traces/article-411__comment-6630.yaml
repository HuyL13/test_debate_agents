  counterargument:
    decisive_counterargument: Even if a country has a history of censoring the internet,
      that fact alone does not justify continued censorship or imply it is inevitable
      or correct.  Nothing about a practice being 'natural' gives it moral or practical
      security; policies can be natural yet unjust or ineffective. The appeal to naturalness
      is a reasoned misuse of the premise that because something is historically common,
      it must persist or be defensible.
    candidate: Appeal to Nature
    challenged_inference: It is natural for the country to limit internet access because
      of its history.
    label_justification: The argument uses the premise that the country’s historical
      tendency to censor the internet is a natural condition, and derives a normative
      conclusion (that it is inevitable or justified) from this naturalness. This
      fits the pattern of an appeal to nature fallacy, where the claim of naturalness
      is used as a reason or justification for the policy.
