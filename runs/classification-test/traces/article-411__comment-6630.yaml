input:
  title: New study finds internet censorship in Turkmenistan reaches over 122,000
    domains
  parent: ''
  target: It's only natural for a country with a history such as theirs would try
    to limit internet access with censorship.  They won't let their people be free,
    no matter how much attention is brought to this problem.  The internet is about
    freedom personified so trying to control it is futile.
