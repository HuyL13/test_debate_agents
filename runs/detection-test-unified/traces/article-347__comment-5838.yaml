  counterargument:
    verdict: Fallacious
    candidate: Hasty Generalization
    mandatory_condition: The claim makes an unsupported generalization about the vast
      majority of NGOs based on no evidence.
    condition_satisfied: true
    decision_reason: 'The TARGET asserts that most NGOs mainly enrich themselves and
      waste money on admin costs, claiming that those in need receive little or nothing.
      This sweeping statement is made without providing any case-based evidence or
      representative data. The reasoning therefore commits a Hasty Generalization:
      it generalizes from an unstated, likely insufficient sample (none provided)
      to the whole population of NGOs. Consequently the objection that the claim is
      a hasty generalization wins over any defense that it could be a representative
      sample, since no such evidence is supplied. Thus the TARGET is fallacious.'
    opposing_reason: The statement could be justified by citing specific NGOs that
      over-spend on administration or show patterns of self-enrichment; lacking these
      references, the claim remains unsubstantiated. The defense that the claim may
      be based on a representative sample cannot be upheld because no sample is presented.
      Therefore the strongest objection stands.
    challenged_inference: NGOs often operate for self-enrichment, most don't do much
      more than burn cash on admin cost, while those in need get little to nothing.
    strongest_objection: 'This is a Hasty Generalization: it makes a broad claim about
      most NGOs without providing evidence or a representative sample.'
    strongest_defense: If the claim were supported by data on a representative sample
