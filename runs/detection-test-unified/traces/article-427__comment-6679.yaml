    - What can protesting in the street do to help what's going on in their job's
      building? Even a famous social scientist Dr. John Doe suggested that targeted
      dialogue to those
    - directed involved with an issue will be more impactful than public demonstrations
      in certain cases. I would think the emphasis would remain on dialogue and progress
      and not public displays
