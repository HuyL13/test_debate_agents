input:
  title: Why Did Women Journalists Strike in Spain?
  parent: Once you let them dictate rules against fairness, they will continue the
    problem. It only gets worse. Rights will be trampled and compromised.
  target: I understand why you think having a rule that you believe is unfair would
    be troubling and lead to more unfairness. I think we  need to look at the bigger
    picture here. A rule that you see is unfair might seem very fair to another person.
    Fairness is a very subjective issue and all of us will see it differently based
    on our experiences. Can you think of a rule or law that has been widely praised
    that you might see as unfair to yourself or others? Sometimes we need to look
    outside our own biases and see that other people can see things quite differently.
    Once we can see those differences we can then come together and find solutions
    that can meet all of our needs. I suggest that all of us meet with others with
    different opinions and listen to their views. That will be a great step for us
    all.
