input:
  title: The threat of a restrictive NGO law looms over Slovakia
  parent: From an American perspective, this just sounds like a good idea. How much
    has Russia and China and so on interfered in our elections? I bet Slovakia and
    most other countries probably have the same experience. Probably a very standard
    thing globally. Everyone should be able to identify all foreign interference in
    their internal affairs.
  target: Yes.  Let's worry about election interference and not homelessness.  Lets
    be real here.  NGOs do serve an important purpose, like providing essential services
    to those in need.  Of all the problems that governments should worry about,  NGOs
    influencing elections is not in the top 10.     Not even in the top 100,  really.    Lets
    focus on skyrocketing healthcare costs instead.  Or how about out crumbling educational
    system?  I guess kids don't need to go to school,  though,  and it's fine if Grandma
    has to sell her house to pay for her medicine.
zero_shot:
  label: Appeal to Worse Problems
  reason: The comment dismisses the issue of NGOs influencing elections by prioritizing
    other problems (healthcare, education) as more important, exemplifying the appeal
    to worse problems fallacy.
