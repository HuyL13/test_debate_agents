input:
  title: Password hack claim puts cyber security on the public agenda in North Macedonia
  parent: 'This incident, innocuous as it is, does raise awareness regarding the importance
    of the simplest aspects of cyber security, like solid passwords, etc. However,
    the national economy, COVID, and other factors seem like much more urgent foci
    for the government''s attention. Sure, shore up your passwords and do what should
    be done to keep the network secure, but let''s direct time and energy to the more
    central things: economy, healthcare, geopolitical issues, etc.'
  target: It seems like the government is addressing bigger problems. The hack wasn't
    serious, they took some steps to bolster security anyway, and then went about
    doing the government's business. I understand why the opposition party and others
    may want to inflate the importance of the event, but the government at least realizes
    that there are more pressing issues.
