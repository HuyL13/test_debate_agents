input:
  title: Should there be Shona-language versions of Google and social media sites?
    This Zimbawean technologist says yes
  parent: ''
  target: No doubt, people are naturally inclined to lean towards languages they are
    already fluent in. However, bringing the Shona language to an online platform
    is a worthy move. Even if it may feel alien to some, it's important to remember
    that the crux of any language is communication, something that is deeply ingrained
    in our DNA as human beings. Even as we honor the intrinsic direction of linguistic
    choices, one should not undermine the earnest attempts made to protect cultural
    jewels like the Shona language. The Internet, a key instrument in our lives, is
    gradually shaping our communication practices.
