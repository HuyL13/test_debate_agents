input:
  title: Jamaicans agonise, politicians seek solutions after another young woman is
    killed
  parent: ''
  target: Totally unacceptable to see the rising murder rates in Jamaica and they
    were already the highest in Latin America previously. This needs to be stopped
    and it needs to be stopped quickly. I was a bit bewildered by the idea of legalizing
    pepper spray as some sort of fix for this problem. I understand that we want to
    give women the right to defend themselves, but I feel like there are much bigger
    issues to deal with first. How about actually getting to the root of the problem
    that is causing all these murders? We need to create a whole range of programs
    that address violence and allows us to learn how this problem is engrained in
    the society at a young age. We all can be a part of this solution, by talking
    to those around us and making sure that everyone learns through love and empathy.
    The pepper spray is a quick fix and it may have its place eventually, but lets
    hit this major problem first.
