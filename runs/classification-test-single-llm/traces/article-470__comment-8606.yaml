  title: Latin American Facebook users weigh in on US election results with memes
  parent: People being allowed to express themselves is vital but not everyone is
    funny. People need to be able to post funny memes that appeal to the masses and
    not depressing ones that reflect our reality. There are only two types of memes,
    funny or depressing.
  target: I agree. Comics have a long standing rule that states a good joke makes
    you the target and not the audience. It's sad to see that tradition go away for
    cheap laughs at someone elses' expense. I am not sure when that was lost in the
    comedy world, but it had its costs. It could dramatically alter the comic genre
    and not for the better. Remember the days when comedians would push the boundaries
    of their imaginations for a creative and non-insulting punchline? Now that was
    real entertainment! What do you think?
