data_dir: data/cocolofa/classification
context: paper
cache_dir: cache/courtroom_rl
model:
  provider: openai_compatible
  name_env: NVIDIA_MODEL
  base_url_env: NVIDIA_BASE_URL
  api_key_env: NVIDIA_API_KEY
  temperature: 0.3
  max_completion_tokens: 1600
  timeout_seconds: 120
  max_attempts: 2
  backoff_seconds: 1
  reasoning_effort: null
  structured_output: false
budget:
  max_decisions: 8
  max_calls: 8
  max_tokens: 24000
  max_claims: 3
reward:
  mode: crew
  progress_scale: 0.3
  local_weight: 0.4
  board_weight: 0.6
  weight_start: 0.2
  weight_end: 0.8
  episode_progress_cap: 0.5
  token_cost_basis: auto
  alpha: 0.25
  gamma: 0.99
  step_cost: 0.01
  token_cost: 0.00001
  call_cost: 0
  invalid_cost: 0.1
assessor:
  path: cache/courtroom_rl/assessor.joblib
  seed: 0
  max_features: 20000
ppo:
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip: 0.2
  epochs: 4
  entropy: 0.01
