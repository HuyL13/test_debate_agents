task: classification
data_dir: data/cocolofa
split: dev
context: paper
engine:
  mode: adaptive
  protocol: round_robin
  max_rounds: 1
  early_stop: true
  adaptive_policy: adversarial
  use_patterns: true
  defender_policy: evidence_v2
model:
  provider: openai_compatible
  name: Llama-3.3-70B-Instruct
  base_url: https://mkp-api.fptcloud.com/v1
  api_key_env: MARKET_API_KEY
  temperature: 0.6
  max_completion_tokens: 4096
  timeout_seconds: 180
  max_attempts: 3
  backoff_seconds: 2
  structured_output: false
  input_cost_per_million: null
  output_cost_per_million: null
  cached_input_cost_per_million: null
output_dir: outputs/defender-v2-llama70b-dev
cache_dir: cache
