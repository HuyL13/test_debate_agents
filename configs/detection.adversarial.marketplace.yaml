task: detection
data_dir: data/dev_classification_errors
split: dev
context: paper
engine:
  mode: adaptive
  protocol: round_robin
  max_rounds: 1
  early_stop: true
  adaptive_policy: adversarial
  use_patterns: true
model:
  provider: openai_compatible
  name: gpt-oss-120b
  base_url: https://mkp-api.fptcloud.com/v1
  api_key_env: MARKET_API_KEY
  temperature: 0.2
  max_completion_tokens: 2048
  timeout_seconds: 120
  max_attempts: 3
  backoff_seconds: 1
  structured_output: true
  input_cost_per_million: null
  output_cost_per_million: null
  cached_input_cost_per_million: null
output_dir: outputs/marketplace-detection-adversarial-gptoss120b-dev66-v1
cache_dir: cache/adversarial_detection
