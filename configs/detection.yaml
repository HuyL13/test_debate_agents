task: detection
data_dir: data/cocolofa
split: dev
context: paper

model:
  provider: openai_compatible
  name_env: NVIDIA_MODEL
  base_url_env: NVIDIA_BASE_URL
  api_key_env: NVIDIA_API_KEY
  temperature: 1.0
  max_completion_tokens: 1600
  timeout_seconds: 120
  max_attempts: 3

output_root: runs
cache_dir: cache
