[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocolofa-pard"
version = "0.1.0"
description = "Conflict-guided multi-agent reasoning for the two original CoCoLoFa tasks"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
    "jsonschema==4.23.0",
    "python-dotenv==1.0.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["atomic_resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
